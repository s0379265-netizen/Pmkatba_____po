============================================================ */

const CAM_SENSITIVITY_Y = 0.0032;

/* ============================================================
   Audio Engine
============================================================ */
const AudioEngine = {
  ctx: null, source: null, gainNode: null, buffer: null,
  loaded: false, isMuted: false,
  baseRPM: 800, maxRPM: 7000,
  currentRPM: 800, targetRPM: 800,
  baseVolume: 0.35, maxVolume: 0.85,
  isStarting: false,
  
  async init(){
    if(this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      const response = await fetch(SOUND_URL);
      const arrayBuffer = await response.arrayBuffer();
      this.buffer = await this.ctx.decodeAudioData(arrayBuffer);
      this.loaded = true;
      this.gainNode = this.ctx.createGain();
      this.gainNode.gain.value = 0;
      this.gainNode.connect(this.ctx.destination);
    } catch(e){ console.warn("Audio:", e); }
  },
  
  playStartup(){
    if(!this.loaded || this.isMuted) return;
    if(this.ctx.state === "suspended") this.ctx.resume();
    this.stop();
    this.source = this.ctx.createBufferSource();
    this.source.buffer = this.buffer;
    this.source.loop = false;
    this.source.connect(this.gainNode);
    this.gainNode.gain.cancelScheduledValues(this.ctx.currentTime);
    this.gainNode.gain.setValueAtTime(0.6, this.ctx.currentTime);
    this.source.start(0);
    this.isStarting = true;
    this.source.onended = () => {
      this.isStarting = false;
      this.startIdleLoop();
    };
  },
  
  startIdleLoop(){
    if(!this.loaded || this.isMuted || !this.ctx) return;
    this.stop();
    this.source = this.ctx.createBufferSource();
    this.source.buffer = this.buffer;
    this.source.loop = true;
    this.source.loopStart = 0;
    this.source.loopEnd = 5.0;
    this.source.connect(this.gainNode);
    this.gainNode.gain.cancelScheduledValues(this.ctx.currentTime);
    this.gainNode.gain.setValueAtTime(this.baseVolume, this.ctx.currentTime);
    this.source.start(0);
    this.isStarting = false;
  },
  
  stop(){
    if(this.source){
      try { this.source.stop(); } catch(e){}
      try { this.source.disconnect(); } catch(e){}
      this.source = null;
    }
  },
  
  setMuted(m){ this.isMuted = m; if(m) this.stop(); },
  
  update(dt, carSpeed, isGas, isReverse, isDriving){
    if(!this.loaded || this.isMuted || !this.ctx || !isDriving) return;
    const speedRatio = Math.min(1, Math.abs(carSpeed) * 3.6 / 80);
    if(isGas) this.targetRPM = this.baseRPM + speedRatio * (this.maxRPM - this.baseRPM) + 1500;
    else if(isReverse) this.targetRPM = this.baseRPM + speedRatio * 2000;
    else this.targetRPM = this.baseRPM + speedRatio * 1500;
    this.currentRPM += (this.targetRPM - this.currentRPM) * Math.min(1, dt * 4);
    if(this.source){
      const rpmRatio = (this.currentRPM - this.baseRPM) / (this.maxRPM - this.baseRPM);
      const target = 0.75 + rpmRatio * 0.85;
      const cur = this.source.playbackRate.value;
      this.source.playbackRate.setValueAtTime(cur + (target - cur) * Math.min(1, dt * 6), this.ctx.currentTime);
    }
    let targetVolume = this.isStarting ? 0.6 : (isGas ? this.baseVolume + (this.maxVolume - this.baseVolume) * 0.9 : (isReverse ? this.baseVolume + 0.15 : this.baseVolume));
    if(this.gainNode){
      const cg = this.gainNode.gain.value;
      this.gainNode.gain.setValueAtTime(cg + (targetVolume - cg) * Math.min(1, dt * 5), this.ctx.currentTime);
    }
  }
};

/* ============================================================

============================================================ */
const draco = new DRACOLoader();

/* ============================================================
   Loading UI
============================================================ */
const loadingText = document.getElementById("loadingText");
const progressBar = document.getElementById("progressBar");
const loadingDiv = document.getElementById("loading");
const cityProgress = document.getElementById("cityProgress");
const cityBar = document.getElementById("cityBar");

let totalAssets = 3;   // building + soldier + ferrari
let loadedAssets = 0;
let failedAssets = 0;

function updateLoadingProgress(){
  const percent = 25 + ((loadedAssets + failedAssets) / totalAssets) * 75;
  progressBar.style.width = Math.min(100, percent) + "%";
  loadingText.textContent = `در حال بارگذاری... ${Math.round(percent)}%`;
  if(loadedAssets + failedAssets >= totalAssets){
    setTimeout(() => {
      loadingText.textContent = "✅ آماده! (شهر در حال لود...)";
      progressBar.style.width = "100%";
      setTimeout(() => loadingDiv.classList.add("hidden"), 500);
    }, 200);
  }
}
progressBar.style.width = "25%";
function assetDone(){ loadedAssets++; updateLoadingProgress(); }
function assetFail(e, n){ failedAssets++; console.warn("❌", n, e); updateLoadingProgress(); }

/* ============================================================
   Helpers
============================================================ */
function prep(obj, disableShadow){
  if(!obj) return;
  obj.traverse(o=>{
    if(o.isMesh){
      // ⭐ برای شهر سایه رو خاموش می‌کنیم (کارایی)
      if(!disableShadow){
        o.castShadow = true;
        o.receiveShadow = true;
      } else {
        o.castShadow = false;
        o.receiveShadow = false;
      }
      if(o.material){
        o.material.needsUpdate = true;
        if("roughness" in o.material) o.material.roughness = 0.85;
      }
    }
  });
}

function placeOnGround(model, targetHeight, targetX, targetZ, rotationY){
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  if(targetHeight && size.y > 0){
    const scale = targetHeight / size.y;
    model.scale.setScalar(scale);
  }
  if(rotationY) model.rotation.y = rotationY;
  model.updateMatrixWorld(true);
  const box2 = new THREE.Box3().setFromObject(model);
  const center = box2.getCenter(new THREE.Vector3());
  model.position.set(
    targetX - center.x,
    -box2.min.y,
    targetZ - center.z
  );
}

/* ============================================================
   Collision
============================================================ */
const colliders = [];

function addBoxCollider(box, name){
  colliders.push({ box: box.clone(), name });
}

function checkSphereCollision(x, z, radius, box){
  const cx = Math.max(box.min.x, Math.min(x, box.max.x));
  const cz = Math.max(box.min.z, Math.min(z, box.max.z));
  const dx = x - cx;
  const dz = z - cz;
  return (dx*dx + dz*dz) < radius * radius;
}

function resolveCharacterMove(oldX, oldZ, newX, newZ, radius){
  let finalX = newX, finalZ = newZ;
  let collision = false;
  for(const c of colliders){
    if(checkSphereCollision(newX, newZ, radius, c.box)){ collision = true; break; }
  }
  if(collision){
    let xOK = true, zOK = true;
    for(const c of colliders){
      if(checkSphereCollision(newX, oldZ, radius, c.box)) xOK = false;
      if(checkSphereCollision(oldX, newZ, radius, c.box)) zOK = false;
    }
    if(xOK && !zOK){ finalX = newX; finalZ = oldZ; }
    else if(!xOK && zOK){ finalX = oldX; finalZ = newZ; }
    else if(!xOK && !zOK){ finalX = oldX; finalZ = oldZ; }
    else {
      if(Math.abs(newX-oldX) < Math.abs(newZ-oldZ)){ finalX = newX; finalZ = oldZ; }
      else { finalX = oldX; finalZ = newZ; }
    }
  }
  return { x: finalX, z: finalZ, collision };
}

function checkCarCollision(carX, carZ, carYaw, halfW, halfL){
  const cos = Math.cos(carYaw);
  const sin = Math.sin(carYaw);
  const corners = [
    { x: halfW, z: halfL }, { x: halfW, z: -halfL },
    { x: -halfW, z: halfL }, { x: -halfW, z: -halfL }
  ];
  for(const corner of corners){
    const wx = carX + corner.x * cos - corner.z * sin;
    const wz = carZ + corner.x * sin + corner.z * cos;
    for(const c of colliders){
      if(wx > c.box.min.x && wx < c.box.max.x &&
         wz > c.box.min.z && wz < c.box.max.z) return true;
    }
  }
  return false;
}

/* ============================================================
   Load City (Virtual City) - Progressive Loading
   
   ⭐ این مدل خیلی سنگینه:
   - سایه‌ها خاموش (کارایی)
   - فقط ساختمون‌های بزرگ collider می‌گیرن
   - موقعیت: پشت ساختمون اصلی، دور از اسپاون
============================================================ */
console.log("🏙️ شروع لود شهر...");
loader.load(CITY_URL, (gltf) => {
  try {
    const city = gltf.scene;
    
    // ⭐ سایه خاموش برای کارایی
    prep(city, true);
    
    // ⭐ بهینه‌سازی: حذف mesh های خیلی کوچیک
    const toRemove = [];
    city.traverse(o => {
      if(o.isMesh && o.geometry){
        // حذف mesh هایی با خیلی کم polygon (احتمالاً جزئیات ریز)
        const posCount = o.geometry.attributes.position?.count || 0;
        if(posCount < 20) toRemove.push(o);
      }
    });
    toRemove.forEach(o => o.parent && o.parent.remove(o));
    
    // ⭐ مقیاس شهر
    const box = new THREE.Box3().setFromObject(city);
    const size = box.getSize(new THREE.Vector3());
    console.log("📐 ابعاد شهر:", size.x.toFixed(1), size.y.toFixed(1), size.z.toFixed(1));
    
    // مقیاس: ارتفاع شهر حدود 30 متر باشه
    const targetHeight = 35;
    const cityScale = targetHeight / Math.max(size.y, 1);
    city.scale.setScalar(cityScale);
    
    // ⭐ موقعیت: پشت ساختمون اصلی
    city.updateMatrixWorld(true);
    const box2 = new THREE.Box3().setFromObject(city);
    const center = box2.getCenter(new THREE.Vector3());
    
    const CITY_X = 70;
    const CITY_Z = -50;
    city.position.set(
      CITY_X - center.x,
      -box2.min.y,
      CITY_Z - center.z
    );
    
    scene.add(city);
    
    // ⭐⭐ Collider فقط برای ساختمون‌های بزرگ شهر
    // به جای هر mesh، یه Box3 کلی از کل شهر می‌سازیم
    // کاربر فقط نمی‌تونه از داخل شهر رد بشه (نه هر ساختمونش)
    city.updateMatrixWorld(true);
    const cityBox = new THREE.Box3().setFromObject(city);
    // جمع کردن کمی داخل (تا بشه نزدیکش رفت)
    cityBox.expandByScalar(-3);
    addBoxCollider(cityBox, "city");
    
    console.log("✅ شهر لود شد | موقعیت:", CITY_X, CITY_Z, "| scale:", cityScale.toFixed(3));
    console.log("📦 تعداد mesh های شهر:", city.children.length);
  } catch(e){ 
    console.warn("City load error:", e); 
  }
},

/* ============================================================
   Animation helpers
============================================================ */
function pickClip(clips, keywords){
  for(const kw of keywords){
    const found = clips.find(c => c.name && c.name.toLowerCase().includes(kw));
    if(found) return found;
  }
  return null;
}

/* ============================================================
   Load Ferrari
============================================================ */
loader.load(FERRARI_URL, (gltf) => {
  try {
    carModel = gltf.scene;
    prep(carModel, false);

    const wheelGroups = { fl: null, fr: null, rl: null, rr: null };
    carModel.traverse((node) => {
      const name = (node.name || "").toLowerCase();
      if(name === "wheel_fl") wheelGroups.fl = node;
      else if(name === "wheel_fr") wheelGroups.fr = node;
      else if(name === "wheel_rl") wheelGroups.rl = node;
      else if(name === "wheel_rr") wheelGroups.rr = node;
    });

    if(!wheelGroups.fl || !wheelGroups.fr || !wheelGroups.rl || !wheelGroups.rr){
      const candidates = [];
      carModel.traverse(n => {
        if(n.isObject3D && n !== carModel){
          const nm = (n.name || "").toLowerCase();
          if(nm.includes("wheel") || nm.includes("tire")) candidates.push(n);
        }
      });
      if(candidates.length >= 4){
        carModel.updateMatrixWorld(true);
        const carBox = new THREE.Box3().setFromObject(carModel);
        const carCenter = carBox.getCenter(new THREE.Vector3());
        const wP = candidates.map(w => {
          const b = new THREE.Box3().setFromObject(w);
          const c = b.getCenter(new THREE.Vector3());
          return { node: w, x: c.x - carCenter.x, z: c.z - carCenter.z };
        });
        wP.sort((a,b) => b.z - a.z);
        const front = wP.slice(0,2).sort((a,b) => a.x - b.x);
        const rear = wP.slice(2,4).sort((a,b) => a.x - b.x);
        if(!wheelGroups.fl) wheelGroups.fl = front[0]?.node;
        if(!wheelGroups.fr) wheelGroups.fr = front[1]?.node;
        if(!wheelGroups.rl) wheelGroups.rl = rear[0]?.node;
        if(!wheelGroups.rr) wheelGroups.rr = rear[1]?.node;
      }
    }

    function setupWheel(wg, key, isFront){
      if(!wg || !wg.parent) return;
      const parent = wg.parent;
      const localPos = wg.position.clone();
      const origRot = wg.rotation.clone();
      const steerWrapper = new THREE.Group();
      steerWrapper.position.copy(localPos);
      steerWrapper.rotation.order = "YXZ";
      wg.position.set(0,0,0);
      wg.rotation.order = "YXZ";
      wg.rotation.copy(origRot);
      parent.remove(wg);
      parent.add(steerWrapper);
      steerWrapper.add(wg);
      carWheels[key] = { steerGroup: steerWrapper, spinGroup: wg, isFront };
    }

    if(wheelGroups.fl) setupWheel(wheelGroups.fl, "fl", true);
    if(wheelGroups.fr) setupWheel(wheelGroups.fr, "fr", true);
    if(wheelGroups.rl) setupWheel(wheelGroups.rl, "rl", false);
    if(wheelGroups.rr) setupWheel(wheelGroups.rr, "rr", false);

    const box = new THREE.Box3().setFromObject(carModel);
    const size = box.getSize(new THREE.Vector3());
    carHalfWidth = size.x * 0.32;
    carHalfLength = size.z * 0.38;
    
    const groundY = -box.min.y;
    carModel.position.set(carState.position.x, groundY, carState.position.z);
    carState.position.y = groundY;
    carModel.rotation.y = carState.rotation + CAR_MODEL_YAW_OFFSET;
    scene.add(carModel);
  } catch(e){ console.warn(e); }
  assetDone();
}, undefined, e => assetFail(e, "ferrari"));

/* ============================================================
   Animation switching
============================================================ */
function setAction(name){
  const next = actions[name];
  if(!next || next === currentAction) return;
  if(currentAction) currentAction.fadeOut(0.2);
  next.reset().fadeIn(0.2).play();
  currentAction = next;
}

/* ============================================================
   Floating Joystick
============================================================ */
const joyZoneLeft = document.getElementById("joyZoneLeft");
const joyBaseFloat = document.getElementById("joyBaseFloat");
const joyKnobFloat = document.getElementById("joyKnobFloat");

const joy = {
  active: false, pointerId: null,
  originX: 0, originY: 0,
  maxRadius: 55,
  moveX: 0, moveY: 0
};

joyZoneLeft.addEventListener("pointerdown", (e) => {
  if(mode !== "walking" || joy.active) return;
  e.preventDefault();
  joyZoneLeft.setPointerCapture(e.pointerId);
  joy.active = true;
  joy.pointerId = e.pointerId;
  joy.originX = e.clientX;
  joy.originY = e.clientY;
  joy.moveX = 0;
  joy.moveY = 0;
  const rect = joyZoneLeft.getBoundingClientRect();
  const lx = e.clientX - rect.left, ly = e.clientY - rect.top;
  joyBaseFloat.style.left = lx + "px";
  joyBaseFloat.style.top = ly + "px";
  joyKnobFloat.style.left = lx + "px";
  joyKnobFloat.style.top = ly + "px";
  joyBaseFloat.classList.add("active");
  joyKnobFloat.classList.add("active");
}, { passive: false });

joyZoneLeft.addEventListener("pointermove", (e) => {
  if(!joy.active || e.pointerId !== joy.pointerId) return;
  e.preventDefault();
  let dx = e.clientX - joy.originX, dy = e.clientY - joy.originY;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if(dist > joy.maxRadius){ const s = joy.maxRadius/dist; dx *= s; dy *= s; }
  joy.moveX = dx / joy.maxRadius;
  joy.moveY = -dy / joy.maxRadius;
  const rect = joyZoneLeft.getBoundingClientRect();
  joyKnobFloat.style.left = (joy.originX - rect.left + dx) + "px";
  joyKnobFloat.style.top = (joy.originY - rect.top + dy) + "px";
}, { passive: false });

function releaseJoy(e){
  if(!joy.active || e.pointerId !== joy.pointerId) return;
  joy.active = false; joy.pointerId = null;
  joy.moveX = 0; joy.moveY = 0;
  joyBaseFloat.classList.remove("active");
  joyKnobFloat.classList.remove("active");
}
joyZoneLeft.addEventListener("pointerup", releaseJoy);
joyZoneLeft.addEventListener("pointercancel", releaseJoy);
joyZoneLeft.addEventListener("lostpointercapture", releaseJoy);

}, { passive: false });

/* ============================================================
   Character walk - نسبت به دوربین
============================================================ */
const tmpDir = new THREE.Vector3();
const WALK_SPEED = 3.5;
const RUN_SPEED  = 5.5;

function updateCharacterWalk(dt){
  if(!character || !character.visible) return;
  let inputX = joy.moveX;
  let inputY = joy.moveY;
  if(keys.forward) inputY = 1;
  if(keys.back) inputY = -1;
  if(keys.left) inputX = -1;
  if(keys.right) inputX = 1;
  
  const camYaw = cameraBaseYaw + cameraUserYaw;
  const cFX = Math.sin(camYaw), cFZ = Math.cos(camYaw);
  const cRX = Math.sin(camYaw + Math.PI/2), cRZ = Math.cos(camYaw + Math.PI/2);
  tmpDir.set(cFX * inputY + cRX * inputX, 0, cFZ * inputY + cRZ * inputX);
  
  const magnitude = Math.min(1, Math.sqrt(inputX*inputX + inputY*inputY));
  const moving = magnitude > 0.1;
  
  if(moving && tmpDir.lengthSq() > 0.0001){
    tmpDir.normalize();
    const isRunning = magnitude > 0.85;
    const speed = (isRunning ? RUN_SPEED : WALK_SPEED) * magnitude;
    const oldX = character.position.x;
    const oldZ = character.position.z;
    let newX = oldX + tmpDir.x * speed * dt;
    let newZ = oldZ + tmpDir.z * speed * dt;
    newX = Math.max(-WORLD_LIMIT, Math.min(WORLD_LIMIT, newX));
    newZ = Math.max(-WORLD_LIMIT, Math.min(WORLD_LIMIT, newZ));
    const resolved = resolveCharacterMove(oldX, oldZ, newX, newZ, CHAR_RADIUS);
    character.position.x = resolved.x;
    character.position.z = resolved.z;
    
    const aDX = resolved.x - oldX;
    const aDZ = resolved.z - oldZ;
    if(aDX*aDX + aDZ*aDZ > 0.0001){
      const targetAngle = Math.atan2(aDX, aDZ);
      let diff = targetAngle - charYaw;
      while(diff > Math.PI) diff -= Math.PI*2;
      while(diff < -Math.PI) diff += Math.PI*2;
      charYaw += diff * Math.min(1, 10 * dt);
      character.rotation.y = charYaw + MODEL_YAW_OFFSET;
    }
    if(actions.run && isRunning) setAction("run");
    else if(actions.walk) setAction("walk");
    else if(actions.idle) setAction("idle");
  } else {
    if(actions.idle) setAction("idle");
  }
}

/* ============================================================
   Car driving
============================================================ */
let wasMoving = false;

function updateCarDrive(dt){
  if(!carModel) return;

  let steerTarget = 0;
  if(carKeys.left) steerTarget = carState.maxSteerAngle;
  if(carKeys.right) steerTarget = -carState.maxSteerAngle;
  if(steerTarget !== 0) carState.steerAngle += (steerTarget - carState.steerAngle) * carState.steerSpeed * dt;
  else carState.steerAngle += (0 - carState.steerAngle) * carState.steerReturn * dt;

  if(carKeys.brake){
    if(carState.speed > 0) carState.speed = Math.max(0, carState.speed - carState.brakingForce * dt);
    else if(carState.speed < 0) carState.speed = Math.min(0, carState.speed + carState.brakingForce * dt);
  } else if(carKeys.forward){
    carState.speed = Math.min(carState.maxForwardSpeed, carState.speed + carState.acceleration * dt);
  } else if(carKeys.reverse){
    if(carState.speed > 0) carState.speed = Math.max(0, carState.speed - carState.brakingForce * dt);
    else carState.speed = Math.max(-carState.maxReverseSpeed, carState.speed - carState.reverseAcceleration * dt);
  } else {
    if(Math.abs(carState.speed) > 0.05){
      const f = carState.friction * dt;
      if(carState.speed > 0) carState.speed = Math.max(0, carState.speed - f);
      else carState.speed = Math.min(0, carState.speed + f);
    } else carState.speed = 0;
  }

  let newRot = carState.rotation;
  if(Math.abs(carState.speed) > 0.1){
    const sp = Math.abs(carState.speed) / carState.maxForwardSpeed;
    const sf = Math.min(1, 0.4 + (1 - sp) * 0.8);
    const dir = carState.speed >= 0 ? 1 : -1;
    newRot += carState.steerAngle * dir * sf * 1.8 * dt;
  }

  const fX = Math.sin(newRot), fZ = Math.cos(newRot);
  let newX = carState.position.x + fX * carState.speed * dt;
  let newZ = carState.position.z + fZ * carState.speed * dt;
  newX = Math.max(-WORLD_LIMIT, Math.min(WORLD_LIMIT, newX));
  newZ = Math.max(-WORLD_LIMIT, Math.min(WORLD_LIMIT, newZ));

  const willCollide = checkCarCollision(newX, newZ, newRot, carHalfWidth, carHalfLength);
  if(!willCollide){
    carState.rotation = newRot;
    carState.position.x = newX;
    carState.position.z = newZ;
  } else {
    const xCol = checkCarCollision(newX, carState.position.z, newRot, carHalfWidth, carHalfLength);
    const zCol = checkCarCollision(carState.position.x, newZ, newRot, carHalfWidth, carHalfLength);
    if(!xCol && zCol){ carState.rotation = newRot; carState.position.x = newX; carState.speed *= 0.6; }
    else if(xCol && !zCol){ carState.rotation = newRot; carState.position.z = newZ; carState.speed *= 0.6; }
    else { carState.speed *= 0.2; if(Math.abs(carState.speed) < 0.3) carState.speed = 0; }
  }

  carModel.position.copy(carState.position);
  carModel.rotation.y = carState.rotation + CAR_MODEL_YAW_OFFSET;

  carState.wheelRotation += carState.speed * dt * 2.5;
  const wr = carState.wheelRotation;
  if(carWheels.fl.steerGroup) carWheels.fl.steerGroup.rotation.y = carState.steerAngle;
  if(carWheels.fr.steerGroup) carWheels.fr.steerGroup.rotation.y = carState.steerAngle;
  if(carWheels.fl.spinGroup) carWheels.fl.spinGroup.rotation.x = wr;
  if(carWheels.fr.spinGroup) carWheels.fr.spinGroup.rotation.x = wr;
  if(carWheels.rl.spinGroup) carWheels.rl.spinGroup.rotation.x = wr;
  if(carWheels.rr.spinGroup) carWheels.rr.spinGroup.rotation.x = wr;

  const isMoving = Math.abs(carState.speed) > 0.5;
  AudioEngine.update(dt, carState.speed, carKeys.forward, carKeys.reverse, mode === "driving");
  
  if(isMoving && !wasMoving) onCarMoving();
  else if(!isMoving && wasMoving) onCarStopped();
  wasMoving = isMoving;

  const kmh = Math.abs(carState.speed * 3.6);
  carSpeedEl.textContent = kmh.toFixed(0);
  speedBarFill.style.width = Math.min(100, (kmh / (carState.maxForwardSpeed * 3.6)) * 100) + "%";
  if(carState.speed > 0.3){ gearIndicator.textContent = "D"; gearIndicator.className = ""; }
  else if(carState.speed < -0.3){ gearIndicator.textContent = "R"; gearIndicator.className = "reverse"; }
  else { gearIndicator.textContent = "N"; gearIndicator.className = "neutral"; }
}

function onCarMoving(){ if(AudioEngine.gainNode && AudioEngine.source === null) AudioEngine.startIdleLoop(); }
function onCarStopped(){ if(AudioEngine.gainNode && AudioEngine.source === null) AudioEngine.startIdleLoop(); }

/* ============================================================
   Proximity
============================================================ */
function checkEnterCarProximity(){
  if(mode !== "walking" || !character || !carModel){
    enterCarBtn.classList.remove("show");
    return;
  }
  const dx = character.position.x - carState.position.x;
  const dz = character.position.z - carState.position.z;
  if(Math.sqrt(dx*dx + dz*dz) < ENTER_DISTANCE) enterCarBtn.classList.add("show");
  else enterCarBtn.classList.remove("show");
}

/* ============================================================
   Camera
============================================================ */
const cameraState = {
  smoothTarget: new THREE.Vector3(0, 1, 0),
  transitioning: false,
  transitionProgress: 1
};

const currentCamParams = {
  distance: CAM_WALK.distance,
  height: CAM_WALK.height,
  lookHeight: CAM_WALK.lookHeight
};

function dampAngle(current, target, lambda, dt){
  let diff = target - current;
  while(diff > Math.PI) diff -= Math.PI * 2;
  while(diff < -Math.PI) diff += Math.PI * 2;
  return current + diff * (1 - Math.exp(-lambda * dt));
}

const _cameraDesired = new THREE.Vector3();
const _lookAtTarget = new THREE.Vector3();

function updateCamera(dt){
  let targetPos = null, refYaw = 0, targetCam = null;
  if(mode === "driving" && carModel){
    targetPos = carState.position;
    refYaw = carState.rotation;
    targetCam = CAM_DRIVE;
  } else if(character){
    targetPos = character.position;
    refYaw = charYaw;
    targetCam = CAM_WALK;
  } else return;

  const yawLambda = (mode === "driving") ? 8.0 : 5.0;
  cameraBaseYaw = dampAngle(cameraBaseYaw, refYaw, yawLambda, dt);

  if(cameraState.transitioning){
    cameraState.transitionProgress = Math.min(1, cameraState.transitionProgress + dt * 1.5);
    const t = cameraState.transitionProgress;
    const s = t * t * (3 - 2 * t);
    currentCamParams.distance = THREE.MathUtils.lerp(currentCamParams.distance, targetCam.distance, s);
    currentCamParams.height = THREE.MathUtils.lerp(currentCamParams.height, targetCam.height, s);
    currentCamParams.lookHeight = THREE.MathUtils.lerp(currentCamParams.lookHeight, targetCam.lookHeight, s);
    if(t >= 1) cameraState.transitioning = false;
  } else {
    currentCamParams.distance += (targetCam.distance - currentCamParams.distance) * Math.min(1, dt * 4);
    currentCamParams.height += (targetCam.height - currentCamParams.height) * Math.min(1, dt * 4);
    currentCamParams.lookHeight += (targetCam.lookHeight - currentCamParams.lookHeight) * Math.min(1, dt * 4);
  }

  if(camAutoReturn.active && !camTouch.active){
    cameraUserYaw = dampAngle(cameraUserYaw, 0, CAM_AUTO_RETURN_SPEED, dt);
    cameraUserPitch += (0 - cameraUserPitch) * (1 - Math.exp(-CAM_AUTO_RETURN_SPEED * dt));
  }

  const finalYaw = cameraBaseYaw + cameraUserYaw;
  const pitch = cameraUserPitch;
  const backX = -Math.sin(finalYaw), backZ = -Math.cos(finalYaw);
  const pC = Math.cos(pitch), pS = Math.sin(pitch);

  _cameraDesired.set(
    targetPos.x + backX * currentCamParams.distance * pC,
    targetPos.y + currentCamParams.height + pS * currentCamParams.distance,
    targetPos.z + backZ * currentCamParams.distance * pC
  );
  if(_cameraDesired.y < 0.6) _cameraDesired.y = 0.6;

  const posLambda = (mode === "driving") ? 10 : 8;
  camera.position.lerp(_cameraDesired, 1 - Math.exp(-posLambda * dt));

  _lookAtTarget.set(
    targetPos.x,
    targetPos.y + currentCamParams.lookHeight,
    targetPos.z
  );
  cameraState.smoothTarget.lerp(_lookAtTarget, 1 - Math.exp(-14 * dt));
  camera.lookAt(cameraState.smoothTarget);
}

/* ============================================================
   Main loop
============================================================ */
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if(mixer) mixer.update(dt);
  if(mode === "walking"){
    updateCharacterWalk(dt);
    checkEnterCarProximity();
  } else if(mode === "driving"){
    updateCarDrive(dt);
  }
  updateCamera(dt);
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
