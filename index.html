<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>404 — Page not found</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    background: #000;
    color: #fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow: hidden;
}

/* ============================
   MAIN
============================ */

.page {

    width: 100%;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #000;
}

/* ============================
   CONTENT
============================ */

.content {

    width: 90%;
    max-width: 620px;

    text-align: center;

    animation:
        appear .7s
        cubic-bezier(.2,.8,.2,1);
}

@keyframes appear {

    from {
        opacity: 0;
        transform:
            translateY(16px);
    }

    to {
        opacity: 1;
        transform:
            translateY(0);
    }
}

/* ============================
   404 NUMBER
============================ */

.code {

    font-size:
        clamp(
            110px,
            27vw,
            185px
        );

    line-height: .85;

    font-weight: 700;

    letter-spacing: -12px;

    color: #f1f3f4;

    user-select: none;

    margin-left: -12px;
}

/* ============================
   DIVIDER
============================ */

.divider {

    width: 38px;
    height: 2px;

    margin:
        30px auto
        24px;

    background: #5f6368;

    border-radius: 10px;
}

/* ============================
   TITLE
============================ */

.title {

    font-size: 22px;

    line-height: 1.4;

    font-weight: 400;

    color: #e8eaed;
}

/* ============================
   DESCRIPTION
============================ */

.description {

    margin:
        13px auto 0;

    max-width: 420px;

    color: #9aa0a6;

    font-size: 14px;

    line-height: 1.8;
}

/* ============================
   URL
============================ */

.url {

    margin-top: 24px;

    font-family:
        monospace;

    font-size: 11px;

    color: #5f6368;

    direction: ltr;

    opacity: .8;
}

/* ============================
   STATUS
============================ */

.status {

    margin-top: 24px;

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 8px;

    color: #555;

    font-size: 10px;

    letter-spacing: .8px;
}

.status-dot {

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #555;

    animation:
        statusPulse 2s
        ease-in-out infinite;
}

@keyframes statusPulse {

    0%,
    100% {
        opacity: .3;
    }

    50% {
        opacity: 1;
    }

}

/* ============================
   MOBILE
============================ */

@media (max-width: 480px) {

    .code {

        font-size: 120px;

        letter-spacing: -7px;

        margin-left: -7px;
    }

    .title {
        font-size: 19px;
    }

    .description {

        font-size: 13px;

        padding:
            0 15px;
    }

    .url {
        font-size: 10px;
    }
}

/* ============================
   SMALL HEIGHT
============================ */

@media (max-height: 600px) {

    .code {
        font-size: 100px;
    }

    .divider {
        margin:
            20px auto;
    }

    .status {
        margin-top: 15px;
    }
}

</style>
</head>

<body>

<div class="page">

    <main class="content">

        <!-- Error Code -->

        <div class="code">
            404
        </div>

        <!-- Divider -->

        <div class="divider"></div>

        <!-- Title -->

        <h1 class="title">
            Page not found
        </h1>

        <!-- Description -->

        <p class="description">
            The page you are looking for
            doesn't exist or may have been moved.
        </p>

        <!-- Technical Information -->

        <div class="url">
            error://404/page-not-found
        </div>

        <!-- Status -->

        <div class="status">

            <span class="status-dot"></span>

            <span>
                PAGE NOT FOUND
            </span>

        </div>

    </main>

</div>

</body>
</html>
