<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>غیرفعال‌سازی برنامه</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background: #0d1117;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: #161b22;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      border: 1px solid #30363d;
      text-align: center;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 20px;
      display: block;
    }
    h1 {
      color: #f0f6fc;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    .sub {
      color: #8b949e;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .status-box {
      background: #0d1117;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 30px;
      border-left: 4px solid #f85149;
      text-align: right;
    }
    .status-box .label {
      color: #8b949e;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .status-box .value {
      color: #f85149;
      font-size: 18px;
      font-weight: 700;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: #f85149;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 16px rgba(248, 81, 73, 0.25);
      letter-spacing: 0.3px;
    }
    .btn:hover {
      background: #da3633;
      transform: scale(1.01);
      box-shadow: 0 6px 24px rgba(248, 81, 73, 0.35);
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-secondary {
      margin-top: 12px;
      background: #21262d;
      color: #c9d1d9;
      box-shadow: none;
    }
    .btn-secondary:hover {
      background: #30363d;
      box-shadow: none;
    }
    .footer {
      margin-top: 28px;
      color: #484f58;
      font-size: 12px;
      border-top: 1px solid #21262d;
      padding-top: 20px;
    }
    .footer span {
      color: #8b949e;
    }
  </style>
</head>
<body>

<div class="container">
  <span class="icon">⛔</span>
  <h1>برنامه غیرفعال شد</h1>
  <p class="sub">
    این نسخه از برنامه دیگر پشتیبانی نمی‌شود.<br>
    لطفاً برای ادامه از نسخه‌ی بروزرسانی‌شده استفاده کنید.
  </p>

  <div class="status-box">
    <div class="label">وضعیت</div>
    <div class="value">غیرفعال ⛔</div>
  </div>

  <button class="btn" id="deactivateBtn">غیرفعال کردن برنامه</button>
  <button class="btn btn-secondary" id="checkUpdateBtn">بررسی نسخه بروز</button>

  <div class="footer">
    <span>نسخه‌ی فعلی: ۲.۱.۴</span> &nbsp;·&nbsp; <span>نسخه‌ی جدید: ۳.۰.۰</span>
  </div>
</div>

<script>
  (function() {
    const deactivateBtn = document.getElementById('deactivateBtn');
    const checkUpdateBtn = document.getElementById('checkUpdateBtn');
    const statusValue = document.querySelector('.status-box .value');

    // تابع غیرفعال‌سازی
    function deactivateApp() {
      // تغییر وضعیت
      statusValue.textContent = 'غیرفعال ✅';
      statusValue.style.color = '#3fb950';
      
      // تغییر استایل دکمه
      deactivateBtn.textContent = '✅ برنامه غیرفعال شد';
      deactivateBtn.style.background = '#238636';
      deactivateBtn.style.boxShadow = '0 4px 16px rgba(35, 134, 54, 0.3)';
      deactivateBtn.disabled = true;
      
      // نمایش پیام در کنسول
      console.log('🔴 برنامه با موفقیت غیرفعال شد.');
      console.log('💡 لطفاً نسخه‌ی بروزرسانی‌شده را نصب کنید.');
      
      // نمایش هشدار (اختیاری)
      // alert('برنامه غیرفعال شد! لطفاً نسخه‌ی جدید را نصب کنید.');
    }

    // تابع بررسی نسخه‌ی بروز
    function checkForUpdate() {
      const currentVersion = '۲.۱.۴';
      const newVersion = '۳.۰.۰';
      
      if (currentVersion !== newVersion) {
        alert(`✅ نسخه‌ی جدید موجود است!\nنسخه‌ی فعلی: ${currentVersion}\nنسخه‌ی جدید: ${newVersion}\nلطفاً برنامه را به‌روزرسانی کنید.`);
      } else {
        alert('شما از آخرین نسخه استفاده می‌کنید.');
      }
    }

    // رویدادها
    deactivateBtn.addEventListener('click', deactivateApp);
    checkUpdateBtn.addEventListener('click', checkForUpdate);

    // پیام در کنسول برای توسعه‌دهندگان
    console.log('🚀 برنامه آماده‌ی غیرفعال‌سازی است.');
    console.log('📌 برای غیرفعال‌سازی، دکمه‌ی مربوطه را بزنید.');
  })();
</script>

</body>
</html>
