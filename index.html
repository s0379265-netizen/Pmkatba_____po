<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>آپارات - نمایش در کادر</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a1a;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        /* ========== کادر بنفش دور ========== */
        .purple-frame {
            width: 100%;
            height: 100%;
            max-width: 1200px;
            max-height: 900px;
            position: relative;
            background: linear-gradient(145deg, #2a1a5e, #1a0a3e, #0d0525);
            border-radius: 24px;
            padding: 8px;
            box-shadow: 
                0 0 60px rgba(138, 43, 226, 0.35),
                0 0 120px rgba(138, 43, 226, 0.15),
                inset 0 0 80px rgba(138, 43, 226, 0.08);
            border: 2px solid rgba(168, 85, 255, 0.3);
            overflow: hidden;
            animation: framePulse 3s ease-in-out infinite;
        }

        @keyframes framePulse {
            0%, 100% {
                box-shadow: 
                    0 0 60px rgba(138, 43, 226, 0.35),
                    0 0 120px rgba(138, 43, 226, 0.15),
                    inset 0 0 80px rgba(138, 43, 226, 0.08);
                border-color: rgba(168, 85, 255, 0.3);
            }
            50% {
                box-shadow: 
                    0 0 80px rgba(138, 43, 226, 0.5),
                    0 0 160px rgba(138, 43, 226, 0.25),
                    inset 0 0 100px rgba(138, 43, 226, 0.15);
                border-color: rgba(168, 85, 255, 0.5);
            }
        }

        /* ========== گوشه‌های تزئینی ========== */
        .purple-frame::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            width: 30px;
            height: 30px;
            border-top: 3px solid #a855ff;
            border-left: 3px solid #a855ff;
            border-radius: 24px 0 0 0;
            z-index: 10;
            pointer-events: none;
        }

        .purple-frame::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 30px;
            height: 30px;
            border-bottom: 3px solid #a855ff;
            border-right: 3px solid #a855ff;
            border-radius: 0 0 24px 0;
            z-index: 10;
            pointer-events: none;
        }

        .corner-bottom-left {
            position: absolute;
            bottom: -2px;
            left: -2px;
            width: 30px;
            height: 30px;
            border-bottom: 3px solid #a855ff;
            border-left: 3px solid #a855ff;
            border-radius: 0 0 0 24px;
            z-index: 10;
            pointer-events: none;
        }

        .corner-top-right {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 30px;
            height: 30px;
            border-top: 3px solid #a855ff;
            border-right: 3px solid #a855ff;
            border-radius: 0 24px 0 0;
            z-index: 10;
            pointer-events: none;
        }

        /* ========== هدر کادر ========== */
        .frame-header {
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            z-index: 20;
            background: linear-gradient(180deg, rgba(42, 26, 94, 0.95) 0%, rgba(26, 10, 62, 0.8) 100%);
            backdrop-filter: blur(10px);
            border-radius: 16px 16px 0 0;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(168, 85, 255, 0.25);
        }

        .frame-header .title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #d4b8ff;
        }

        .frame-header .title .icon {
            font-size: 20px;
        }

        .frame-header .badge {
            background: rgba(168, 85, 255, 0.2);
            border: 1px solid rgba(168, 85, 255, 0.3);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 11px;
            color: #c9a8ff;
            font-weight: 500;
        }

        /* ========== لودینگ ========== */
        .loading-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 15;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            pointer-events: none;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(168, 85, 255, 0.15);
            border-top: 4px solid #a855ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #b89ee0;
            font-size: 13px;
            font-weight: 500;
        }

        /* ========== IFRAME ========== */
        .aparat-frame {
            position: absolute;
            top: 52px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            border-radius: 0 0 16px 16px;
            overflow: hidden;
            background: #fff;
            z-index: 5;
        }

        .aparat-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ========== موبایل ========== */
        @media (max-width: 600px) {
            .purple-frame {
                border-radius: 16px;
                padding: 5px;
            }
            .purple-frame::before,
            .purple-frame::after,
            .corner-bottom-left,
            .corner-top-right {
                width: 20px;
                height: 20px;
                border-radius: 12px 0 0 0;
            }
            .corner-bottom-left {
                border-radius: 0 0 0 12px;
            }
            .corner-top-right {
                border-radius: 0 12px 0 0;
            }
            .purple-frame::after {
                border-radius: 0 0 12px 0;
            }
            .frame-header {
                top: 5px;
                left: 5px;
                right: 5px;
                padding: 8px 12px;
                border-radius: 11px 11px 0 0;
            }
            .frame-header .title {
                font-size: 12px;
                gap: 6px;
            }
            .frame-header .title .icon {
                font-size: 16px;
            }
            .frame-header .badge {
                font-size: 9px;
                padding: 3px 8px;
            }
            .aparat-frame {
                top: 42px;
                left: 5px;
                right: 5px;
                bottom: 5px;
                border-radius: 0 0 11px 11px;
            }
        }

        @media (max-height: 500px) {
            .frame-header {
                padding: 6px 10px;
            }
            .aparat-frame {
                top: 36px;
            }
        }
    </style>
</head>
<body>

    <!-- ==================== کادر بنفش ==================== -->
    <div class="purple-frame" id="purpleFrame">

        <!-- گوشه‌های تزئینی -->
        <div class="corner-bottom-left"></div>
        <div class="corner-top-right"></div>

        <!-- هدر -->
        <div class="frame-header">
            <div class="title">
                <span class="icon"</span>
                <span></span>
            </div>
            <div class="badge"></div>
        </div>

        <!-- لودینگ -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
            <div class="loading-text">در حال بارگذاری آپارات...</div>
        </div>

        <!-- فریم آپارات -->
        <div class="aparat-frame">
            <iframe 
                id="aparatIframe"
                src="https://gemini.google.com/"
                scrolling="auto"
                allowFullScreen="true"
                webkitallowfullscreen="true" 
                mozallowfullscreen="true"
                allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
                sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-presentation"
                referrerpolicy="no-referrer-when-downgrade"
                loading="eager"
                onload="hideLoading()"
                onerror="showError()">
            </iframe>
        </div>

    </div>

    <!-- ==================== SCRIPT ==================== -->
    <script>
        (function() {
            'use strict';

            // ==========================================
            // DOM REFS
            // ==========================================
            const loadingOverlay = document.getElementById('loadingOverlay');
            const iframe = document.getElementById('aparatIframe');
            const purpleFrame = document.getElementById('purpleFrame');

            // ==========================================
            // HIDE LOADING
            // ==========================================
            window.hideLoading = function() {
                if (loadingOverlay) {
                    loadingOverlay.style.opacity = '0';
                    loadingOverlay.style.transition = 'opacity 0.5s ease';
                    setTimeout(() => {
                        loadingOverlay.style.display = 'none';
                    }, 500);
                }
            };

            // ==========================================
            // SHOW ERROR
            // ==========================================
            window.showError = function() {
                if (loadingOverlay) {
                    loadingOverlay.innerHTML = `
                        <div style="font-size:50px;">📡</div>
                        <div class="loading-text" style="color:#f87171;">
                            خطا در بارگذاری آپارات
                        </div>
                        <div class="loading-text" style="font-size:11px; color:#a099cc;">
                            لطفاً اینترنت را بررسی کنید
                        </div>
                    `;
                }
            };

            // ==========================================
            // TIMEOUT - اگر لود نشد
            // ==========================================
            setTimeout(function() {
                // اگه هنوز لودینگ نمایش داده می‌شه
                if (loadingOverlay && loadingOverlay.style.display !== 'none') {
                    // هنوز داره لود می‌کنه - صبر کن
                }
            }, 10000);

            // ==========================================
            // PREVENT CONTEXT MENU
            // ==========================================
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
            });

            // ==========================================
            // PREVENT DRAG
            // ==========================================
            document.addEventListener('dragstart', function(e) {
                e.preventDefault();
            });

            // ==========================================
            // INIT
            // ==========================================
            console.log('🎬 آپارات - نمایش در کادر بنفش');
            console.log('✅ فریم بارگذاری شد');

        })();
    </script>

</body>
</html>
