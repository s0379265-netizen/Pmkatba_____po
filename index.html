<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ویدیو آپارات</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0e17;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
        }

        /* ========== VIDEO WRAPPER ========== */
        .video-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* ========== TOP BAR ========== */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10001;
            padding: 14px 20px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.85) 0%, transparent 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .top-bar>* {
            pointer-events: auto;
        }

        .uid-box {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 6px 14px 6px 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(8px);
            font-size: 13px;
            color: #aab;
        }

        .uid-box .uid-value {
            color: #4ade80;
            font-weight: 700;
            font-family: monospace;
            font-size: 14px;
            direction: ltr;
            cursor: pointer;
            transition: 0.3s;
        }

        .uid-box .uid-value:hover {
            color: #facc15;
        }

        .uid-box .copy-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: #889;
            font-size: 16px;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 6px;
            transition: 0.3s;
        }

        .uid-box .copy-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .close-btn {
            width: 42px;
            height: 42px;
            background: rgba(0, 0, 0, 0.5);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            color: #fff;
            font-size: 22px;
            font-weight: 300;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            transition: 0.3s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        /* ========== INFO BAR (پایین) ========== */
        .info-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10000;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.5) 70%, transparent 100%);
            padding: 18px 16px 24px;
            backdrop-filter: blur(4px);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            text-align: center;
        }

        .info-text {
            font-size: 14px;
            color: #aab;
            line-height: 1.7;
            max-width: 650px;
            margin: 0 auto;
        }

        .info-text strong {
            color: #facc15;
        }

        /* ========== TOAST ========== */
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 10px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            text-align: center;
            max-width: 90%;
        }

        .toast.show {
            opacity: 1;
        }

        /* ========== MOBILE ========== */
        @media (max-width: 600px) {
            .top-bar {
                padding: 10px 12px;
            }
            .uid-box {
                font-size: 11px;
                padding: 4px 10px 4px 8px;
            }
            .uid-box .uid-value {
                font-size: 12px;
            }
            .close-btn {
                width: 36px;
                height: 36px;
                font-size: 18px;
            }
            .info-bar {
                padding: 12px 10px 16px;
            }
            .info-text {
                font-size: 12px;
            }
        }

        @media (max-height: 700px) {
            .info-bar {
                padding: 10px 10px 14px;
            }
            .info-text {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <!-- ==================== TOAST ==================== -->
    <div class="toast" id="toast"></div>

    <!-- ==================== VIDEO ==================== -->
    <div class="video-wrapper">
        <iframe 
            src="https://www.aparat.com/video/video/embed/videohash/2090430020347109376/vt/frame"
            scrolling="no" 
            allowFullScreen="true"
            webkitallowfullscreen="true" 
            mozallowfullscreen="true" 
            allow="autoplay; fullscreen">
        </iframe>
    </div>

    <!-- ========== TOP BAR ========== -->
    <div class="top-bar">
        <div class="uid-box">
            🆔 <span style="color:#889;">UID:</span>
            <span class="uid-value" id="uidDisplay" title="کلیک برای کپی">گرفتن...</span>
            <button class="copy-btn" id="copyUidBtn" title="کپی UID">📋</button>
        </div>
        <button class="close-btn" id="closeBtn">✕</button>
    </div>

    <!-- ========== INFO BAR ========== -->
    <div class="info-bar">
        <div class="info-text">
            🎬 <strong>ویدیو آپارات</strong> — با کیفیت بالا پخش می‌شود
            <br>
            <span style="font-size:12px; color:#778;">
                📸 برای اثبات تماشا، از صفحه عکس بگیرید
            </span>
        </div>
    </div>

    <!-- ==================== SCRIPT ==================== -->
    <script>
        (function() {
            'use strict';

            // ==========================================
            // DOM REFS
            // ==========================================
            const uidDisplay = document.getElementById('uidDisplay');
            const copyUidBtn = document.getElementById('copyUidBtn');
            const closeBtn = document.getElementById('closeBtn');
            const toast = document.getElementById('toast');

            // ==========================================
            // GENERATE UID
            // ==========================================
            function generateUID() {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                let result = 'SON-';
                for (let i = 0; i < 8; i++) {
                    result += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                result += '-' + Date.now().toString(36).toUpperCase();
                return result;
            }

            const userId = generateUID();
            uidDisplay.textContent = userId;

            // ==========================================
            // TOAST
            // ==========================================
            let toastTimeout = null;

            function showToast(msg, duration = 3000) {
                toast.textContent = msg;
                toast.classList.add('show');
                if (toastTimeout) clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, duration);
            }

            // ==========================================
            // COPY UID
            // ==========================================
            copyUidBtn.addEventListener('click', function() {
                navigator.clipboard.writeText(userId).then(() => {
                    showToast('✅ UID کپی شد: ' + userId);
                }).catch(() => {
                    const range = document.createRange();
                    const selection = window.getSelection();
                    range.selectNode(uidDisplay);
                    selection.removeAllRanges();
                    selection.addRange(range);
                    document.execCommand('copy');
                    showToast('✅ UID کپی شد: ' + userId);
                });
            });

            uidDisplay.addEventListener('click', function() {
                copyUidBtn.click();
            });

            // ==========================================
            // CLOSE
            // ==========================================
            closeBtn.addEventListener('click', function() {
                document.body.style.opacity = '0';
                document.body.style.transition = 'opacity 0.4s ease';
                setTimeout(() => {
                    window.close();
                }, 400);
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeBtn.click();
                }
            });

            // ==========================================
            // PREVENT CONTEXT MENU
            // ==========================================
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
            });

            // ==========================================
            // INIT
            // ==========================================
            console.log('🎬 ویدیو آپارات');
            console.log('🆔 UID:', userId);

            showToast('🎬 ویدیو با کیفیت بالا پخش می‌شود', 3000);

        })();
    </script>

</body>
</html>
