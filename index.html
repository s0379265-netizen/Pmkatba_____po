<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تست Speechactors TTS فارسی</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Tahoma, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #eee;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 560px;
    }
    h1 { font-size: 1.25rem; color: #ff9500; margin-bottom: 6px; }
    .sub { font-size: 0.85rem; color: #888; margin-bottom: 18px; }
    label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 6px; }
    input, textarea, select {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      border-radius: 10px;
      color: #fff;
      padding: 12px;
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 14px;
    }
    input:focus, textarea:focus, select:focus { border-color: #ff9500; }
    textarea { height: 110px; resize: vertical; line-height: 1.7; }
    .row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    button {
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
      min-width: 120px;
    }
    .btn-orange { background: #ff9500; color: #000; }
    .btn-orange:disabled { background: #555; color: #999; cursor: not-allowed; }
    .btn-gray { background: #333; color: #fff; }
    .status {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      background: #111;
      border: 1px solid #2a2a2a;
      color: #aaa;
      min-height: 48px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .status.ok { border-color: #2ecc71; color: #2ecc71; }
    .status.err { border-color: #e74c3c; color: #e74c3c; }
    .status.info { border-color: #3498db; color: #3498db; }
    audio { width: 100%; margin-top: 12px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>تست Speechactors TTS</h1>
    <div class="sub">فارسی · Dilara / Farid · API</div>

    <label>API Key</label>
    <input type="text" id="apiKey" value="tNpyttarhKat2Duve4rz7uXVMXeXRhz9ahiJU8eg" placeholder="Bearer Token">

    <label>متن فارسی</label>
    <textarea id="text">سلام! این یک تست تبدیل متن فارسی به گفتار با سرویس Speechactors است. امیدوارم کیفیت صدا خوب باشه.</textarea>

    <label>صدا</label>
    <select id="voice">
      <option value="fa-IR-DilaraNeural|fa-IR">Dilara (زن - فارسی)</option>
      <option value="fa-IR-FaridNeural|fa-IR">Farid (مرد - فارسی)</option>
    </select>

    <div class="row">
      <button class="btn-gray" onclick="checkBalance()">بررسی موجودی</button>
      <button class="btn-orange" id="playBtn" onclick="generate()">پخش صدا</button>
    </div>

    <div class="status" id="status">آماده تست...</div>
    <audio id="player" controls style="display:none;"></audio>
  </div>

  <script>
    const BASE = 'https://api.speechactors.com/v1';

    function setStatus(msg, type = '') {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + type;
    }

    function getHeaders() {
      const key = document.getElementById('apiKey').value.trim();
      return {
        'Authorization': 'Bearer ' + key,
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      };
    }

    async function checkBalance() {
      setStatus('در حال بررسی موجودی...', 'info');
      try {
        const res = await fetch(BASE + '/balance', { headers: getHeaders() });
        const data = await res.json();
        if (res.ok) {
          setStatus('موجودی: ' + JSON.stringify(data, null, 2), 'ok');
        } else {
          setStatus('خطا: ' + (data.message || res.status), 'err');
        }
      } catch (e) {
        setStatus('خطای شبکه: ' + e.message, 'err');
      }
    }

    async function generate() {
      const text = document.getElementById('text').value.trim();
      if (!text) {
        setStatus('متن وارد کن', 'err');
        return;
      }

      const [vid, locale] = document.getElementById('voice').value.split('|');
      const btn = document.getElementById('playBtn');
      btn.disabled = true;
      setStatus('در حال ساخت صدا...', 'info');

      try {
        const res = await fetch(BASE + '/generate', {
          method: 'POST',
          headers: getHeaders(),
          body: JSON.stringify({
            locale: locale,
            vid: vid,
            text: text,
            style: 'default'
          })
        });

        // اگر JSON برگشت یعنی خطا
        const contentType = res.headers.get('content-type') || '';
        if (contentType.includes('application/json')) {
          const data = await res.json();
          setStatus('خطا: ' + (data.message || JSON.stringify(data)), 'err');
          btn.disabled = false;
          return;
        }

        // موفقیت → فایل صوتی (mp3)
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const player = document.getElementById('player');
        player.src = url;
        player.style.display = 'block';
        player.play();
        setStatus('صدا آماده شد و در حال پخش است.', 'ok');
      } catch (e) {
        setStatus('خطا: ' + e.message, 'err');
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
