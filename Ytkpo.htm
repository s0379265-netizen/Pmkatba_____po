<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">

<title>TPS Pro — Realistic City</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a15;touch-action:none;font-family:Arial,Tahoma,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}

/* ═══ CSS GUARD: Game canvas only visible in GAME state ═══ */
#gameCanvas{visibility:hidden}
body.appBooting #gameCanvas{visibility:hidden}
body.appMenu #gameCanvas{visibility:hidden}
body.appGame #gameCanvas{visibility:visible}

/* ═══ LAYER 100: LOADING ═══ */
#loading{position:fixed;inset:0;z-index:100;background:#0a0a15;background-image:url('https://uploadkon.ir/uploads/a6c023_26grok-1790086009059.jpg');background-size:cover;background-position:center;display:flex;align-items:flex-end;justify-content:center;padding-bottom:40px;transition:opacity 0.6s, visibility 0.6s}
#loading.hidden{opacity:0;visibility:hidden;pointer-events:none}
#loadingBarWrapper{width:75%;max-width:500px;height:6px;background:rgba(0,0,0,0.6);border-radius:3px;overflow:hidden;box-shadow:0 0 20px rgba(0,0,0,0.7)}
#loadingBar{height:100%;width:0%;background:linear-gradient(90deg,#ffcc00,#ffe066,#ffcc00);border-radius:3px;transition:width 0.3s ease-out;box-shadow:0 0 15px rgba(255,204,0,0.9)}

/* ═══ MAIN MENU ═══ */
.mainMenu{position:fixed;inset:0;z-index:900;overflow:hidden;transition:opacity 0.5s, visibility 0.5s;background:#0a0a15;isolation:isolate}
.mainMenu.hidden{opacity:0;visibility:hidden;pointer-events:none}
#bgVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;opacity:0.65;pointer-events:none}
.mainMenu::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(10,10,21,0.65) 0%, rgba(10,10,21,0.15) 45%, rgba(10,10,21,0.92) 100%);pointer-events:none;z-index:2}
.previewWrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;pointer-events:none}
#previewCanvas{width:100%;height:100%;background:transparent;position:relative;z-index:6;touch-action:none;cursor:grab;pointer-events:auto;display:block}
#previewCanvas:active{cursor:grabbing}
.previewGlow{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);width:65%;height:10px;background:radial-gradient(ellipse, rgba(120,180,255,0.6) 0%, transparent 70%);filter:blur(8px);z-index:7;pointer-events:none}
.previewLabel{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);color:#8ec5e8;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;text-shadow:0 0 10px rgba(120,180,255,0.8);z-index:8;pointer-events:none}

.menuTopBar{position:absolute;top:0;left:0;right:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;z-index:20;pointer-events:none}
.menuTopBar > *{pointer-events:auto}
.profileCard{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg, rgba(20,20,40,0.92), rgba(30,35,60,0.88));backdrop-filter:blur(12px);padding:10px 14px;border-radius:14px;border:1.5px solid rgba(255,204,0,0.35);box-shadow:0 4px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);min-width:0;flex:1;max-width:320px}
.avatarRing{width:52px;height:52px;border-radius:50%;padding:3px;background:conic-gradient(from 180deg, #ffcc00, #ff8800, #ffcc00, #ffee88, #ffcc00);box-shadow:0 0 14px rgba(255,204,0,0.6);flex-shrink:0}
.avatar{width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,#2a3a5a,#1a2538);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;color:#ffcc00;text-shadow:0 0 10px rgba(255,204,0,0.8);border:2px solid #0a0a15}
.profileMeta{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.nameRow{display:flex;align-items:center;gap:6px}
#usernameInput{background:transparent;border:none;color:#fff;font-weight:800;font-size:14px;letter-spacing:0.5px;width:100%;outline:none;font-family:inherit;padding:0;min-width:0}
#usernameInput:focus{background:rgba(255,204,0,0.1);border-radius:4px}
#editNameBtn{background:rgba(255,204,0,0.15);border:1px solid rgba(255,204,0,0.4);color:#ffcc00;padding:3px 7px;border-radius:6px;font-size:11px;cursor:pointer}
.lvlRow{display:flex;align-items:center;gap:6px;font-size:10px}
.lvlBadge{background:linear-gradient(135deg,#ffcc00,#ff8800);color:#000;font-weight:900;padding:2px 7px;border-radius:4px;font-size:9px;letter-spacing:0.5px}
.lvlBadge b{font-size:11px}
.xpBarMini{flex:1;height:5px;background:rgba(0,0,0,0.5);border-radius:3px;overflow:hidden;min-width:50px}
.xpFillMini{height:100%;width:0%;background:linear-gradient(90deg,#4ade80,#22c55e,#16a34a);transition:width 0.5s;box-shadow:0 0 8px rgba(74,222,128,0.8)}
.xpText{color:#8ec5e8;font-size:9px;font-weight:600;white-space:nowrap}
.coinBox{display:flex;gap:6px;align-items:center;background:linear-gradient(135deg, rgba(20,20,40,0.92), rgba(30,35,60,0.88));backdrop-filter:blur(12px);padding:10px 16px;border-radius:14px;border:1.5px solid rgba(120,180,255,0.35);box-shadow:0 4px 20px rgba(0,0,0,0.5);color:#fff;font-weight:800;font-size:15px;flex-shrink:0}
.coinIcon{font-size:18px;filter:drop-shadow(0 0 6px rgba(255,204,0,0.8))}

.menuBottomBar{position:absolute;bottom:24px;left:0;right:0;display:flex;justify-content:center;gap:14px;padding:0 20px;z-index:25;flex-wrap:wrap;pointer-events:none}
.menuBottomBar > *{pointer-events:auto}
.menuBtn{padding:14px 28px;border-radius:14px;font-size:15px;font-weight:800;letter-spacing:0.5px;cursor:pointer;border:none;font-family:inherit;transition:all 0.15s;display:flex;align-items:center;gap:8px;min-width:150px;justify-content:center;text-shadow:0 1px 3px rgba(0,0,0,0.5)}
.menuBtn:active{transform:scale(0.95)}
.customizeBtn{background:linear-gradient(135deg, rgba(60,120,220,0.95), rgba(30,80,180,0.95));color:#fff;border:2px solid rgba(140,190,255,0.6);box-shadow:0 6px 20px rgba(60,120,220,0.5)}
.startBtn{background:linear-gradient(135deg, #ffcc00, #ff8800);color:#000;border:2px solid rgba(255,255,200,0.9);box-shadow:0 6px 25px rgba(255,204,0,0.6), 0 0 40px rgba(255,136,0,0.4);font-size:17px;padding:16px 36px;min-width:190px;animation:startPulse 2.2s ease-in-out infinite}
@keyframes startPulse{0%,100%{box-shadow:0 6px 25px rgba(255,204,0,0.6), 0 0 40px rgba(255,136,0,0.4)}50%{box-shadow:0 6px 30px rgba(255,204,0,0.9), 0 0 60px rgba(255,136,0,0.7)}}

.customizePanel{position:fixed;inset:0;z-index:50;background:linear-gradient(135deg, rgba(10,10,21,0.97), rgba(20,20,40,0.97));backdrop-filter:blur(20px);display:flex;flex-direction:column;transition:opacity 0.35s, visibility 0.35s;isolation:isolate}
.customizePanel.hidden{opacity:0;visibility:hidden;pointer-events:none}
.customizeHeader{padding:16px 20px;display:flex;align-items:center;gap:16px;border-bottom:1.5px solid rgba(255,204,0,0.25);background:linear-gradient(180deg, rgba(30,30,50,0.8), transparent)}
.backBtn{background:rgba(255,255,255,0.1);border:1.5px solid rgba(255,255,255,0.25);color:#fff;padding:8px 16px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.customizeTitle{color:#ffcc00;font-weight:900;font-size:16px;letter-spacing:1px;text-shadow:0 0 12px rgba(255,204,0,0.6)}
.customizeBody{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:22px;max-width:700px;width:100%;margin:0 auto}
.customSection{background:linear-gradient(135deg, rgba(20,20,40,0.7), rgba(30,35,60,0.5));border-radius:16px;padding:16px;border:1.5px solid rgba(120,180,255,0.2);box-shadow:0 4px 20px rgba(0,0,0,0.3)}
.sectionTitle{color:#8ec5e8;font-weight:800;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.optionsRow{display:grid;grid-template-columns:repeat(auto-fill, minmax(70px, 1fr));gap:10px}
.optionTile{aspect-ratio:1;border-radius:12px;background:rgba(0,0,0,0.4);border:2px solid rgba(255,255,255,0.15);cursor:pointer;position:relative;overflow:hidden;transition:all 0.15s;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,0.8)}
.optionTile:active{transform:scale(0.94)}
.optionTile.active{border-color:#ffcc00;box-shadow:0 0 18px rgba(255,204,0,0.7), inset 0 0 12px rgba(255,204,0,0.25)}
.optionTile.active::after{content:"✓";position:absolute;top:4px;right:6px;color:#ffcc00;font-weight:900;font-size:14px;text-shadow:0 0 8px rgba(0,0,0,0.9)}
.optionColor{width:100%;height:100%;border-radius:10px}

#joyZoneLeft{position:fixed;bottom:0;left:0;width:55%;height:70%;z-index:15;touch-action:none}
#joyZoneLeft.hidden{display:none}
#joyBaseFloat{position:absolute;width:120px;height:120px;border-radius:50%;border:3px solid rgba(255,255,255,0.35);background:radial-gradient(circle, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.02) 70%);transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity 0.2s}
#joyBaseFloat.active{opacity:1}
#joyKnobFloat{position:absolute;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95), rgba(255,51,102,0.85));border:3px solid rgba(255,255,255,0.9);transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity 0.2s;box-shadow:0 6px 25px rgba(255,51,102,0.7)}
#joyKnobFloat.active{opacity:1}
#camZoneRight{position:fixed;top:0;right:0;width:50%;height:100%;z-index:14;touch-action:none}
#camZoneRight.hidden{display:none}
#carControls{position:fixed;inset:0;pointer-events:none;z-index:16;display:none}
#carControls.show{display:block}
.steer-svg-btn{position:absolute;bottom:20px;width:65px;height:65px;pointer-events:auto;touch-action:none;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.6))}
.steer-svg-btn:active,.steer-svg-btn.active{transform:scale(0.9)}
#steer-left{left:15px}
#steer-right{left:90px}
#gasBtn{position:absolute;bottom:20px;right:15px;width:85px;height:85px;pointer-events:auto;touch-action:none;filter:drop-shadow(0 6px 18px rgba(0,0,0,0.7))}
#gasBtn:active,#gasBtn.active{transform:scale(0.92) translateY(4px)}
#brakeSvgBtn{position:absolute;bottom:120px;right:15px;width:70px;height:70px;pointer-events:auto;touch-action:none}
#brakeSvgBtn:active,#brakeSvgBtn.active{transform:scale(0.92) translateY(3px)}
#reverseBtn{position:absolute;bottom:205px;right:15px;width:62px;height:62px;pointer-events:auto;touch-action:none}
#reverseBtn:active,#reverseBtn.active{transform:scale(0.92) translateY(3px)}
#heliControls{position:fixed;inset:0;pointer-events:none;z-index:16;display:none}
#heliControls.show{display:block}
.heli-btn{position:absolute;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none;font-weight:900;text-shadow:0 2px 4px rgba(0,0,0,0.8);border:2px solid rgba(255,255,255,0.35);backdrop-filter:blur(8px);box-shadow:0 4px 15px rgba(0,0,0,0.5)}
.heli-btn:active,.heli-btn.active{transform:scale(0.9);box-shadow:0 0 22px rgba(100,180,255,0.9)}
#heli-left{left:15px;bottom:20px;width:60px;height:60px;font-size:20px;background:linear-gradient(135deg, rgba(50,100,200,0.75), rgba(30,60,140,0.75))}
#heli-right{left:85px;bottom:20px;width:60px;height:60px;font-size:20px;background:linear-gradient(135deg, rgba(50,100,200,0.75), rgba(30,60,140,0.75))}
#heli-fwd{left:50px;bottom:105px;width:60px;height:60px;font-size:20px;background:linear-gradient(135deg, rgba(60,120,220,0.75), rgba(30,70,150,0.75))}
#heli-back{left:50px;bottom:180px;width:60px;height:60px;font-size:20px;background:linear-gradient(135deg, rgba(60,120,220,0.75), rgba(30,70,150,0.75))}
#heli-up{right:85px;bottom:20px;width:60px;height:60px;font-size:20px;background:linear-gradient(135deg, rgba(60,180,100,0.75), rgba(30,120,60,0.75))}
#heli-down{right:15px;bottom:20px;width:60px;height:60px;font-size:20px;background:linear-gradient(135deg, rgba(200,60,60,0.75), rgba(140,30,30,0.75))}
#heli-engine{right:20px;bottom:105px;width:110px;height:60px;border-radius:14px;font-size:13px;font-weight:900;letter-spacing:1px;background:linear-gradient(135deg, rgba(200,220,255,0.15), rgba(150,180,240,0.08));border:2px solid rgba(200,220,255,0.55);color:#e8f0ff;text-shadow:0 0 8px rgba(150,200,255,0.9)}
#heli-engine.running{background:linear-gradient(135deg, rgba(150,255,200,0.3), rgba(60,180,120,0.2));border-color:rgba(180,255,220,0.75);animation:engineGlow 1.5s infinite}

#heliExitBtn.show{display:block}
#heliHUD{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg, rgba(10,15,30,0.85), rgba(20,25,45,0.85));padding:6px 16px;border-radius:12px;border:1px solid rgba(120,180,255,0.25);display:none;align-items:center;gap:10px;color:#fff;z-index:15;pointer-events:none}

.heli-hud-item{display:flex;flex-direction:column;align-items:center;min-width:42px}
.heli-hud-value{font-size:15px;font-weight:700;color:#4fc3f7;line-height:1}
.heli-hud-label{font-size:8px;opacity:0.55}
#heliAltitude{color:#44ff88}
#heliRPM{color:#ffcc44}

#carHUD{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg, rgba(15,15,25,0.9), rgba(25,25,40,0.9));padding:8px 18px;border-radius:14px;border:1px solid rgba(255,255,255,0.15);display:flex;align-items:center;gap:12px;color:#fff;z-index:15;pointer-events:none}

#enterCarBtn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:16px 28px;background:linear-gradient(135deg, rgba(255,51,102,0.95), rgba(255,107,61,0.95));border:3px solid rgba(255,255,255,0.6);border-radius:16px;color:#fff;font-size:16px;font-weight:700;display:none;align-items:center;justify-content:center;pointer-events:auto;z-index:20;animation:pulseEnter 1.8s ease-in-out infinite}

#enterHeliBtn{position:absolute;top:56%;left:50%;transform:translate(-50%,-50%);padding:16px 28px;background:linear-gradient(135deg, rgba(60,160,240,0.95), rgba(30,100,200,0.95));border:3px solid rgba(255,255,255,0.6);border-radius:16px;color:#fff;font-size:16px;font-weight:700;display:none;align-items:center;justify-content:center;pointer-events:auto;z-index:20;animation:pulseEnter 1.8s ease-in-out infinite}

#exitCarBtn{position:absolute;top:12px;left:12px;padding:8px 16px;background:linear-gradient(135deg, rgba(220,40,40,0.85), rgba(160,20,20,0.85));border:2px solid rgba(255,255,255,0.5);border-radius:10px;color:#fff;font-size:12px;font-weight:600;display:none;pointer-events:auto;z-index:20}
#exitCarBtn.show{display:block}
#menuTopBtn{position:absolute;top:12px;left:12px;padding:8px 14px;background:linear-gradient(135deg, rgba(50,60,90,0.9), rgba(30,40,70,0.9));border:2px solid rgba(120,180,255,0.5);border-radius:10px;color:#fff;font-size:12px;font-weight:700;display:none;pointer-events:auto;z-index:20;backdrop-filter:blur(6px)}
#menuTopBtn.show{display:block}
#hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.6);color:#fff;padding:6px 14px;border-radius:18px;font-size:10px;z-index:14;pointer-events:none;opacity:0.9}

<body class="appBooting">
<div id="loading"><div id="loadingBarWrapper"><div id="loadingBar"></div></div></div>

<!-- ═══════ MAIN MENU ═══════ -->
<div id="mainMenu" class="mainMenu">
  <video id="bgVideo" autoplay muted loop playsinline preload="auto"></video>
  <audio id="bgMusic" loop preload="auto"></audio>

  <div class="previewWrap" id="previewWrap">
    <canvas id="previewCanvas"></canvas>
    <div class="previewGlow"></div>
    <div class="previewLabel">PREVIEW</div>
  </div>

  <div class="menuTopBar">
    <div class="profileCard">
      <div class="avatarRing"><div class="avatar" id="menuAvatar">P</div></div>
      <div class="profileMeta">
        <div class="nameRow">
          <input type="text" id="usernameInput" maxlength="14" value="PLAYER">
          <button id="editNameBtn">✎</button>
        </div>
        <div class="lvlRow">
          <span class="lvlBadge">LVL <b id="menuLevel">1</b></span>
          <div class="xpBarMini"><div id="menuXpFill" class="xpFillMini"></div></div>
          <span class="xpText" id="menuXpText">0/100</span>
        </div>
      </div>
    </div>
    <div class="coinBox">
      <span class="coinIcon">💰</span>
      <span id="menuCoins">500</span>
    </div>
  </div>

  <!-- ★ دکمه شروع سمت چپ، شخصی‌سازی سمت راست (RTL: اولی سمت راست) -->
  <div class="menuBottomBar">
    <button class="menuBtn customizeBtn" id="openCustomizeBtn">🎨 شخصی‌سازی</button>
    <button class="menuBtn startBtn" id="startGameBtn">▶ شروع بازی</button>
  </div>
</div>

<!-- ═══════ CUSTOMIZE PANEL ═══════ -->
<div id="customizePanel" class="customizePanel hidden">
  <div class="customizeHeader">
    <button class="backBtn" id="closeCustomizeBtn">← بازگشت</button>
    <div class="customizeTitle">شخصی‌سازی کاراکتر</div>
  </div>
  <div class="customizeBody">
    <div class="customSection"><div class="sectionTitle">🎩 کلاه</div><div class="optionsRow" id="helmetOptions"></div></div>

// ═══ LOADING STATE ═══
const loadingBar = document.getElementById("loadingBar");
const loadingDiv = document.getElementById("loading");
let currentProgress = 0, targetProgress = 10, isReady = false, loadingFinished = false;
const totalAssets = 3;
let resolvedAssets = 0;
let mediaReady = { video: false, music: false };

function assetResolved(){
  resolvedAssets = Math.min(resolvedAssets + 1, totalAssets);
  targetProgress = 25 + (resolvedAssets / totalAssets) * 75;
  if(resolvedAssets >= totalAssets){ targetProgress = 100; isReady = true; }
}

function finishInitialLoading(){
  if (loadingFinished) return;
  if (appState !== "BOOT") return;
  loadingFinished = true;

  // 1) Init preview
  initPreview();

  // 2) Switch state to MENU
  appState = "MENU";
  gameStarted = false;
  document.body.classList.remove("appBooting");
  document.body.classList.add("appMenu");

  // 3) Show menu
  showMainMenu();

  // 4) Wait 2 frames, then hide loading
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      loadingDiv.classList.add("hidden");
    });
  });
}

function updateBar(){
  if(currentProgress < targetProgress){
    currentProgress += (targetProgress - currentProgress) * 0.15 + 0.3;
    if(currentProgress > targetProgress) currentProgress = targetProgress;
    loadingBar.style.width = currentProgress + "%";
  }
  // ★ IMPORTANT: wait for BOTH assets AND media (video + music) to be ready
  const allAssetsDone = resolvedAssets >= totalAssets;
  const allMediaDone = mediaReady.video && mediaReady.music;
  if(!loadingFinished && isReady && currentProgress >= 99 && allAssetsDone && allMediaDone){
    finishInitialLoading();
  }
  requestAnimationFrame(updateBar);
}

// ═══ CHARACTER CUSTOMIZATION ═══
function findBone(obj, names){
  for(const n of names){ const b = obj.getObjectByName(n); if(b) return b; }
  return null;
}
function findBoneFlexible(obj, keywords){
  let found = null;
  obj.traverse(o => {
    if(found) return;
    if(!o.isBone && !o.name) return;
    const n = o.name.toLowerCase();
    for(const kw of keywords){
      if(n.includes(kw.toLowerCase())){ found = o; return; }
    }
  });
  return found;
}
function removeCustomAttachments(char){
  if(!char) return;
  const toRemove = [];
  char.traverse(o => { if(o.userData && o.userData.isCustomAttach) toRemove.push(o); });
  toRemove.forEach(o => { if(o.parent) o.parent.remove(o); });
}
function applyCustomization(char, opts){
  if(!char) return;
  opts = opts || {
    helmetColor: tempHelmetColor, vestColor: tempVestColor,
    uniformColor: tempUniformColor, hasHelmet: tempHasHelmet, hasBackpack: tempHasBackpack
  };
  removeCustomAttachments(char);
  const headBone = findBone(char, ["mixamorig:Head", "mixamorigHead", "Head"]) || findBoneFlexible(char, ["head"]);
  const spineBone = findBone(char, ["mixamorig:Spine2", "mixamorigSpine2", "Spine2", "mixamorig:Spine1", "mixamorigSpine1", "Spine"]) || findBoneFlexible(char, ["spine2", "spine1", "spine"]);
  const isRealSoldier = !!headBone;

  if(headBone && opts.hasHelmet){
    const g = new THREE.Group(); g.userData.isCustomAttach = true;
    const R = isRealSoldier ? 0.14 : 0.11;
    const dome = new THREE.Mesh(new THREE.SphereGeometry(R, 16, 12, 0, Math.PI*2, 0, Math.PI*0.6),
      new THREE.MeshStandardMaterial({color: opts.helmetColor, roughness: 0.55, metalness: 0.35, envMapIntensity: 1.2}));
    dome.castShadow = true; dome.receiveShadow = true; g.add(dome);
    const brim = new THREE.Mesh(new THREE.TorusGeometry(R * 0.98, R * 0.12, 6, 20),
      new THREE.MeshStandardMaterial({color: 0x1a1a1a, roughness: 0.5, metalness: 0.75}));
    brim.rotation.x = Math.PI/2; brim.position.y = 0.005; g.add(brim);
    g.position.set(0, R * 0.35, 0);
    headBone.add(g);
  }
  if(spineBone){
    const g = new THREE.Group(); g.userData.isCustomAttach = true;
    const s = isRealSoldier ? 1.45 : 1.0;
    const vest = new THREE.Mesh(new THREE.BoxGeometry(0.28 * s, 0.30 * s, 0.16 * s),
      new THREE.MeshStandardMaterial({color: opts.vestColor, roughness: 0.9, metalness: 0.05}));
    vest.castShadow = true; g.add(vest);
    const pouchMat = new THREE.MeshStandardMaterial({color: 0x1a1a1a, roughness: 0.9});
    for (const dx of [-0.08, 0, 0.08]){
      const p = new THREE.Mesh(new THREE.BoxGeometry(0.08 * s, 0.09 * s, 0.04 * s), pouchMat);
      p.position.set(dx * s, -0.03 * s, 0.09 * s); g.add(p);
    }
    g.position.set(0, 0.02 * s, 0);
    spineBone.add(g);
  }
  if(spineBone && opts.hasBackpack){
    const g = new THREE.Group(); g.userData.isCustomAttach = true;
    const s = isRealSoldier ? 1.45 : 1.0;
    const bag = new THREE.Mesh(new THREE.BoxGeometry(0.24 * s, 0.28 * s, 0.14 * s),
      new THREE.MeshStandardMaterial({color: opts.vestColor, roughness: 0.92}));
    bag.castShadow = true; g.add(bag);
    g.position.set(0, 0.02 * s, -0.16 * s);
    spineBone.add(g);
  }
}

function initBgMedia(){

  bgVideoEl.setAttribute("muted", "");

  bgMusicEl.load();
  bgVideoEl.addEventListener("loadeddata", () => { mediaReady.video = true; });
  bgVideoEl.addEventListener("canplaythrough", () => { mediaReady.video = true; });
  bgVideoEl.addEventListener("error", () => { mediaReady.video = true; });
  bgMusicEl.addEventListener("loadeddata", () => { mediaReady.music = true; });
  bgMusicEl.addEventListener("canplaythrough", () => { mediaReady.music = true; });
  bgMusicEl.addEventListener("error", () => { mediaReady.music = true; });
  if (bgVideoEl.readyState >= 2) mediaReady.video = true;
  if (bgMusicEl.readyState >= 2) mediaReady.music = true;
  // Fallback — after 8s continue anyway
  setTimeout(() => { mediaReady.video = true; mediaReady.music = true; }, 8000);
  const tryPlay = () => {
    if (appState === "MENU") {
      bgVideoEl.play().catch(()=>{});
      bgMusicEl.play().catch(()=>{});
    }
  };
  tryPlay();
  window.addEventListener("touchstart", tryPlay, {once:true, passive:true});
  window.addEventListener("click", tryPlay, {once:true});
}
function playBgMedia(){
  try { bgVideoEl.currentTime = 0; } catch(e){}
  try { bgMusicEl.currentTime = 0; } catch(e){}
  bgVideoEl.play().catch(()=>{});
  bgMusicEl.play().catch(()=>{});
}
function pauseBgMedia(){
  try { bgVideoEl.pause(); } catch(e){}
  try { bgMusicEl.pause(); } catch(e){}
}

function createRifleModel(){
  const group = new THREE.Group();
  group.name = "Rifle";
  const blackMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.65, metalness: 0.85 });
  const darkMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.4, metalness: 0.95 });
  const accentMat = new THREE.MeshStandardMaterial({ color: 0x333338, roughness: 0.55, metalness: 0.9 });

  const receiver = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.09, 0.32), blackMat);
  group.add(receiver);
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.4, 8), darkMat);
  barrel.rotation.x = Math.PI / 2; barrel.position.set(0, 0.02, -0.36); group.add(barrel);
  const handguard = new THREE.Mesh(new THREE.BoxGeometry(0.048, 0.055, 0.22), blackMat);
  handguard.position.set(0, 0.02, -0.24); group.add(handguard);
  const mag = new THREE.Mesh(new THREE.BoxGeometry(0.032, 0.14, 0.05), accentMat);
  mag.position.set(0, -0.10, 0.02); mag.rotation.x = -0.15; group.add(mag);
  const stock = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.06, 0.20), blackMat);
  stock.position.set(0, -0.01, 0.26); group.add(stock);
  const grip = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.10, 0.035), blackMat);
  grip.position.set(0, -0.09, 0.14); grip.rotation.x = 0.25; group.add(grip);
  const scope = new THREE.Mesh(new THREE.BoxGeometry(0.022, 0.035, 0.10), darkMat);
  scope.position.set(0, 0.075, -0.05); group.add(scope);
  const frontSight = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.03, 0.015), darkMat);
  frontSight.position.set(0, 0.05, -0.32); group.add(frontSight);
  const muzzle = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.05, 8), darkMat);
  muzzle.rotation.x = Math.PI / 2; muzzle.position.set(0, 0.02, -0.58); group.add(muzzle);
  return group;
}

function attachWeaponToRightHand(character){
  if(!character) return null;
  const old = character.getObjectByName("Rifle");
  if(old && old.parent) old.parent.remove(old);

  const candidateNames = ["mixamorig:RightHand", "mixamorigRightHand", "RightHand", "hand_r", "Right_Hand", "Hand_R", "Bone_Hand_R", "RightHandBone"];
  let handBone = null;
  for (const n of candidateNames){ const b = character.getObjectByName(n); if(b){ handBone = b; break; } }
  if(!handBone) handBone = findBoneFlexible(character, ["righthand", "hand_r", "right_hand"]);

  if(!handBone){
    console.warn("⚠ Missing right hand bone — weapon not attached");
    return null;
  }
  console.log("✅ Right hand bone:", handBone.name);

  const rifle = createRifleModel();
  rifle.userData.isWeapon = true;
  rifle.traverse(o => {
    if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; }
  });
  rifle.position.set(0, 0.02, 0.02);
  rifle.rotation.set(Math.PI / 2, Math.PI / 2, 0);
  rifle.scale.setScalar(1.0);
  handBone.add(rifle);
  console.log("✅ Weapon attached to right hand");
  return rifle;
}

// ═══ AUTO-FIT ═══
function autoFitCharacter(model, targetHeight){
  targetHeight = targetHeight || 1.55;
  model.updateMatrixWorld(true);
  let box = new THREE.Box3().setFromObject(model);
  let size = box.getSize(new THREE.Vector3());
  if (size.y <= 0) return null;
  const scale = targetHeight / size.y;
  model.scale.multiplyScalar(scale);
  model.updateMatrixWorld(true);
  box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  model.position.x -= center.x;
  model.position.z -= center.z;
  model.position.y -= box.min.y;
  model.updateMatrixWorld(true);
  const finalBox = new THREE.Box3().setFromObject(model);
  const finalSize = finalBox.getSize(new THREE.Vector3());
  const finalCenter = finalBox.getCenter(new THREE.Vector3());
  console.log("✅ Character height:", finalSize.y.toFixed(3));
  return { height: finalSize.y, width: finalSize.x, depth: finalSize.z, center: finalCenter };
}

function fitPreviewCameraToCharacter(model, safeMargin){
  if (!previewCamera || !model) return;
  safeMargin = safeMargin || 1.5;
  model.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const height = size.y, width = size.x, depth = size.z;
  const visualWidth = Math.max(width, depth * 0.7);
  const fovRad = previewCamera.fov * Math.PI / 180;
  const aspect = previewCamera.aspect;
  const distV = (height * safeMargin) / (2 * Math.tan(fovRad / 2));
  const hFov = 2 * Math.atan(Math.tan(fovRad / 2) * aspect);
  const distH = (visualWidth * safeMargin) / (2 * Math.tan(hFov / 2));
  const distance = Math.max(distV, distH, 2.5);
  const lookY = height * 0.55;
  previewCamera.position.set(0, lookY, distance);
  previewCamera.lookAt(0, lookY * 0.95, 0);
  previewCamera.updateProjectionMatrix();
  console.log("✅ Camera fit distance:", distance.toFixed(2));
}

// ═══ PREVIEW ═══
let previewRenderer, previewScene, previewCamera, previewPivot = null;
let previewCharacter = null, previewMixer = null, previewWrapper = null;
let previewRunning = false;
let previewAutoRotate = true, previewAutoRotTimer = null;
let previewRotationY = 0;
let previewDragging = false, previewLastX = 0, previewVelY = 0;

function computePreviewSize(){
  const menuEl = document.getElementById("mainMenu");
  if(!menuEl) return { w: 300, h: 400 };
  const menuH = menuEl.clientHeight, menuW = menuEl.clientWidth;
  const topBar = document.querySelector(".menuTopBar");
  const bottomBar = document.querySelector(".menuBottomBar");
  const topH = topBar ? topBar.getBoundingClientRect().height : 80;
  const bottomH = bottomBar ? bottomBar.getBoundingClientRect().height : 70;
  const safeTop = topH + 20;
  const safeBottom = bottomH + 20;
  const availableH = Math.max(240, menuH - safeTop - safeBottom);
  const availableW = Math.min(menuW * 0.86, 420);
  let w = Math.min(availableW, availableH * 0.85);
  let h = Math.min(availableH, w / 0.85);
  return { w: Math.floor(w), h: Math.floor(h) };
}

function updatePreviewArea(){
  const wrap = document.getElementById("previewWrap");
  if(!wrap) return { w: 300, h: 400 };
  const { w, h } = computePreviewSize();
  wrap.style.width = w + "px";
  wrap.style.height = h + "px";
  const menuEl = document.getElementById("mainMenu");
  const menuH = menuEl.clientHeight;
  const topBar = document.querySelector(".menuTopBar");
  const bottomBar = document.querySelector(".menuBottomBar");
  const topH = topBar ? topBar.getBoundingClientRect().height : 80;
  const bottomH = bottomBar ? bottomBar.getBoundingClientRect().height : 70;
  const centerY = topH + 20 + (menuH - topH - 20 - bottomH - 20) / 2;
  wrap.style.top = centerY + "px";
  wrap.style.left = "50%";
  wrap.style.transform = "translate(-50%, -50%)";
  if (previewRenderer && previewCamera) {
    previewRenderer.setSize(w, h, false);
    previewCamera.aspect = w / h;
    previewCamera.updateProjectionMatrix();
    if (previewCharacter) fitPreviewCameraToCharacter(previewCharacter, 1.5);
  }
  return { w, h };
}

function initPreview(){
  if (previewRenderer) return; // ★ Prevent double init
  const canvas = document.getElementById("previewCanvas");
  const { w, h } = updatePreviewArea();

  previewRenderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true, powerPreference:"high-performance" });
  previewRenderer.setSize(w, h, false);
  previewRenderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  previewRenderer.outputColorSpace = THREE.SRGBColorSpace;
  previewRenderer.toneMapping = THREE.ACESFilmicToneMapping;
  previewRenderer.toneMappingExposure = 1.15;
  previewRenderer.shadowMap.enabled = true;
  previewRenderer.shadowMap.type = THREE.PCFSoftShadowMap;
  previewRenderer.setClearColor(0x000000, 0);

  previewScene = new THREE.Scene();
  previewCamera = new THREE.PerspectiveCamera(38, w / h, 0.05, 30);
  previewCamera.position.set(0, 1.2, 3.2);
  previewCamera.lookAt(0, 0.9, 0);

  const key = new THREE.DirectionalLight(0xfff2d6, 2.6);
  key.position.set(3.5, 5.5, 4);
  key.castShadow = true;
  key.shadow.mapSize.set(512, 512);
  key.shadow.camera.near = 0.5; key.shadow.camera.far = 15;
  key.shadow.camera.left = -2; key.shadow.camera.right = 2;
  key.shadow.camera.top = 3; key.shadow.camera.bottom = -1;
  key.shadow.bias = -0.0005;
  previewScene.add(key);
  const fill = new THREE.DirectionalLight(0x88aaff, 1.1);
  fill.position.set(-4, 3, 2.5); previewScene.add(fill);
  const rim = new THREE.DirectionalLight(0xffb86b, 1.6);
  rim.position.set(0, 3.5, -5); previewScene.add(rim);
  previewScene.add(new THREE.HemisphereLight(0xbcd6ee, 0x2a2a1a, 0.85));

  const disc = new THREE.Mesh(
    new THREE.CylinderGeometry(0.85, 0.95, 0.08, 40),
    new THREE.MeshStandardMaterial({ color: 0x2a3a5a, roughness: 0.5, metalness: 0.6, transparent:true, opacity:0.85 })
  );
  disc.position.y = -0.04; disc.receiveShadow = true; previewScene.add(disc);
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(0.9, 0.015, 8, 50),
    new THREE.MeshStandardMaterial({ color: 0xffcc00, emissive: 0xffcc00, emissiveIntensity: 2.0, roughness: 0.3 })
  );
  ring.rotation.x = Math.PI/2; ring.position.y = 0.02; previewScene.add(ring);

  previewPivot = new THREE.Group();
  previewScene.add(previewPivot);

  // ★ Build character (real soldier if available, else fallback)
  if (soldierGLTF) { applySoldierToPreview(); }
  else { buildFallbackPreview(); }

  function onDown(x){ previewDragging = true; previewLastX = x; previewAutoRotate = false; previewVelY = 0; if(previewAutoRotTimer) clearTimeout(previewAutoRotTimer); }
  function onMove(x){
    if(!previewDragging) return;
    const dx = x - previewLastX;
    previewLastX = x;
    previewRotationY -= dx * 0.012;
    previewVelY = -dx * 0.012;
  }
  function onUp(){
    if(!previewDragging) return;
    previewDragging = false;
    previewAutoRotTimer = setTimeout(() => { previewAutoRotate = true; }, 2200);
  }
  canvas.addEventListener("pointerdown", (e) => { e.preventDefault(); onDown(e.clientX); try { canvas.setPointerCapture(e.pointerId); } catch(err){} }, {passive:false});
  canvas.addEventListener("pointermove", (e) => { if(previewDragging){ e.preventDefault(); onMove(e.clientX); } }, {passive:false});
  canvas.addEventListener("pointerup", () => onUp());
  canvas.addEventListener("pointercancel", () => onUp());
  canvas.addEventListener("pointerleave", () => { if(previewDragging) onUp(); });

  previewRunning = true;
  previewLoop();

  // ★ Force re-apply soldier in case it loaded between init and now
  setTimeout(() => {
    if (soldierGLTF && previewPivot) {
      applySoldierToPreview();
    }
  }, 100);
}

function buildFallbackPreview(){
  const fb = createFallbackCharacter();
  previewWrapper = new THREE.Group();
  previewWrapper.userData.isPreviewWrapper = true;
  fb.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(fb);
  const size = box.getSize(new THREE.Vector3());
  const s = 1.5 / (size.y || 1);
  fb.scale.setScalar(s);
  fb.updateMatrixWorld(true);
  const box2 = new THREE.Box3().setFromObject(fb);
  const c2 = box2.getCenter(new THREE.Vector3());
  fb.position.x = -c2.x; fb.position.z = -c2.z; fb.position.y = -box2.min.y;
  previewWrapper.add(fb);
  previewPivot.add(previewWrapper);
  previewCharacter = previewWrapper;
}

function applySoldierToPreview(){
  if (!previewPivot || !soldierGLTF) return;
  try {
    while (previewPivot.children.length) previewPivot.remove(previewPivot.children[0]);
    if (previewMixer) { previewMixer.stopAllAction(); previewMixer = null; }

    const previewSoldier = SkeletonUtils.clone(soldierGLTF);
    previewSoldier.traverse(o => {
      if(o.isMesh){
        o.castShadow = true;
        o.receiveShadow = true;
        o.frustumCulled = false;
        if(o.material){
          o.material = o.material.clone();
          o.material.needsUpdate = true;
          if ("envMapIntensity" in o.material) o.material.envMapIntensity = 1.0;
        }
      }
    });

    autoFitCharacter(previewSoldier, 1.5);

    previewWrapper = new THREE.Group();
    previewWrapper.userData.isPreviewWrapper = true;
    previewWrapper.add(previewSoldier);
    previewPivot.add(previewWrapper);
    previewCharacter = previewWrapper;

    if (soldierAnimations && soldierAnimations.length > 0) {
      previewMixer = new THREE.AnimationMixer(previewSoldier);
      let idleClip = null;
      for(const c of soldierAnimations){ const n = (c.name || "").toLowerCase(); if(n === "idle"){ idleClip = c; break; } }
      if(!idleClip) for(const c of soldierAnimations){ if((c.name||"").toLowerCase().includes("idle")){ idleClip = c; break; } }
      if(!idleClip) idleClip = soldierAnimations[0];
      const act = previewMixer.clipAction(idleClip);
      act.setLoop(THREE.LoopRepeat, Infinity);
      act.play();
      console.log("✅ Preview idle animation:", idleClip.name || "(unnamed)");
    }

    attachWeaponToRightHand(previewSoldier);

    applyCustomization(previewSoldier, {
      helmetColor: tempHelmetColor, vestColor: tempVestColor,
      uniformColor: tempUniformColor, hasHelmet: tempHasHelmet, hasBackpack: tempHasBackpack
    });

    fitPreviewCameraToCharacter(previewSoldier, 1.5);

    let boneCount = 0;
    previewSoldier.traverse(o => { if(o.isBone) boneCount++; });
    console.log("✅ Character bones count:", boneCount);
  } catch(e){ console.warn("applySoldierToPreview error:", e); }
}

function previewLoop(){
  if(!previewRunning) return;
  requestAnimationFrame(previewLoop);
  if(appState !== "MENU") return;
  const now = performance.now();
  const dt = Math.min((now - (previewLoop._last || now)) / 1000, 0.05);
  previewLoop._last = now;
  if(previewMixer) previewMixer.update(dt);
  if(previewAutoRotate && !previewDragging){ previewRotationY += dt * 0.35; }
  if(!previewDragging && Math.abs(previewVelY) > 0.0005){
    previewRotationY += previewVelY * dt * 30; previewVelY *= 0.94;
  }
  if(previewPivot){ previewPivot.rotation.y = previewRotationY; }
  if(previewRenderer && previewScene && previewCamera){
    previewRenderer.render(previewScene, previewCamera);
  }
}

function applyCustomizationToPreview(){
  if(!previewCharacter) return;
  let soldier = previewCharacter;
  if(previewCharacter.userData && previewCharacter.userData.isPreviewWrapper){
    soldier = previewCharacter.children[0] || previewCharacter;
  }
  applyCustomization(soldier, {
    helmetColor: tempHelmetColor, vestColor: tempVestColor,
    uniformColor: tempUniformColor, hasHelmet: tempHasHelmet, hasBackpack: tempHasBackpack
  });
}

      helmetColor: tempHelmetColor, vestColor: tempVestColor,

}

  const geo = new THREE.SphereGeometry(50, 24, 12);
  const mat = new THREE.ShaderMaterial({
    uniforms: { topColor: {value: new THREE.Color(0x3a7ec8)}, midColor: {value: new THREE.Color(0xa8cce8)}, bottomColor: {value: new THREE.Color(0x6a6a5a)}, sunColor: {value: new THREE.Color(0xfff5d0)} },
    vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `uniform vec3 topColor; uniform vec3 midColor; uniform vec3 bottomColor; uniform vec3 sunColor; varying vec3 vDir; void main(){ float h = vDir.y; vec3 col; if(h > 0.0) col = mix(midColor, topColor, h); else col = mix(midColor, bottomColor, -h); float sd = max(0.0, dot(vDir, normalize(vec3(0.55, 0.65, 0.4)))); col += sunColor * pow(sd, 64.0) * 3.0; gl_FragColor = vec4(col, 1.0); }`,
    side: THREE.BackSide
  });
  envScene.add(new THREE.Mesh(geo, mat));
  return envScene;
}

const colliders = [];
function addBoxCollider(box, name){ colliders.push({ box: box.clone(), name }); }
function checkSphereCollision(x, z, r, box){
  const cx = Math.max(box.min.x, Math.min(x, box.max.x));
  const cz = Math.max(box.min.z, Math.min(z, box.max.z));
  const dx = x - cx, dz = z - cz;
  return (dx*dx + dz*dz) < r*r;
}
function resolveCharacterMove(oldX, oldZ, newX, newZ, radius){
  let fx = newX, fz = newZ, collision = false;
  for(const c of colliders){ if(checkSphereCollision(newX, newZ, radius, c.box)){ collision = true; break; } }
  if(collision){
    let xOK = true, zOK = true;
    for(const c of colliders){
      if(checkSphereCollision(newX, oldZ, radius, c.box)) xOK = false;
      if(checkSphereCollision(oldX, newZ, radius, c.box)) zOK = false;
    }
    if(xOK && !zOK){ fx = newX; fz = oldZ; }
    else if(!xOK && zOK){ fx = oldX; fz = newZ; }
    else if(!xOK && !zOK){ fx = oldX; fz = oldZ; }
    else { if(Math.abs(newX-oldX) < Math.abs(newZ-oldZ)){ fx = newX; fz = oldZ; } else { fx = oldX; fz = newZ; } }
  }
  return { x: fx, z: fz, collision };
}
function checkCarCollision(x, z, yaw, hw, hl){
  const cos = Math.cos(yaw), sin = Math.sin(yaw);
  const corners = [{x:hw,z:hl},{x:hw,z:-hl},{x:-hw,z:hl},{x:-hw,z:-hl}];
  for(const c of corners){
    const wx = x + c.x*cos - c.z*sin;
    const wz = z + c.x*sin + c.z*cos;
    for(const col of colliders){
      if(wx > col.box.min.x && wx < col.box.max.x && wz > col.box.min.z && wz < col.box.max.z) return true;
    }
  }
  return false;
}
function checkHeliCollision(x, y, z, radius){
  for(const col of colliders){
    if(y + radius < col.box.min.y || y - radius > col.box.max.y) continue;
    if(checkSphereCollision(x, z, radius, col.box)) return true;
  }
  return false;
}

function prep(obj){
  if(!obj) return;
  obj.traverse(o=>{
    if(o.isMesh){
      o.castShadow = true; o.receiveShadow = true;
      if(o.material){
        o.material.needsUpdate = true;
        if("envMapIntensity" in o.material) o.material.envMapIntensity = 1.2;
        if(o.material.map){ o.material.map.anisotropy = 8; o.material.map.colorSpace = THREE.SRGBColorSpace; }
      }
    }
  });
}

const facadeCache = {};
function getFacadeTex(style){
  if(facadeCache[style]) return facadeCache[style];
  const c = document.createElement("canvas");
  c.width = c.height = 384;
  const x = c.getContext("2d");
  if(style === "glass"){
    const bg = x.createLinearGradient(0, 0, 384, 0);
    bg.addColorStop(0, "#16283a"); bg.addColorStop(0.5, "#284a6a"); bg.addColorStop(1, "#16283a");
    x.fillStyle = bg; x.fillRect(0, 0, 384, 384);
    for(let y = 0; y < 384; y += 48){ x.fillStyle = "#08121e"; x.fillRect(0, y, 384, 3); }
    for(let xx = 0; xx < 384; xx += 48){ x.fillStyle = "#0c1826"; x.fillRect(xx, 0, 3, 384); }
    for(let y = 0; y < 384; y += 48){ for(let xx = 0; xx < 384; xx += 48){
      const grd = x.createLinearGradient(xx, y, xx + 48, y + 48);
      grd.addColorStop(0, `rgba(60,110,160,${0.15 + Math.random()*0.1})`);
      grd.addColorStop(0.5, `rgba(140,190,230,${0.05 + Math.random()*0.08})`);
      grd.addColorStop(1, `rgba(20,50,90,0.2)`);
      x.fillStyle = grd; x.fillRect(xx + 3, y + 3, 42, 42);
    }}
  } else if(style === "concrete"){
    x.fillStyle = "#a8a29a"; x.fillRect(0, 0, 384, 384);
    for(let i=0;i<3000;i++){ x.fillStyle = `rgba(${100+Math.random()*80},${95+Math.random()*80},${90+Math.random()*80},0.25)`; x.fillRect(Math.random()*384, Math.random()*384, 2, 2); }
    for(let y = 24; y < 384; y += 96){ for(let xx = 24; xx < 384; xx += 96){
      x.fillStyle = "#2a2a2a"; x.fillRect(xx - 3, y - 3, 54, 54);
      const grd = x.createLinearGradient(xx, y, xx + 48, y + 48);
      grd.addColorStop(0, "#1a2530"); grd.addColorStop(0.4, "#4a6070"); grd.addColorStop(0.7, "#2a3842"); grd.addColorStop(1, "#101820");
      x.fillStyle = grd; x.fillRect(xx, y, 48, 48);
    }}
  } else if(style === "brick"){
    x.fillStyle = "#7a3a28"; x.fillRect(0, 0, 384, 384);
    for(let y=0;y<384;y+=8){ const off = (y/8 % 2) * 8; for(let xx = -8; xx < 384; xx += 16){
      x.fillStyle = `rgba(${120+Math.random()*40},${60+Math.random()*30},${40+Math.random()*20},${0.5+Math.random()*0.3})`;
      x.fillRect(xx + off, y, 14, 6);
    }}
    for(let y = 32; y < 384; y += 96){ for(let xx = 32; xx < 384; xx += 96){
      x.fillStyle = "#1a1210"; x.fillRect(xx - 3, y - 3, 44, 50);
      x.fillStyle = "#3a4a5a"; x.fillRect(xx, y, 38, 44);
    }}
  } else {
    x.fillStyle = "#d8d4cc"; x.fillRect(0, 0, 384, 384);
    for(let i=0;i<2000;i++){ x.fillStyle = `rgba(${180+Math.random()*60},${175+Math.random()*60},${165+Math.random()*60},0.2)`; x.fillRect(Math.random()*384, Math.random()*384, 2, 2); }
    for(let y=0; y<384; y+=72){
      x.fillStyle = "rgba(40,45,55,0.9)"; x.fillRect(0, y, 384, 36);
      for(let xx = 6; xx < 384; xx += 30){
        const grd = x.createLinearGradient(xx, y, xx+26, y+36);
        grd.addColorStop(0, "rgba(80,130,180,0.65)"); grd.addColorStop(1, "rgba(20,50,100,0.75)");
        x.fillStyle = grd; x.fillRect(xx, y + 2, 26, 32);
      }
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; t.colorSpace = THREE.SRGBColorSpace;
  facadeCache[style] = t;
  return t;
}
function createRealisticBuilding(w, d, h, style, roofDetail){
  const g = new THREE.Group();
  const facadeTex = getFacadeTex(style).clone();
  facadeTex.wrapS = facadeTex.wrapT = THREE.RepeatWrapping;
  facadeTex.repeat.set(Math.max(1, Math.floor(w / 6)), Math.max(1, Math.floor(h / 8)));
  facadeTex.needsUpdate = true;
  const mat = new THREE.MeshStandardMaterial({ map: facadeTex, roughness: style === "glass" ? 0.15 : 0.85, metalness: style === "glass" ? 0.7 : 0.05, envMapIntensity: style === "glass" ? 1.6 : 0.7 });
  const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  box.position.y = h/2; box.castShadow = true; box.receiveShadow = true;
  g.add(box);
  const roofMat = new THREE.MeshStandardMaterial({color: 0x3a3a40, roughness: 0.85, metalness: 0.15});
  const cap = new THREE.Mesh(new THREE.BoxGeometry(w + 0.4, 0.5, d + 0.4), roofMat);
  cap.position.y = h + 0.25; cap.castShadow = true; g.add(cap);
  return g;
}

function createTrunkGeometry(){ return new THREE.CylinderGeometry(0.22, 0.5, 4.6, 8, 4); }
function createLeafGeometry(){
  const geo = new THREE.IcosahedronGeometry(1, 1);
  const pos = geo.attributes.position;
  for(let i = 0; i < pos.count; i++){
    const noise = 0.65 + Math.random() * 0.4;
    pos.setX(i, pos.getX(i) * noise); pos.setY(i, pos.getY(i) * noise); pos.setZ(i, pos.getZ(i) * noise);
  }
  geo.computeVertexNormals();
  return geo;
}
function plantTrees(){
  const trunkGeo = createTrunkGeometry();
  const leafGeo = createLeafGeometry();
  const barkMat = new THREE.MeshStandardMaterial({color: 0x5a3a20, roughness: 0.95, metalness: 0.02, envMapIntensity: 0.4});
  const leafMat = new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.85, metalness: 0.0, envMapIntensity: 0.7});
  const treePositions = [];
  for (let z = -200; z <= 200; z += 22){
    if (Math.abs(z) < 20) continue;
    treePositions.push({ x: -28, z, s: 0.9 + Math.random()*0.3 });
    treePositions.push({ x:  28, z, s: 0.9 + Math.random()*0.3 });
    treePositions.push({ x: z, z: -28, s: 0.9 + Math.random()*0.3 });
    treePositions.push({ x: z, z:  28, s: 0.9 + Math.random()*0.3 });
  }
  const scatters = [[60,60],[60,-60],[-60,60],[-60,-60],[160,60],[160,-60],[-160,60],[-160,-60],[60,160],[60,-160],[-60,160],[-60,-160],[220,40],[220,-40],[-220,40],[-220,-40]];
  for (const [x,z] of scatters){ treePositions.push({ x, z, s: 1 + Math.random()*0.2 }); }
  const leafInstances = [];
  const trunkMatrices = [];
  const dummy = new THREE.Object3D();
  for (const p of treePositions){
    const s = p.s;
    dummy.position.set(p.x, 2.3 * s, p.z);
    dummy.scale.set(s, s, s);
    dummy.rotation.set(0, Math.random() * Math.PI * 2, 0);
    dummy.updateMatrix();
    trunkMatrices.push(dummy.matrix.clone());
    const canopyCenterY = 5.8 * s;
    const numLeaves = 35 + Math.floor(Math.random() * 15);
    for (let i = 0; i < numLeaves; i++){
      const u = Math.random(), v = Math.random();
      const theta = 2 * Math.PI * u;
      const phi = Math.acos(2 * v - 1);
      const r = 1.0 + Math.pow(Math.random(), 0.6) * 1.9;
      const dirX = Math.sin(phi) * Math.cos(theta);
      const dirY = Math.cos(phi) * 0.75 + 0.25;
      const dirZ = Math.sin(phi) * Math.sin(theta);
      const posX = p.x + dirX * r * s;
      const posY = canopyCenterY + dirY * r * 0.8 * s;
      const posZ = p.z + dirZ * r * s;
      const scale = (0.4 + Math.random() * 0.35) * s;
      const col = new THREE.Color().setHSL(0.24 + Math.random()*0.12, 0.45 + Math.random()*0.25, 0.22 + Math.random()*0.18);
      dummy.position.set(posX, posY, posZ);
      dummy.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI * 2, Math.random() * Math.PI);
      dummy.scale.setScalar(scale);
      dummy.updateMatrix();
      leafInstances.push({ matrix: dummy.matrix.clone(), color: col });
    }
    const cb = new THREE.Box3(new THREE.Vector3(p.x - 0.6, 0, p.z - 0.6), new THREE.Vector3(p.x + 0.6, 4.6 * s, p.z + 0.6));
    addBoxCollider(cb, "tree");
  }
  const trunkInst = new THREE.InstancedMesh(trunkGeo, barkMat, trunkMatrices.length);
  trunkInst.castShadow = true; trunkInst.receiveShadow = true;
  for (let i = 0; i < trunkMatrices.length; i++) trunkInst.setMatrixAt(i, trunkMatrices[i]);
  trunkInst.instanceMatrix.needsUpdate = true;
  scene.add(trunkInst);
  const leafInst = new THREE.InstancedMesh(leafGeo, leafMat, leafInstances.length);
  leafInst.castShadow = true;
  for (let i = 0; i < leafInstances.length; i++){
    leafInst.setMatrixAt(i, leafInstances[i].matrix);

    actions.idle = mixer.clipAction(idleClip);

const joyZoneLeft = document.getElementById("joyZoneLeft");
const joyBaseFloat = document.getElementById("joyBaseFloat");
const joyKnobFloat = document.getElementById("joyKnobFloat");
const joy = { active: false, pointerId: null, originX: 0, originY: 0, maxRadius: 55, moveX: 0, moveY: 0 };
joyZoneLeft.addEventListener("pointerdown", (e) => {
  if(appState !== "GAME" || mode !== "walking" || joy.active) return;
  e.preventDefault();
  joyZoneLeft.setPointerCapture(e.pointerId);
  joy.active = true; joy.pointerId = e.pointerId;
  joy.originX = e.clientX; joy.originY = e.clientY;
  joy.moveX = 0; joy.moveY = 0;
  const r = joyZoneLeft.getBoundingClientRect();
  const lx = e.clientX - r.left, ly = e.clientY - r.top;
  joyBaseFloat.style.left = lx + "px"; joyBaseFloat.style.top = ly + "px";
  joyKnobFloat.style.left = lx + "px"; joyKnobFloat.style.top = ly + "px";
  joyBaseFloat.classList.add("active"); joyKnobFloat.classList.add("active");
}, { passive: false });
joyZoneLeft.addEventListener("pointermove", (e) => {
  if(!joy.active || e.pointerId !== joy.pointerId) return;
  e.preventDefault();
  let dx = e.clientX - joy.originX, dy = e.clientY - joy.originY;
  const d = Math.sqrt(dx*dx + dy*dy);
  if(d > joy.maxRadius){ const s = joy.maxRadius/d; dx *= s; dy *= s; }
  joy.moveX = dx / joy.maxRadius; joy.moveY = -dy / joy.maxRadius;
  const r = joyZoneLeft.getBoundingClientRect();
  joyKnobFloat.style.left = (joy.originX - r.left + dx) + "px";
  joyKnobFloat.style.top = (joy.originY - r.top + dy) + "px";
}, { passive: false });
function releaseJoy(e){
  if(!joy.active || e.pointerId !== joy.pointerId) return;
  joy.active = false; joy.pointerId = null;
  joy.moveX = 0; joy.moveY = 0;
  joyBaseFloat.classList.remove("active"); joyKnobFloat.classList.remove("active");
}
joyZoneLeft.addEventListener("pointerup", releaseJoy);
joyZoneLeft.addEventListener("pointercancel", releaseJoy);
joyZoneLeft.addEventListener("lostpointercapture", releaseJoy);

  camTouch.active = true; camTouch.pointerId = e.pointerId;
  camTouch.startX = e.clientX; camTouch.startY = e.clientY;
  camTouch.startUserYaw = cameraUserYaw; camTouch.startUserPitch = cameraUserPitch;
  camAutoReturn.active = false;
  if(camAutoReturn.timer){ clearTimeout(camAutoReturn.timer); camAutoReturn.timer = null; }
}, { passive: false });

  cameraUserYaw = camTouch.startUserYaw - dx * CAM_SENSITIVITY_X;
  cameraUserPitch = camTouch.startUserPitch + dy * CAM_SENSITIVITY_Y;

}, { passive: false });

const tmpDir = new THREE.Vector3();
const WALK_SPEED = 3.5, RUN_SPEED = 5.5;
let fallbackBobTime = 0;
function updateCharacterWalk(dt){
  if(!character || !character.visible) return;
  let inputX = joy.moveX, inputY = joy.moveY;
  if(keys.forward) inputY = 1;
  if(keys.back) inputY = -1;
  if(keys.left) inputX = -1;
  if(keys.right) inputX = 1;
  const camYaw = cameraBaseYaw + cameraUserYaw;
  const cFX = Math.sin(camYaw), cFZ = Math.cos(camYaw);
  const cRX = Math.sin(camYaw - Math.PI/2), cRZ = Math.cos(camYaw - Math.PI/2);
  tmpDir.set(cFX*inputY + cRX*inputX, 0, cFZ*inputY + cRZ*inputX);
  const mag = Math.min(1, Math.sqrt(inputX*inputX + inputY*inputY));
  const moving = mag > 0.1;
  if(moving && tmpDir.lengthSq() > 0.0001){
    tmpDir.normalize();
    const isRun = mag > 0.85;
    const sp = (isRun ? RUN_SPEED : WALK_SPEED) * mag;
    const ox = character.position.x, oz = character.position.z;
    let nx = ox + tmpDir.x * sp * dt, nz = oz + tmpDir.z * sp * dt;
    nx = Math.max(-WORLD_LIMIT, Math.min(WORLD_LIMIT, nx));
    nz = Math.max(-WORLD_LIMIT, Math.min(WORLD_LIMIT, nz));
    const res = resolveCharacterMove(ox, oz, nx, nz, CHAR_RADIUS);
    character.position.x = res.x; character.position.z = res.z;
    const aDX = res.x - ox, aDZ = res.z - oz;
    if(aDX*aDX + aDZ*aDZ > 0.0001){
      const ta = Math.atan2(aDX, aDZ);
      let diff = ta - charYaw;
      while(diff > Math.PI) diff -= Math.PI*2;
      while(diff < -Math.PI) diff += Math.PI*2;
      charYaw += diff * Math.min(1, 10 * dt);
      character.rotation.y = charYaw + MODEL_YAW_OFFSET;
    }
    if(useFallbackCharAnim){ fallbackBobTime += dt * (isRun ? 14 : 8); character.position.y = Math.abs(Math.sin(fallbackBobTime)) * 0.08; }
    else { if(actions.run && isRun && actions.run !== actions.walk) setAction("run"); else if(actions.walk) setAction("walk"); else if(actions.idle) setAction("idle"); }
  } else {
    if(useFallbackCharAnim){ character.position.y *= 0.85; fallbackBobTime = 0; }
    else { if(actions.idle) setAction("idle"); }
  }
}

let wasMoving = false;
function updateCarDrive(dt){
  if(!carModel) return;
  let st = 0;
  if(carKeys.left) st = carState.maxSteerAngle;
  if(carKeys.right) st = -carState.maxSteerAngle;
  if(st !== 0) carState.steerAngle += (st - carState.steerAngle) * carState.steerSpeed * dt;
  else carState.steerAngle += (0 - carState.steerAngle) * carState.steerReturn * dt;
  if(carKeys.brake){
    if(carState.speed > 0) carState.speed = Math.max(0, carState.speed - carState.brakingForce * dt);
    else if(carState.speed < 0) carState.speed = Math.min(0, carState.speed + carState.brakingForce * dt);
  } else if(carKeys.forward){ carState.speed = Math.min(carState.maxForwardSpeed, carState.speed + carState.acceleration * dt); }
  else if(carKeys.reverse){
    if(carState.speed > 0) carState.speed = Math.max(0, carState.speed - carState.brakingForce * dt);
    else carState.speed = Math.max(-carState.maxReverseSpeed, carState.speed - carState.reverseAcceleration * dt);
  } else {
    if(Math.abs(carState.speed) > 0.05){
      const f = carState.friction * dt;
      if(carState.speed > 0) carState.speed = Math.max(0, carState.speed - f);
      else carState.speed = Math.min(0, carState.speed + f);
    } else carState.speed = 0;
  }
  let newRot = carState.rotation;
  if(Math.abs(carState.speed) > 0.1){
    const spN = Math.abs(carState.speed) / carState.maxForwardSpeed;
    const sf = Math.min(1, 0.4 + (1 - spN) * 0.8);
    const dir = carState.speed >= 0 ? 1 : -1;
    newRot += carState.steerAngle * dir * sf * 1.8 * dt;
  }
  const fX = Math.sin(newRot), fZ = Math.cos(newRot);
  let nX = carState.position.x + fX * carState.speed * dt, nZ = carState.position.z + fZ * carState.speed * dt;
  nX = Math.max(-WORLD_LIMIT, Math.min(WORLD_LIMIT, nX));
  nZ = Math.max(-WORLD_LIMIT, Math.min(WORLD_LIMIT, nZ));
  const collide = checkCarCollision(nX, nZ, newRot, carHalfWidth, carHalfLength);
  if(!collide){ carState.rotation = newRot; carState.position.x = nX; carState.position.z = nZ; }
  else {
    const xC = checkCarCollision(nX, carState.position.z, newRot, carHalfWidth, carHalfLength);
    const zC = checkCarCollision(carState.position.x, nZ, newRot, carHalfWidth, carHalfLength);
    if(!xC && zC){ carState.rotation = newRot; carState.position.x = nX; carState.speed *= 0.6; }
    else if(xC && !zC){ carState.rotation = newRot; carState.position.z = nZ; carState.speed *= 0.6; }
    else { carState.speed *= 0.2; if(Math.abs(carState.speed) < 0.3) carState.speed = 0; }
  }
  carModel.position.copy(carState.position);
  carModel.rotation.y = carState.rotation + CAR_MODEL_YAW_OFFSET;
  carState.wheelRotation += carState.speed * dt * 2.5;
  const wr = carState.wheelRotation;
  if(carWheels.fl.steerGroup) carWheels.fl.steerGroup.rotation.y = carState.steerAngle;
  if(carWheels.fr.steerGroup) carWheels.fr.steerGroup.rotation.y = carState.steerAngle;
  if(carWheels.fl.spinGroup) carWheels.fl.spinGroup.rotation.x = wr;
  if(carWheels.fr.spinGroup) carWheels.fr.spinGroup.rotation.x = wr;
  if(carWheels.rl.spinGroup) carWheels.rl.spinGroup.rotation.x = wr;
  if(carWheels.rr.spinGroup) carWheels.rr.spinGroup.rotation.x = wr;
  AudioEngine.update(dt, carState.speed, carKeys.forward, carKeys.reverse, mode === "driving");
  const isMove = Math.abs(carState.speed) > 0.5;
  if((isMove && !wasMoving) || (!isMove && wasMoving)){ if(AudioEngine.gainNode && AudioEngine.source === null) AudioEngine.startIdleLoop(); }
  wasMoving = isMove;
  const kmh = Math.abs(carState.speed * 3.6);
  carSpeedEl.textContent = kmh.toFixed(0);
  speedBarFill.style.width = Math.min(100, (kmh / (carState.maxForwardSpeed * 3.6)) * 100) + "%";
  if(carState.speed > 0.3){ gearIndicator.textContent = "D"; gearIndicator.className = ""; }
  else if(carState.speed < -0.3){ gearIndicator.textContent = "R"; gearIndicator.className = "reverse"; }
  else { gearIndicator.textContent = "N"; gearIndicator.className = "neutral"; }
}

function updateHelicopter(dt){
  if(!heliModel) return;
  if(heliState.engineState === "STARTING"){
    heliState.engineRPM += (1 - heliState.engineRPM) * Math.min(1, dt * 0.5);
    if(heliState.engineRPM > 0.95){ heliState.engineState = "RUNNING"; heliEngineBtn.classList.add("running"); }
  } else if(heliState.engineState === "STOPPING"){
    heliState.engineRPM += (0 - heliState.engineRPM) * Math.min(1, dt * 0.6);
    if(heliState.engineRPM < 0.02){ heliState.engineRPM = 0; heliState.engineState = "OFF"; heliEngineBtn.classList.remove("running"); }
  } else if(heliState.engineState === "RUNNING"){ heliState.engineRPM += (1 - heliState.engineRPM) * Math.min(1, dt * 0.6); }
  else { heliState.engineRPM += (0 - heliState.engineRPM) * Math.min(1, dt * 2); }
  heliState.targetRotorSpeed = heliState.engineRPM;
  heliState.rotorSpeed += (heliState.targetRotorSpeed - heliState.rotorSpeed) * Math.min(1, dt * 0.9);
  if(heliTopRotor){ heliState.rotorAngleTop += heliState.rotorSpeed * 55 * dt; heliTopRotor.rotation.y = heliState.rotorAngleTop; }
  if(heliBackRotor){ heliState.rotorAngleBack += heliState.rotorSpeed * 90 * dt; heliBackRotor.rotation.x = heliState.rotorAngleBack; }
  if(heliState.rotorSpeed > 0.05 && heliBellHuey){
    heliState.vibrationTime += dt * 30;
    const v = heliState.rotorSpeed * 0.007;
    heliBellHuey.position.x = Math.sin(heliState.vibrationTime * 1.3) * v;
    heliBellHuey.position.z = Math.cos(heliState.vibrationTime * 1.7) * v;
    heliBellHuey.position.y = heliBodyInitialY + Math.sin(heliState.vibrationTime * 2.3) * v * 0.5;
  } else if(heliBellHuey){
    heliBellHuey.position.x *= 0.9; heliBellHuey.position.z *= 0.9;
    heliBellHuey.position.y += (heliBodyInitialY - heliBellHuey.position.y) * 0.1;
  }
  HeliAudio.update(dt, heliState.engineState, heliState.engineRPM);
  const engineReady = heliState.engineRPM > 0.6;
  if(mode === "flying"){
    let tfs = 0;
    if(engineReady){ if(heliKeys.forward) tfs = 20; else if(heliKeys.back) tfs = -8; }
    heliState.targetSpeed = tfs;
    heliState.speed += (heliState.targetSpeed - heliState.speed) * Math.min(1, dt * 1.5);
    let tv = 0;
    if(engineReady){
      if(heliKeys.up) tv = 12;
      else if(heliKeys.down) tv = -18;
      else { heliState.hoverPhase += dt * 1.2; tv = Math.sin(heliState.hoverPhase) * 0.25; }
    } else { tv = heliState.position.y > heliState.restAltitude ? -3 : 0; }
    heliState.targetVerticalSpeed = tv;
    heliState.verticalSpeed += (heliState.targetVerticalSpeed - heliState.verticalSpeed) * Math.min(1, dt * 5);
    let tyr = 0;
    if(engineReady){ if(heliKeys.left) tyr = 1.2; else if(heliKeys.right) tyr = -1.2; }
    heliState.yaw += tyr * dt;
    const fX = Math.sin(heliState.yaw), fZ = Math.cos(heliState.yaw);
    let nX = heliState.position.x + fX * heliState.speed * dt;
    let nZ = heliState.position.z + fZ * heliState.speed * dt;
    nX = Math.max(-WORLD_LIMIT, Math.min(WORLD_LIMIT, nX));
    nZ = Math.max(-WORLD_LIMIT, Math.min(WORLD_LIMIT, nZ));
    let nY = heliState.position.y + heliState.verticalSpeed * dt;
    const minY = heliState.restAltitude;
    if(nY < minY){ nY = minY; heliState.verticalSpeed = 0; }
    if(nY > heliState.maxAltitude){ nY = heliState.maxAltitude; heliState.verticalSpeed = Math.min(0, heliState.verticalSpeed); }
    if(!checkHeliCollision(nX, nY, nZ, HELI_COLLISION_RADIUS)){ heliState.position.set(nX, nY, nZ); }
    else {
      const xOK = !checkHeliCollision(nX, nY, heliState.position.z, HELI_COLLISION_RADIUS);
      const zOK = !checkHeliCollision(heliState.position.x, nY, nZ, HELI_COLLISION_RADIUS);
      if(xOK && !zOK){ heliState.position.x = nX; heliState.position.y = nY; heliState.speed *= 0.5; }
      else if(!xOK && zOK){ heliState.position.z = nZ; heliState.position.y = nY; heliState.speed *= 0.5; }
      else { const yOK = !checkHeliCollision(heliState.position.x, nY, heliState.position.z, HELI_COLLISION_RADIUS); if(yOK) heliState.position.y = nY; heliState.speed *= 0.3; heliState.verticalSpeed *= 0.3; }
    }
    heliState.targetPitch = -heliState.speed * 0.015;
    heliState.pitch += (heliState.targetPitch - heliState.pitch) * Math.min(1, dt * 3);
    heliState.targetRoll = -tyr * 0.35;
    heliState.roll += (heliState.targetRoll - heliState.roll) * Math.min(1, dt * 3);
    heliModel.position.copy(heliState.position);
    heliModel.rotation.order = "YXZ";
    heliModel.rotation.y = heliState.yaw;
    heliModel.rotation.x = heliState.pitch;
    heliModel.rotation.z = heliState.roll;
  } else {
    heliState.speed *= 0.95; heliState.verticalSpeed *= 0.95;
    heliState.pitch *= 0.9; heliState.roll *= 0.9;
    if(heliState.position.y > heliState.restAltitude){ heliState.position.y -= 3 * dt; if(heliState.position.y < heliState.restAltitude) heliState.position.y = heliState.restAltitude; }
    heliModel.position.copy(heliState.position);
    heliModel.rotation.order = "YXZ";
    heliModel.rotation.y = heliState.yaw;
    heliModel.rotation.x = heliState.pitch;
    heliModel.rotation.z = heliState.roll;
  }
  if(mode === "flying"){
    heliSpeedEl.textContent = Math.abs(heliState.speed * 3.6).toFixed(0);
    heliAltitudeEl.textContent = (heliState.position.y - heliState.restAltitude).toFixed(1);
    heliRPMEl.textContent = (heliState.engineRPM * 100).toFixed(0);
    let st = "OFF";
    if(heliState.engineState === "STARTING") st = "STARTING";
    else if(heliState.engineState === "RUNNING") st = "RUNNING";
    else if(heliState.engineState === "STOPPING") st = "STOPPING";
    heliEngineStateEl.textContent = st;
  }
}

function checkEnterProximity(){
  if(appState !== "GAME" || mode !== "walking" || !character){ enterCarBtn.classList.remove("show"); enterHeliBtn.classList.remove("show"); return; }
  if(carModel){
    const dx = character.position.x - carState.position.x;
    const dz = character.position.z - carState.position.z;
    if(Math.sqrt(dx*dx + dz*dz) < ENTER_DISTANCE) enterCarBtn.classList.add("show");
    else enterCarBtn.classList.remove("show");
  }
  if(heliModel){
    const dx = character.position.x - heliState.position.x;
    const dz = character.position.z - heliState.position.z;
    if(Math.sqrt(dx*dx + dz*dz) < ENTER_HELI_DISTANCE) enterHeliBtn.classList.add("show");
    else enterHeliBtn.classList.remove("show");
  }
}

const cameraState = { smoothTarget: new THREE.Vector3(0, 1, 0), transitioning: false, transitionProgress: 1, initialized: false };
const currentCamParams = { distance: CAM_WALK.distance, height: CAM_WALK.height, lookHeight: CAM_WALK.lookHeight };
function dampAngle(c, t, l, dt){
  let d = t - c;
  while(d > Math.PI) d -= Math.PI * 2;
  while(d < -Math.PI) d += Math.PI * 2;
  return c + d * (1 - Math.exp(-l * dt));
}
const _camDesired = new THREE.Vector3();
const _lookTarget = new THREE.Vector3();
function updateCamera(dt){
  let tp = null, ry = 0, tc = null;
  if(mode === "driving" && carModel){ tp = carState.position; ry = carState.rotation; tc = CAM_DRIVE; }
  else if(mode === "flying" && heliModel){ tp = heliState.position; ry = heliState.yaw; tc = CAM_HELI; }
  else if(character){ tp = character.position; ry = charYaw; tc = CAM_WALK; }
  if(!tp){ tp = new THREE.Vector3(0, 0, 0); ry = 0; tc = CAM_WALK; }
  const yl = (mode === "flying") ? 6.0 : ((mode === "driving") ? 8.0 : 5.0);
  cameraBaseYaw = dampAngle(cameraBaseYaw, ry, yl, dt);
  if(cameraState.transitioning){
    cameraState.transitionProgress = Math.min(1, cameraState.transitionProgress + dt * 1.5);
    const t = cameraState.transitionProgress;
    const s = t * t * (3 - 2 * t);
    currentCamParams.distance = THREE.MathUtils.lerp(currentCamParams.distance, tc.distance, s);
    currentCamParams.height = THREE.MathUtils.lerp(currentCamParams.height, tc.height, s);
    currentCamParams.lookHeight = THREE.MathUtils.lerp(currentCamParams.lookHeight, tc.lookHeight, s);
    if(t >= 1) cameraState.transitioning = false;
  } else {
    currentCamParams.distance += (tc.distance - currentCamParams.distance) * Math.min(1, dt * 4);
    currentCamParams.height += (tc.height - currentCamParams.height) * Math.min(1, dt * 4);
    currentCamParams.lookHeight += (tc.lookHeight - currentCamParams.lookHeight) * Math.min(1, dt * 4);
  }
  if(camAutoReturn.active && !camTouch.active){
    cameraUserYaw = dampAngle(cameraUserYaw, 0, CAM_AUTO_RETURN_SPEED, dt);
    cameraUserPitch += (0 - cameraUserPitch) * (1 - Math.exp(-CAM_AUTO_RETURN_SPEED * dt));
  }
  const fy = cameraBaseYaw + cameraUserYaw;
  const p = cameraUserPitch;
  const bX = -Math.sin(fy), bZ = -Math.cos(fy);
  const pC = Math.cos(p), pS = Math.sin(p);
  _camDesired.set(
    tp.x + bX * currentCamParams.distance * pC,
    tp.y + currentCamParams.height + pS * currentCamParams.distance,
    tp.z + bZ * currentCamParams.distance * pC
  );
  if(_camDesired.y < 0.6) _camDesired.y = 0.6;
  if(!cameraState.initialized){
    camera.position.copy(_camDesired);
    cameraState.smoothTarget.set(tp.x, tp.y + currentCamParams.lookHeight, tp.z);
    cameraState.initialized = true;
  } else {
    const pl = (mode === "flying") ? 6 : ((mode === "driving") ? 10 : 8);
    camera.position.lerp(_camDesired, 1 - Math.exp(-pl * dt));
    _lookTarget.set(tp.x, tp.y + currentCamParams.lookHeight, tp.z);
    cameraState.smoothTarget.lerp(_lookTarget, 1 - Math.exp(-14 * dt));
  }
  camera.lookAt(cameraState.smoothTarget);
}

let saveTimer = 0;
function doAutoSave(dt){
  if(appState !== "GAME") return;
  saveTimer += dt;
  if(saveTimer > 2){
    saveTimer = 0;
    if(character){ SaveSystem.data.charPos = { x: character.position.x, y: character.position.y, z: character.position.z }; SaveSystem.data.charYaw = charYaw; }
    if(carModel){ SaveSystem.data.carPos = { x: carState.position.x, y: carState.position.y, z: carState.position.z }; SaveSystem.data.carRotation = carState.rotation; }
    if(heliModel){ SaveSystem.data.heliPos = { x: heliState.position.x, y: heliState.position.y, z: heliState.position.z }; SaveSystem.data.heliRotation = heliState.yaw; }
    SaveSystem.data.mode = mode;
    SaveSystem.data.savedAt = Date.now();
    SaveSystem.save();
  }
}

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if(appState === "GAME" && gameStarted){
    if(mixer) mixer.update(dt);
    if(heliMixer) heliMixer.update(dt);
    if(mode === "walking"){ updateCharacterWalk(dt); checkEnterProximity(); }
    else if(mode === "driving"){ updateCarDrive(dt); }
    else if(mode === "flying"){ updateHelicopter(dt); }
    gainPlaytimeXp(dt);
    updateCamera(dt);
    doAutoSave(dt);
  }

  if(appState === "GAME" && mode !== "flying" && heliModel) updateHelicopter(dt);

  sun.target.position.set(camera.position.x, 0, camera.position.z);
  sun.target.updateMatrixWorld();
  skyDome.position.set(camera.position.x, 0, camera.position.z);

  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if(appState === "MENU") updatePreviewArea();
});

window.addEventListener("beforeunload", () => {
  if(character){ SaveSystem.data.charPos = { x: character.position.x, y: character.position.y, z: character.position.z }; SaveSystem.data.charYaw = charYaw; }
  if(carModel){ SaveSystem.data.carPos = { x: carState.position.x, y: carState.position.y, z: carState.position.z }; SaveSystem.data.carRotation = carState.rotation; }
  if(heliModel){ SaveSystem.data.heliPos = { x: heliState.position.x, y: heliState.position.y, z: heliState.position.z }; SaveSystem.data.heliRotation = heliState.yaw; }
  SaveSystem.data.mode = mode;
  SaveSystem.save();
  Profile.save();
});
</script>
