<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a15">
<title>TPS Pro + Helicopter</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a15;touch-action:none;font-family:Arial,Tahoma,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}

/* LOADING */
#loading{position:fixed;inset:0;z-index:1000;background:#0a0a15;background-image:url('https://uploadkon.ir/uploads/a6c023_26grok-1790086009059.jpg');background-size:cover;background-position:center;display:flex;align-items:flex-end;justify-content:center;padding-bottom:40px;transition:opacity 0.6s, visibility 0.6s}
#loading.hidden{opacity:0;visibility:hidden;pointer-events:none}
#loadingBarWrapper{width:75%;max-width:500px;height:6px;background:rgba(0,0,0,0.6);border-radius:3px;overflow:hidden;box-shadow:0 0 20px rgba(0,0,0,0.7)}
#loadingBar{height:100%;width:0%;background:linear-gradient(90deg,#ffcc00,#ffe066,#ffcc00);border-radius:3px;transition:width 0.3s ease-out;box-shadow:0 0 15px rgba(255,204,0,0.9)}

/* JOYSTICK */
#joyZoneLeft{position:fixed;bottom:0;left:0;width:55%;height:70%;z-index:15;touch-action:none}
#joyZoneLeft.hidden{display:none}
#joyBaseFloat{position:absolute;width:120px;height:120px;border-radius:50%;border:3px solid rgba(255,255,255,0.35);background:radial-gradient(circle, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.02) 70%);transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity 0.2s}
#joyBaseFloat.active{opacity:1}
#joyKnobFloat{position:absolute;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95), rgba(255,51,102,0.85));border:3px solid rgba(255,255,255,0.9);transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity 0.2s;box-shadow:0 6px 25px rgba(255,51,102,0.7)}
#joyKnobFloat.active{opacity:1}

#camZoneRight{position:fixed;top:0;right:0;width:50%;height:100%;z-index:14;touch-action:none}
#camZoneRight.hidden{display:none}

/* CAR CONTROLS */
#carControls{position:fixed;inset:0;pointer-events:none;z-index:16;display:none}
#carControls.show{display:block}
.steer-svg-btn{position:absolute;bottom:20px;width:65px;height:65px;pointer-events:auto;touch-action:none;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.6))}
.steer-svg-btn:active,.steer-svg-btn.active{transform:scale(0.9)}
#steer-left{left:15px}
#steer-right{left:90px}
#gasBtn{position:absolute;bottom:20px;right:15px;width:85px;height:85px;pointer-events:auto;touch-action:none;filter:drop-shadow(0 6px 18px rgba(0,0,0,0.7))}
#gasBtn:active,#gasBtn.active{transform:scale(0.92) translateY(4px)}
#brakeSvgBtn{position:absolute;bottom:120px;right:15px;width:70px;height:70px;pointer-events:auto;touch-action:none;filter:drop-shadow(0 5px 15px rgba(0,0,0,0.7))}
#brakeSvgBtn:active,#brakeSvgBtn.active{transform:scale(0.92) translateY(3px)}
#reverseBtn{position:absolute;bottom:205px;right:15px;width:62px;height:62px;pointer-events:auto;touch-action:none;filter:drop-shadow(0 5px 15px rgba(0,0,0,0.7))}
#reverseBtn:active,#reverseBtn.active{transform:scale(0.92) translateY(3px)}

/* HELICOPTER CONTROLS */
#heliControls{position:fixed;inset:0;pointer-events:none;z-index:16;display:none}
#heliControls.show{display:block}

.heli-btn{
  position:absolute;
  border-radius:50%;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:auto;
  touch-action:none;
  font-weight:900;
  text-shadow:0 2px 4px rgba(0,0,0,0.8);
  transition:transform 0.08s, box-shadow 0.08s;
  border:2px solid rgba(255,255,255,0.35);
  backdrop-filter:blur(8px);
  box-shadow:0 4px 15px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.2);
}
.heli-btn:active,.heli-btn.active{
  transform:scale(0.9);
  box-shadow:0 0 22px rgba(100,180,255,0.9), inset 0 1px 2px rgba(255,255,255,0.3);
}

#heli-left{left:15px;bottom:20px;width:60px;height:60px;font-size:20px;background:linear-gradient(135deg, rgba(50,100,200,0.75), rgba(30,60,140,0.75))}
#heli-right{left:85px;bottom:20px;width:60px;height:60px;font-size:20px;background:linear-gradient(135deg, rgba(50,100,200,0.75), rgba(30,60,140,0.75))}
#heli-fwd{left:50px;bottom:105px;width:60px;height:60px;font-size:20px;background:linear-gradient(135deg, rgba(60,120,220,0.75), rgba(30,70,150,0.75))}
#heli-back{left:50px;bottom:180px;width:60px;height:60px;font-size:20px;background:linear-gradient(135deg, rgba(60,120,220,0.75), rgba(30,70,150,0.75))}
#heli-up{right:85px;bottom:20px;width:60px;height:60px;font-size:20px;background:linear-gradient(135deg, rgba(60,180,100,0.75), rgba(30,120,60,0.75))}
#heli-down{right:15px;bottom:20px;width:60px;height:60px;font-size:20px;background:linear-gradient(135deg, rgba(200,60,60,0.75), rgba(140,30,30,0.75))}

#heli-engine{
  right:20px;
  bottom:105px;
  width:110px;
  height:60px;
  border-radius:14px;
  font-size:13px;
  font-weight:900;
  letter-spacing:1px;
  background:linear-gradient(135deg, rgba(200,220,255,0.15), rgba(150,180,240,0.08));
  border:2px solid rgba(200,220,255,0.55);
  backdrop-filter:blur(12px);
  box-shadow:0 4px 20px rgba(100,150,255,0.35), inset 0 1px 2px rgba(255,255,255,0.3), inset 0 -2px 8px rgba(0,0,0,0.2);
  color:#e8f0ff;
  text-shadow:0 0 8px rgba(150,200,255,0.9), 0 1px 3px rgba(0,0,0,0.7);
}
#heli-engine:active,#heli-engine.active{
  background:linear-gradient(135deg, rgba(150,200,255,0.4), rgba(100,150,240,0.25));
  box-shadow:0 0 30px rgba(150,200,255,0.9), inset 0 1px 3px rgba(255,255,255,0.5);
  transform:scale(0.94);
}
#heli-engine.running{
  background:linear-gradient(135deg, rgba(150,255,200,0.3), rgba(60,180,120,0.2));
  border-color:rgba(180,255,220,0.75);
  color:#e8ffee;
  text-shadow:0 0 10px rgba(150,255,200,1), 0 1px 3px rgba(0,0,0,0.7);
  box-shadow:0 0 25px rgba(100,255,180,0.6), inset 0 1px 2px rgba(255,255,255,0.4);
  animation:engineGlow 1.5s infinite;
}
@keyframes engineGlow{
  0%,100%{box-shadow:0 0 25px rgba(100,255,180,0.5), inset 0 1px 2px rgba(255,255,255,0.4)}
  50%{box-shadow:0 0 40px rgba(100,255,180,0.9), inset 0 1px 2px rgba(255,255,255,0.6)}
}

#heliExitBtn{position:absolute;top:12px;left:12px;padding:8px 16px;background:linear-gradient(135deg, rgba(220,40,40,0.85), rgba(160,20,20,0.85));border:2px solid rgba(255,255,255,0.5);border-radius:10px;color:#fff;font-size:12px;font-weight:600;display:none;pointer-events:auto;z-index:20;backdrop-filter:blur(6px)}
#heliExitBtn.show{display:block}

/* HUD */
#heliHUD{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg, rgba(10,15,30,0.85), rgba(20,25,45,0.85));backdrop-filter:blur(12px);padding:6px 16px;border-radius:12px;border:1px solid rgba(120,180,255,0.25);display:none;align-items:center;gap:10px;color:#fff;z-index:15;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,0.5)}
#heliHUD.show{display:flex}
.heli-hud-item{display:flex;flex-direction:column;align-items:center;min-width:42px}
.heli-hud-value{font-size:15px;font-weight:700;color:#4fc3f7;font-variant-numeric:tabular-nums;line-height:1}
.heli-hud-label{font-size:8px;opacity:0.55;letter-spacing:0.5px;margin-top:2px}
#heliAltitude{color:#44ff88}
#heliRPM{color:#ffcc44}
#heliEngineState{color:#ff8866;font-size:9px;font-weight:700;letter-spacing:0.5px}
.heli-hud-divider{width:1px;height:22px;background:rgba(255,255,255,0.12)}

#carHUD{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg, rgba(15,15,25,0.9), rgba(25,25,40,0.9));backdrop-filter:blur(12px);padding:8px 18px;border-radius:14px;border:1px solid rgba(255,255,255,0.15);display:flex;align-items:center;gap:12px;color:#fff;z-index:15;pointer-events:none}
#carSpeed{font-size:24px;font-weight:700;color:#ff6b3d;min-width:45px;text-align:center}
#carSpeedLabel{font-size:9px;opacity:0.6}
#gearIndicator{font-size:15px;font-weight:700;color:#4fc3f7;padding:0 10px;border-left:1px solid rgba(255,255,255,0.12);border-right:1px solid rgba(255,255,255,0.12)}
#gearIndicator.reverse{color:#ffab40}
#gearIndicator.neutral{color:#666}
#speedBar{width:80px;height:4px;background:rgba(0,0,0,0.5);border-radius:2px;overflow:hidden}
#speedBarFill{height:100%;width:0%;background:linear-gradient(90deg,#44ff88,#ffcc44,#ff3344);border-radius:2px;transition:width 0.1s}

#enterCarBtn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:16px 28px;background:linear-gradient(135deg, rgba(255,51,102,0.95), rgba(255,107,61,0.95));border:3px solid rgba(255,255,255,0.6);border-radius:16px;color:#fff;font-size:16px;font-weight:700;display:none;align-items:center;justify-content:center;pointer-events:auto;z-index:20;animation:pulseEnter 1.8s ease-in-out infinite;backdrop-filter:blur(6px)}
#enterCarBtn.show{display:flex}
@keyframes pulseEnter{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.05)}}

#enterHeliBtn{position:absolute;top:56%;left:50%;transform:translate(-50%,-50%);padding:16px 28px;background:linear-gradient(135deg, rgba(60,160,240,0.95), rgba(30,100,200,0.95));border:3px solid rgba(255,255,255,0.6);border-radius:16px;color:#fff;font-size:16px;font-weight:700;display:none;align-items:center;justify-content:center;pointer-events:auto;z-index:20;animation:pulseEnter 1.8s ease-in-out infinite;backdrop-filter:blur(6px)}
#enterHeliBtn.show{display:flex}

#exitCarBtn{position:absolute;top:12px;left:12px;padding:8px 16px;background:linear-gradient(135deg, rgba(220,40,40,0.85), rgba(160,20,20,0.85));border:2px solid rgba(255,255,255,0.5);border-radius:10px;color:#fff;font-size:12px;font-weight:600;display:none;pointer-events:auto;z-index:20;backdrop-filter:blur(6px)}
#exitCarBtn.show{display:block}

#hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.6);color:#fff;padding:6px 14px;border-radius:18px;font-size:10px;z-index:14;pointer-events:none;opacity:0.9;transition:opacity 0.5s;backdrop-filter:blur(6px)}
#hint.hidden{opacity:0}

#soundToggle{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,0.7);border:2px solid rgba(255,255,255,0.4);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;pointer-events:auto;z-index:20;backdrop-filter:blur(6px)}
#soundToggle.muted{background:linear-gradient(135deg, rgba(200,35,35,0.9), rgba(150,20,20,0.9))}
</style>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>

<div id="loading"><div id="loadingBarWrapper"><div id="loadingBar"></div></div></div>

<div id="joyZoneLeft"><div id="joyBaseFloat"></div><div id="joyKnobFloat"></div></div>
<div id="camZoneRight"></div>
<div id="hint">👈 چپ: حرکت | 👉 راست: دوربین</div>

<div id="carControls">
  <svg class="steer-svg-btn" id="steer-left" viewBox="0 0 100 100"><defs><radialGradient id="sgl" cx="40%" cy="35%"><stop offset="0%" stop-color="#5aa2ff"/><stop offset="50%" stop-color="#2874d8"/><stop offset="100%" stop-color="#0f3a80"/></radialGradient></defs><circle cx="50" cy="50" r="46" fill="url(#sgl)" stroke="#a8d4ff" stroke-width="3"/><path d="M 70 50 L 35 50 M 45 38 L 32 50 L 45 62" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"/></svg>
  <svg class="steer-svg-btn" id="steer-right" viewBox="0 0 100 100"><defs><radialGradient id="sgr" cx="40%" cy="35%"><stop offset="0%" stop-color="#5aa2ff"/><stop offset="50%" stop-color="#2874d8"/><stop offset="100%" stop-color="#0f3a80"/></radialGradient></defs><circle cx="50" cy="50" r="46" fill="url(#sgr)" stroke="#a8d4ff" stroke-width="3"/><path d="M 30 50 L 65 50 M 55 38 L 68 50 L 55 62" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"/></svg>
  <svg id="gasBtn" viewBox="0 0 120 120"><defs><linearGradient id="gg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#4ade80"/><stop offset="50%" stop-color="#22a850"/><stop offset="100%" stop-color="#106b28"/></linearGradient><radialGradient id="gsh" cx="35%" cy="25%"><stop offset="0%" stop-color="rgba(255,255,255,0.5)"/><stop offset="60%" stop-color="rgba(255,255,255,0)"/></radialGradient></defs><ellipse cx="60" cy="62" rx="52" ry="55" fill="#0a4d1a" opacity="0.7"/><ellipse cx="60" cy="58" rx="52" ry="55" fill="url(#gg)" stroke="#a8ffbc" stroke-width="3"/><ellipse cx="60" cy="58" rx="52" ry="55" fill="url(#gsh)"/><path d="M 60 32 L 60 82 M 60 32 L 42 50 M 60 32 L 78 50" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round"/></svg>
  <svg id="brakeSvgBtn" viewBox="0 0 100 100"><defs><linearGradient id="bg1" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f87171"/><stop offset="50%" stop-color="#c72424"/><stop offset="100%" stop-color="#7a0e0e"/></linearGradient><radialGradient id="bsh" cx="35%" cy="25%"><stop offset="0%" stop-color="rgba(255,255,255,0.5)"/><stop offset="60%" stop-color="rgba(255,255,255,0)"/></radialGradient></defs><ellipse cx="50" cy="52" rx="42" ry="45" fill="#4a0508" opacity="0.7"/><ellipse cx="50" cy="48" rx="42" ry="45" fill="url(#bg1)" stroke="#ffc0c0" stroke-width="3"/><ellipse cx="50" cy="48" rx="42" ry="45" fill="url(#bsh)"/><circle cx="50" cy="48" r="22" fill="none" stroke="#fff" stroke-width="5"/><line x1="34" y1="32" x2="66" y2="64" stroke="#fff" stroke-width="6" stroke-linecap="round"/></svg>
  <svg id="reverseBtn" viewBox="0 0 100 100"><defs><linearGradient id="rg1" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#fbbf24"/><stop offset="50%" stop-color="#d97706"/><stop offset="100%" stop-color="#78350f"/></linearGradient><radialGradient id="rsh" cx="35%" cy="25%"><stop offset="0%" stop-color="rgba(255,255,255,0.5)"/><stop offset="60%" stop-color="rgba(255,255,255,0)"/></radialGradient></defs><ellipse cx="50" cy="52" rx="42" ry="45" fill="#5c3305" opacity="0.7"/><ellipse cx="50" cy="48" rx="42" ry="45" fill="url(#rg1)" stroke="#ffd88a" stroke-width="3"/><ellipse cx="50" cy="48" rx="42" ry="45" fill="url(#rsh)"/><text x="50" y="66" text-anchor="middle" font-family="Arial Black" font-size="44" font-weight="900" fill="#fff">R</text></svg>
</div>

<div id="heliControls">
  <div class="heli-btn" id="heli-left">◀</div>
  <div class="heli-btn" id="heli-right">▶</div>
  <div class="heli-btn" id="heli-fwd">▲</div>
  <div class="heli-btn" id="heli-back">▼</div>
  <div class="heli-btn" id="heli-up">⬆</div>
  <div class="heli-btn" id="heli-down">⬇</div>
  <div class="heli-btn" id="heli-engine">استارت</div>
</div>

<div id="carHUD" style="display:none;">
  <div id="gearIndicator" class="neutral">N</div>
  <div><span id="carSpeed">0</span> <span id="carSpeedLabel">km/h</span></div>
  <div id="speedBar"><div id="speedBarFill"></div></div>
</div>

<div id="heliHUD">
  <div class="heli-hud-item"><div class="heli-hud-value" id="heliSpeed">0</div><div class="heli-hud-label">km/h</div></div>
  <div class="heli-hud-divider"></div>
  <div class="heli-hud-item"><div class="heli-hud-value" id="heliAltitude">0</div><div class="heli-hud-label">m</div></div>

</div>

<div id="enterCarBtn">🚗 سوار شدن</div>
<div id="enterHeliBtn">🚁 ورود به هلیکوپتر</div>
<div id="exitCarBtn">🚪 پیاده شدن</div>
<div id="heliExitBtn">🚪 خروج از هلیکوپتر</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

/* ============================================================
   URLs
============================================================ */
const BUILDING_URL = "https://raw.githubusercontent.com/bertt/googlemaps3d/main/3dtiles/building.glb";
const SOLDIER_URL  = "https://raw.githubusercontent.com/google/model-viewer/master/packages/shared-assets/models/soldier.glb";
const FERRARI_URL  = "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/models/gltf/ferrari.glb";
const SOUND_URL    = "https://sedatoseda.com/wp-content/uploads/1630988550_1fd32026963b48b.mp3";
const HELI_URL     = "https://raw.githubusercontent.com/s0379265-netizen/Pmkatba_____po/main/bell_huey_helicopter.glb";
// ⭐ صدای هلیکوپتر از GitHub با jsDelivr (CORS فعال)
const HELI_SOUND_URL = "https://cdn.jsdelivr.net/gh/s0379265-netizen/Fagah@main/helicopter_sound.mp3";

/* ============================================================
   SAVE SYSTEM
============================================================ */
const SaveSystem = {
  KEY: "tpspro_save_v5",
  data: {
    charPos: { x: 0, y: 0, z: 0 }, charYaw: 0,
    carPos: { x: -15, y: 0, z: -15 }, carRotation: 0,
    heliPos: { x: 15, y: 1.5, z: -15 }, heliRotation: 0,
    mode: "walking", savedAt: 0
  },
  enabled: true,
  init(){
    try { const t = "__t__" + Date.now(); localStorage.setItem(t, "1"); localStorage.removeItem(t); this.enabled = true; }
    catch(e){ this.enabled = false; }
    this.load();
  },
  load(){
    if(!this.enabled) return;
    try { const s = localStorage.getItem(this.KEY); if(s) Object.assign(this.data, JSON.parse(s)); } catch(e){}
  },
  save(){ if(!this.enabled) return; try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch(e){} }
};
SaveSystem.init();

/* ============================================================
   تنظیمات
============================================================ */
const CAR_MODEL_YAW_OFFSET = Math.PI;
const WORLD_LIMIT = 240;
const CAM_DRIVE = { distance: 7.0, height: 2.2, lookHeight: 1.0 };
const CAM_WALK  = { distance: 4.5, height: 1.6, lookHeight: 1.2 };
const CAM_HELI  = { distance: 11.0, height: 4.0, lookHeight: 1.5 };
const CAM_SENSITIVITY_X = 0.0042;
const CAM_SENSITIVITY_Y = 0.0032;
const CAM_PITCH_MIN = -0.55, CAM_PITCH_MAX = 0.75;
const CAM_AUTO_RETURN_DELAY = 2500;
const CAM_AUTO_RETURN_SPEED = 3.5;
const CHAR_RADIUS = 0.45;

/* ============================================================
   LOADING
============================================================ */
const loadingBar = document.getElementById("loadingBar");
const loadingDiv = document.getElementById("loading");
let currentProgress = 0, targetProgress = 8, isReady = false;

function updateBar(){
  if(currentProgress < targetProgress){
    currentProgress += (targetProgress - currentProgress) * 0.15 + 0.3;
    if(currentProgress > targetProgress) currentProgress = targetProgress;
    loadingBar.style.width = currentProgress + "%";
  }
  if(isReady && currentProgress >= 99.5){
    setTimeout(() => { loadingDiv.classList.add("hidden"); }, 500);
    isReady = false;
  }
  requestAnimationFrame(updateBar);
}
updateBar();

/* ============================================================
   Car Audio Engine
============================================================ */
const AudioEngine = {
  ctx: null, source: null, gainNode: null, buffer: null,
  loaded: false, isMuted: false,
  baseRPM: 800, maxRPM: 7000, currentRPM: 800, targetRPM: 800,
  baseVolume: 0.35, maxVolume: 0.85, isStarting: false,
  async init(){
    if(this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      const r = await fetch(SOUND_URL);
      const ab = await r.arrayBuffer();
      this.buffer = await this.ctx.decodeAudioData(ab);
      this.loaded = true;
      this.gainNode = this.ctx.createGain();
      this.gainNode.gain.value = 0;
      this.gainNode.connect(this.ctx.destination);
    } catch(e){ console.warn("Car audio:", e); }
  },
  playStartup(){
    if(!this.loaded || this.isMuted) return;
    if(this.ctx.state === "suspended") this.ctx.resume();
    this.stop();
    this.source = this.ctx.createBufferSource();
    this.source.buffer = this.buffer;
    this.source.loop = false;
    this.source.connect(this.gainNode);
    this.gainNode.gain.setValueAtTime(0.6, this.ctx.currentTime);
    this.source.start(0);
    this.isStarting = true;
    this.source.onended = () => { this.isStarting = false; this.startIdleLoop(); };
  },
  startIdleLoop(){
    if(!this.loaded || this.isMuted || !this.ctx) return;
    this.stop();
    this.source = this.ctx.createBufferSource();
    this.source.buffer = this.buffer;
    this.source.loop = true;
    this.source.loopStart = 0;
    this.source.loopEnd = 5.0;
    this.source.connect(this.gainNode);
    this.gainNode.gain.setValueAtTime(this.baseVolume, this.ctx.currentTime);
    this.source.start(0);
    this.isStarting = false;
  },
  stop(){ if(this.source){ try{this.source.stop();}catch(e){} try{this.source.disconnect();}catch(e){} this.source = null; } },
  setMuted(m){ this.isMuted = m; if(m) this.stop(); },
  update(dt, carSpeed, isGas, isReverse, isDriving){
    if(!this.loaded || this.isMuted || !this.ctx || !isDriving) return;
    const sr = Math.min(1, Math.abs(carSpeed) * 3.6 / 80);
    if(isGas) this.targetRPM = this.baseRPM + sr * (this.maxRPM - this.baseRPM) + 1500;
    else if(isReverse) this.targetRPM = this.baseRPM + sr * 2000;
    else this.targetRPM = this.baseRPM + sr * 1500;
    this.currentRPM += (this.targetRPM - this.currentRPM) * Math.min(1, dt * 4);
    if(this.source){
      const rr = (this.currentRPM - this.baseRPM) / (this.maxRPM - this.baseRPM);
      const target = 0.75 + rr * 0.85;
      const cur = this.source.playbackRate.value;
      this.source.playbackRate.setValueAtTime(cur + (target - cur) * Math.min(1, dt * 6), this.ctx.currentTime);
    }
    let tv = this.isStarting ? 0.6 : (isGas ? this.baseVolume + (this.maxVolume - this.baseVolume) * 0.9 : (isReverse ? this.baseVolume + 0.15 : this.baseVolume));
    if(this.gainNode){
      const cg = this.gainNode.gain.value;
      this.gainNode.gain.setValueAtTime(cg + (tv - cg) * Math.min(1, dt * 5), this.ctx.currentTime);
    }
  }
};

   🚁 Helicopter Audio Engine - مثل مدل‌ها دانلود می‌شه
============================================================ */
const HeliAudio = {
  ctx: null, source: null, gainNode: null, buffer: null,
  loaded: false, isPlaying: false, isMuted: false,
  targetVolume: 0, currentVolume: 0,
  loadAttempts: 0,
  
  async init(){
    if(this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      
      // ⭐ لود فایل صدا مثل بقیه asset ها
      console.log("🚁 Downloading helicopter sound...");
      const r = await fetch(HELI_SOUND_URL);
      if(!r.ok) throw new Error("HTTP " + r.status);
      const ab = await r.arrayBuffer();
      this.buffer = await this.ctx.decodeAudioData(ab);
      this.loaded = true;
      this.gainNode = this.ctx.createGain();
      this.gainNode.gain.value = 0;
      this.gainNode.connect(this.ctx.destination);
      console.log("✅ Helicopter sound loaded | Size:", (ab.byteLength/1024).toFixed(1), "KB");
    } catch(e){
      console.warn("🚁 Heli sound failed:", e.message);
      // ⭐ تلاش با URL جایگزین
      this.loadAttempts++;
      if(this.loadAttempts < 3){
        await this.tryFallback();
      }
    }
  },
  
  async tryFallback(){
    const fallbacks = [
      "https://cdn.statically.io/gh/s0379265-netizen/Fagah/main/helicopter_sound.mp3",
      "https://rawcdn.githack.com/s0379265-netizen/Fagah/main/helicopter_sound.mp3",
      "https://raw.githubusercontent.com/s0379265-netizen/Fagah/main/helicopter_sound.mp3"
    ];
    const url = fallbacks[this.loadAttempts - 1];
    if(!url) return;
    try {
      console.log("🚁 Trying fallback:", url);
      const r = await fetch(url);
      if(!r.ok) throw new Error("HTTP " + r.status);
      const ab = await r.arrayBuffer();
      this.buffer = await this.ctx.decodeAudioData(ab);
      this.loaded = true;
      if(!this.gainNode){
        this.gainNode = this.ctx.createGain();
        this.gainNode.gain.value = 0;
        this.gainNode.connect(this.ctx.destination);
      }
      console.log("✅ Heli sound loaded from fallback");
    } catch(e){
      console.warn("🚁 Fallback failed:", e.message);
      this.loadAttempts++;
      if(this.loadAttempts < 3) await this.tryFallback();
    }
  },
  
  start(){
    if(!this.loaded || this.isMuted) return;
    if(this.ctx.state === "suspended") this.ctx.resume();
    if(this.isPlaying) return;
    
    this.source = this.ctx.createBufferSource();
    this.source.buffer = this.buffer;
    this.source.loop = true;
    this.source.connect(this.gainNode);
    this.source.start(0);
    this.isPlaying = true;
  },
  
  stop(){
    if(this.source && this.isPlaying){
      try { this.source.stop(); } catch(e){}
      try { this.source.disconnect(); } catch(e){}
      this.source = null;
      this.isPlaying = false;
      if(this.gainNode){
        this.gainNode.gain.cancelScheduledValues(this.ctx.currentTime);
        this.gainNode.gain.setValueAtTime(0, this.ctx.currentTime);
      }
    }
  },
  
  setMuted(m){ this.isMuted = m; if(m) this.stop(); },
  
  update(dt, engineState, engineRPM){
    if(!this.loaded || !this.ctx || !this.gainNode) return;
    
    const shouldPlay = (engineState === "STARTING" || engineState === "RUNNING") && !this.isMuted;
    
    if(shouldPlay && !this.isPlaying){ this.start(); }
    else if(!shouldPlay && this.isPlaying){ this.stop(); }
    
    if(this.isPlaying && this.gainNode){
      this.targetVolume = 0.18 + engineRPM * 0.55;
      this.currentVolume += (this.targetVolume - this.currentVolume) * Math.min(1, dt * 4);
      this.gainNode.gain.setValueAtTime(this.currentVolume, this.ctx.currentTime);
      
      if(this.source){
        const targetRate = 0.85 + engineRPM * 0.45;
        const cur = this.source.playbackRate.value;
        this.source.playbackRate.setValueAtTime(cur + (targetRate - cur) * Math.min(1, dt * 3), this.ctx.currentTime);
      }
    }
  }
};

function placeOnGround(model, targetHeight, targetX, targetZ, rotationY){
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  if(targetHeight && size.y > 0) model.scale.setScalar(targetHeight / size.y);
  if(rotationY) model.rotation.y = rotationY;
  model.updateMatrixWorld(true);
  const box2 = new THREE.Box3().setFromObject(model);
  const center = box2.getCenter(new THREE.Vector3());
  model.position.set(targetX - center.x, -box2.min.y, targetZ - center.z);
}

/* Collision */
const colliders = [];
function addBoxCollider(box, name){ colliders.push({ box: box.clone(), name }); }
function checkSphereCollision(x, z, r, box){
  const cx = Math.max(box.min.x, Math.min(x, box.max.x));
  const cz = Math.max(box.min.z, Math.min(z, box.max.z));
  const dx = x - cx, dz = z - cz;
  return (dx*dx + dz*dz) < r*r;
}
function resolveCharacterMove(oldX, oldZ, newX, newZ, radius){
  let fx = newX, fz = newZ;
  let collision = false;
  for(const c of colliders){
    if(checkSphereCollision(newX, newZ, radius, c.box)){ collision = true; break; }
  }
  if(collision){
    let xOK = true, zOK = true;
    for(const c of colliders){
      if(checkSphereCollision(newX, oldZ, radius, c.box)) xOK = false;
      if(checkSphereCollision(oldX, newZ, radius, c.box)) zOK = false;
    }
    if(xOK && !zOK){ fx = newX; fz = oldZ; }
    else if(!xOK && zOK){ fx = oldX; fz = newZ; }
    else if(!xOK && !zOK){ fx = oldX; fz = oldZ; }
    else {
      if(Math.abs(newX-oldX) < Math.abs(newZ-oldZ)){ fx = newX; fz = oldZ; }
      else { fx = oldX; fz = newZ; }
    }
  }
  return { x: fx, z: fz, collision };
}
function checkCarCollision(x, z, yaw, hw, hl){
  const cos = Math.cos(yaw), sin = Math.sin(yaw);
  const corners = [{x:hw,z:hl},{x:hw,z:-hl},{x:-hw,z:hl},{x:-hw,z:-hl}];
  for(const c of corners){
    const wx = x + c.x*cos - c.z*sin;
    const wz = z + c.x*sin + c.z*cos;
    for(const col of colliders){
      if(wx > col.box.min.x && wx < col.box.max.x &&
         wz > col.box.min.z && wz < col.box.max.z) return true;
    }
  }
  return false;
}

loader.load(FERRARI_URL, (gltf) => {
  try {
    carModel = gltf.scene;
    prep(carModel, true);

    const wg = { fl: null, fr: null, rl: null, rr: null };
    carModel.traverse((node) => {
      const n = (node.name || "").toLowerCase();
      if(n === "wheel_fl") wg.fl = node;
      else if(n === "wheel_fr") wg.fr = node;
      else if(n === "wheel_rl") wg.rl = node;
      else if(n === "wheel_rr") wg.rr = node;
    });

    if(!wg.fl || !wg.fr || !wg.rl || !wg.rr){
      const cand = [];
      carModel.traverse(n => {
        if(n.isObject3D && n !== carModel){
          const nm = (n.name || "").toLowerCase();
          if(nm.includes("wheel") || nm.includes("tire")) cand.push(n);
        }
      });
      if(cand.length >= 4){
        carModel.updateMatrixWorld(true);
        const cb = new THREE.Box3().setFromObject(carModel);
        const cc = cb.getCenter(new THREE.Vector3());
        const wp = cand.map(w => {
          const b = new THREE.Box3().setFromObject(w);
          const c = b.getCenter(new THREE.Vector3());
          return { node: w, x: c.x - cc.x, z: c.z - cc.z };
        });
        wp.sort((a,b) => b.z - a.z);
        const front = wp.slice(0,2).sort((a,b) => a.x - b.x);
        const rear = wp.slice(2,4).sort((a,b) => a.x - b.x);
        if(!wg.fl) wg.fl = front[0]?.node;
        if(!wg.fr) wg.fr = front[1]?.node;
        if(!wg.rl) wg.rl = rear[0]?.node;
        if(!wg.rr) wg.rr = rear[1]?.node;
      }
    }

    function setupWheel(grp, key, isFront){
      if(!grp || !grp.parent) return;
      const parent = grp.parent;
      const localPos = grp.position.clone();
      const origRot = grp.rotation.clone();
      const w = new THREE.Group();
      w.position.copy(localPos);
      w.rotation.order = "YXZ";
      grp.position.set(0,0,0);
      grp.rotation.order = "YXZ";
      grp.rotation.copy(origRot);
      parent.remove(grp);
      parent.add(w);
      w.add(grp);
      carWheels[key] = { steerGroup: w, spinGroup: grp, isFront };
    }

    if(wg.fl) setupWheel(wg.fl, "fl", true);
    if(wg.fr) setupWheel(wg.fr, "fr", true);
    if(wg.rl) setupWheel(wg.rl, "rl", false);
    if(wg.rr) setupWheel(wg.rr, "rr", false);

    const box = new THREE.Box3().setFromObject(carModel);
    const size = box.getSize(new THREE.Vector3());
    carHalfWidth = size.x * 0.32;
    carHalfLength = size.z * 0.38;
    
    const gy = -box.min.y;
    carModel.position.set(carState.position.x, gy, carState.position.z);
    carState.position.y = gy;
    carModel.rotation.y = carState.rotation + CAR_MODEL_YAW_OFFSET;
    scene.add(carModel);

        }
      });
    }

      heliModel.traverse(o => {

      });

    if(!heliBackRotor){

    const targetLength = 12;

    heliModel.updateMatrixWorld(true);
    const box2 = new THREE.Box3().setFromObject(heliModel);
    
    if(heliBellHuey){

/* Animation */
function setAction(name){
  const nx = actions[name];
  if(!nx || nx === currentAction) return;
  if(currentAction) currentAction.fadeOut(0.2);
  nx.reset().fadeIn(0.2).play();
  currentAction = nx;
}

/* Joystick */
const joyZoneLeft = document.getElementById("joyZoneLeft");
const joyBaseFloat = document.getElementById("joyBaseFloat");
const joyKnobFloat = document.getElementById("joyKnobFloat");
const joy = { active: false, pointerId: null, originX: 0, originY: 0, maxRadius: 55, moveX: 0, moveY: 0 };

joyZoneLeft.addEventListener("pointerdown", (e) => {
  if(mode !== "walking" || joy.active) return;
  e.preventDefault();
  joyZoneLeft.setPointerCapture(e.pointerId);
  joy.active = true; joy.pointerId = e.pointerId;
  joy.originX = e.clientX; joy.originY = e.clientY;
  joy.moveX = 0; joy.moveY = 0;
  const r = joyZoneLeft.getBoundingClientRect();
  const lx = e.clientX - r.left, ly = e.clientY - r.top;
  joyBaseFloat.style.left = lx + "px"; joyBaseFloat.style.top = ly + "px";
  joyKnobFloat.style.left = lx + "px"; joyKnobFloat.style.top = ly + "px";
  joyBaseFloat.classList.add("active");
  joyKnobFloat.classList.add("active");
}, { passive: false });

joyZoneLeft.addEventListener("pointermove", (e) => {
  if(!joy.active || e.pointerId !== joy.pointerId) return;
  e.preventDefault();
  let dx = e.clientX - joy.originX, dy = e.clientY - joy.originY;
  const d = Math.sqrt(dx*dx + dy*dy);
  if(d > joy.maxRadius){ const s = joy.maxRadius/d; dx *= s; dy *= s; }
  joy.moveX = dx / joy.maxRadius;
  joy.moveY = -dy / joy.maxRadius;
  const r = joyZoneLeft.getBoundingClientRect();
  joyKnobFloat.style.left = (joy.originX - r.left + dx) + "px";
  joyKnobFloat.style.top = (joy.originY - r.top + dy) + "px";
}, { passive: false });

function releaseJoy(e){
  if(!joy.active || e.pointerId !== joy.pointerId) return;
  joy.active = false; joy.pointerId = null;
  joy.moveX = 0; joy.moveY = 0;
  joyBaseFloat.classList.remove("active");
  joyKnobFloat.classList.remove("active");
}
joyZoneLeft.addEventListener("pointerup", releaseJoy);
joyZoneLeft.addEventListener("pointercancel", releaseJoy);
joyZoneLeft.addEventListener("lostpointercapture", releaseJoy);

/* Character Walk */
const tmpDir = new THREE.Vector3();
const WALK_SPEED = 3.5, RUN_SPEED = 5.5;

function updateCharacterWalk(dt){
  if(!character || !character.visible) return;
  let inputX = joy.moveX, inputY = joy.moveY;
  if(keys.forward) inputY = 1;
  if(keys.back) inputY = -1;
  if(keys.left) inputX = -1;
  if(keys.right) inputX = 1;
  
  const camYaw = cameraBaseYaw + cameraUserYaw;
  const cFX = Math.sin(camYaw), cFZ = Math.cos(camYaw);
  const cRX = Math.sin(camYaw + Math.PI/2), cRZ = Math.cos(camYaw + Math.PI/2);
  tmpDir.set(cFX*inputY + cRX*inputX, 0, cFZ*inputY + cRZ*inputX);
  
  const mag = Math.min(1, Math.sqrt(inputX*inputX + inputY*inputY));
  const moving = mag > 0.1;
  
  if(moving && tmpDir.lengthSq() > 0.0001){
    tmpDir.normalize();
    const isRun = mag > 0.85;
    const sp = (isRun ? RUN_SPEED : WALK_SPEED) * mag;
    const ox = character.position.x, oz = character.position.z;
    let nx = ox + tmpDir.x * sp * dt;
    let nz = oz + tmpDir.z * sp * dt;
    nx = Math.max(-WORLD_LIMIT, Math.min(WORLD_LIMIT, nx));
    nz = Math.max(-WORLD_LIMIT, Math.min(WORLD_LIMIT, nz));
    const res = resolveCharacterMove(ox, oz, nx, nz, CHAR_RADIUS);
    character.position.x = res.x;
    character.position.z = res.z;
    const aDX = res.x - ox, aDZ = res.z - oz;
    if(aDX*aDX + aDZ*aDZ > 0.0001){
      const ta = Math.atan2(aDX, aDZ);
      let diff = ta - charYaw;
      while(diff > Math.PI) diff -= Math.PI*2;
      while(diff < -Math.PI) diff += Math.PI*2;
      charYaw += diff * Math.min(1, 10 * dt);
      character.rotation.y = charYaw + MODEL_YAW_OFFSET;
    }
    if(actions.run && isRun) setAction("run");
    else if(actions.walk) setAction("walk");
    else if(actions.idle) setAction("idle");
  } else {
    if(actions.idle) setAction("idle");
  }
}

/* Car Drive */
let wasMoving = false;

function updateCarDrive(dt){
  if(!carModel) return;
  let st = 0;
  if(carKeys.left) st = carState.maxSteerAngle;
  if(carKeys.right) st = -carState.maxSteerAngle;
  if(st !== 0) carState.steerAngle += (st - carState.steerAngle) * carState.steerSpeed * dt;
  else carState.steerAngle += (0 - carState.steerAngle) * carState.steerReturn * dt;

  if(carKeys.brake){
    if(carState.speed > 0) carState.speed = Math.max(0, carState.speed - carState.brakingForce * dt);
    else if(carState.speed < 0) carState.speed = Math.min(0, carState.speed + carState.brakingForce * dt);
  } else if(carKeys.forward){
    carState.speed = Math.min(carState.maxForwardSpeed, carState.speed + carState.acceleration * dt);
  } else if(carKeys.reverse){
    if(carState.speed > 0) carState.speed = Math.max(0, carState.speed - carState.brakingForce * dt);
    else carState.speed = Math.max(-carState.maxReverseSpeed, carState.speed - carState.reverseAcceleration * dt);
  } else {
    if(Math.abs(carState.speed) > 0.05){
      const f = carState.friction * dt;
      if(carState.speed > 0) carState.speed = Math.max(0, carState.speed - f);
      else carState.speed = Math.min(0, carState.speed + f);
    } else carState.speed = 0;
  }

  let newRot = carState.rotation;
  if(Math.abs(carState.speed) > 0.1){
    const spN = Math.abs(carState.speed) / carState.maxForwardSpeed;
    const sf = Math.min(1, 0.4 + (1 - spN) * 0.8);
    const dir = carState.speed >= 0 ? 1 : -1;
    newRot += carState.steerAngle * dir * sf * 1.8 * dt;
  }

  const fX = Math.sin(newRot), fZ = Math.cos(newRot);
  let nX = carState.position.x + fX * carState.speed * dt;
  let nZ = carState.position.z + fZ * carState.speed * dt;
  nX = Math.max(-WORLD_LIMIT, Math.min(WORLD_LIMIT, nX));
  nZ = Math.max(-WORLD_LIMIT, Math.min(WORLD_LIMIT, nZ));

  const collide = checkCarCollision(nX, nZ, newRot, carHalfWidth, carHalfLength);
  if(!collide){
    carState.rotation = newRot;
    carState.position.x = nX;
    carState.position.z = nZ;
  } else {
    const xC = checkCarCollision(nX, carState.position.z, newRot, carHalfWidth, carHalfLength);
    const zC = checkCarCollision(carState.position.x, nZ, newRot, carHalfWidth, carHalfLength);
    if(!xC && zC){ carState.rotation = newRot; carState.position.x = nX; carState.speed *= 0.6; }
    else if(xC && !zC){ carState.rotation = newRot; carState.position.z = nZ; carState.speed *= 0.6; }
    else { carState.speed *= 0.2; if(Math.abs(carState.speed) < 0.3) carState.speed = 0; }
  }

  carModel.position.copy(carState.position);
  carModel.rotation.y = carState.rotation + CAR_MODEL_YAW_OFFSET;

  carState.wheelRotation += carState.speed * dt * 2.5;
  const wr = carState.wheelRotation;
  if(carWheels.fl.steerGroup) carWheels.fl.steerGroup.rotation.y = carState.steerAngle;
  if(carWheels.fr.steerGroup) carWheels.fr.steerGroup.rotation.y = carState.steerAngle;
  if(carWheels.fl.spinGroup) carWheels.fl.spinGroup.rotation.x = wr;
  if(carWheels.fr.spinGroup) carWheels.fr.spinGroup.rotation.x = wr;
  if(carWheels.rl.spinGroup) carWheels.rl.spinGroup.rotation.x = wr;
  if(carWheels.rr.spinGroup) carWheels.rr.spinGroup.rotation.x = wr;

  const isMove = Math.abs(carState.speed) > 0.5;
  AudioEngine.update(dt, carState.speed, carKeys.forward, carKeys.reverse, mode === "driving");
  if(isMove && !wasMoving) onCarMoving();
  else if(!isMove && wasMoving) onCarStopped();
  wasMoving = isMove;

  const kmh = Math.abs(carState.speed * 3.6);
  carSpeedEl.textContent = kmh.toFixed(0);
  speedBarFill.style.width = Math.min(100, (kmh / (carState.maxForwardSpeed * 3.6)) * 100) + "%";
  if(carState.speed > 0.3){ gearIndicator.textContent = "D"; gearIndicator.className = ""; }
  else if(carState.speed < -0.3){ gearIndicator.textContent = "R"; gearIndicator.className = "reverse"; }
  else { gearIndicator.textContent = "N"; gearIndicator.className = "neutral"; }
}
function onCarMoving(){ if(AudioEngine.gainNode && AudioEngine.source === null) AudioEngine.startIdleLoop(); }
function onCarStopped(){ if(AudioEngine.gainNode && AudioEngine.source === null) AudioEngine.startIdleLoop(); }

/* 🚁 Helicopter Update - با تنظیمات جدید */
function updateHelicopter(dt){
  if(!heliModel) return;
  
  // Engine state machine
  if(heliState.engineState === "STARTING"){
    heliState.engineRPM += (1 - heliState.engineRPM) * Math.min(1, dt * 0.5);  // ⭐ سریع‌تر
    if(heliState.engineRPM > 0.95){
      heliState.engineState = "RUNNING";
      heliEngineBtn.classList.add("running");
      console.log("🚁 ENGINE RUNNING");
    }
  } else if(heliState.engineState === "STOPPING"){
    heliState.engineRPM += (0 - heliState.engineRPM) * Math.min(1, dt * 0.6);
    if(heliState.engineRPM < 0.02){
      heliState.engineRPM = 0;
      heliState.engineState = "OFF";
      heliEngineBtn.classList.remove("running");
      console.log("🚁 ENGINE OFF");
    }
  } else if(heliState.engineState === "RUNNING"){
    heliState.engineRPM += (1 - heliState.engineRPM) * Math.min(1, dt * 0.6);
  } else {
    heliState.engineRPM += (0 - heliState.engineRPM) * Math.min(1, dt * 2);
  }
  
  // Rotor speed
  heliState.targetRotorSpeed = heliState.engineRPM;
  heliState.rotorSpeed += (heliState.targetRotorSpeed - heliState.rotorSpeed) * Math.min(1, dt * 0.9);
  
  // ⭐⭐ Rotor rotation - سریع‌تر مثل COD
  const topRotorSpeed = heliState.rotorSpeed * 55;   // ⭐ از 25 به 55
  const backRotorSpeed = heliState.rotorSpeed * 90;  // ⭐ از 45 به 90
  
  if(heliTopRotor){
    heliState.rotorAngleTop += topRotorSpeed * dt;
    heliTopRotor.rotation.y = heliState.rotorAngleTop;
  }
  if(heliBackRotor){
    heliState.rotorAngleBack += backRotorSpeed * dt;
    heliBackRotor.rotation.x = heliState.rotorAngleBack;
  }
  
  // ⭐⭐ Vibration - خیلی کمتر
  if(heliState.rotorSpeed > 0.05 && heliBellHuey){
    heliState.vibrationTime += dt * 30;
    const vibAmount = heliState.rotorSpeed * 0.007;  // ⭐ از 0.02 به 0.007
    heliBellHuey.position.x = Math.sin(heliState.vibrationTime * 1.3) * vibAmount;
    heliBellHuey.position.z = Math.cos(heliState.vibrationTime * 1.7) * vibAmount;
    heliBellHuey.position.y = heliBodyInitialY + Math.sin(heliState.vibrationTime * 2.3) * vibAmount * 0.5;
  } else if(heliBellHuey){
    heliBellHuey.position.x *= 0.9;
    heliBellHuey.position.z *= 0.9;
    heliBellHuey.position.y += (heliBodyInitialY - heliBellHuey.position.y) * 0.1;
  }
  
  // ⭐ صدا
  HeliAudio.update(dt, heliState.engineState, heliState.engineRPM);
  
  // Flight
  const engineReady = heliState.engineRPM > 0.6;
  
  if(mode === "flying"){
    let targetForwardSpeed = 0;
    if(engineReady){
      if(heliKeys.forward) targetForwardSpeed = 20;
      else if(heliKeys.back) targetForwardSpeed = -8;
    }
    heliState.targetSpeed = targetForwardSpeed;
    heliState.speed += (heliState.targetSpeed - heliState.speed) * Math.min(1, dt * 1.5);
    
    // ⭐⭐ Vertical speed - سریع‌تر
    let targetVert = 0;
    if(engineReady){
      if(heliKeys.up) targetVert = 12;         // ⭐ از 8 به 12
      else if(heliKeys.down) targetVert = -18; // ⭐ از -6 به -18
      else {
        heliState.hoverPhase += dt * 1.2;
        targetVert = Math.sin(heliState.hoverPhase) * 0.25;
      }
    } else {
      if(heliState.position.y > heliState.restAltitude) targetVert = -3;
      else targetVert = 0;
    }
    heliState.targetVerticalSpeed = targetVert;
    // ⭐⭐ پاسخ سریع‌تر - از dt*2 به dt*5
    heliState.verticalSpeed += (heliState.targetVerticalSpeed - heliState.verticalSpeed) * Math.min(1, dt * 5);
    
    let targetYawRate = 0;
    if(engineReady){
      if(heliKeys.left) targetYawRate = 1.2;
      else if(heliKeys.right) targetYawRate = -1.2;
    }
    heliState.yaw += targetYawRate * dt;
    
    const forwardX = Math.sin(heliState.yaw);
    const forwardZ = Math.cos(heliState.yaw);
    
    let newX = heliState.position.x + forwardX * heliState.speed * dt;
    let newZ = heliState.position.z + forwardZ * heliState.speed * dt;
    newX = Math.max(-WORLD_LIMIT, Math.min(WORLD_LIMIT, newX));
    newZ = Math.max(-WORLD_LIMIT, Math.min(WORLD_LIMIT, newZ));
    
    let newY = heliState.position.y + heliState.verticalSpeed * dt;
    const minY = heliState.restAltitude;
    if(newY < minY){ newY = minY; heliState.verticalSpeed = 0; }
    if(newY > heliState.maxAltitude){ newY = heliState.maxAltitude; heliState.verticalSpeed = Math.min(0, heliState.verticalSpeed); }
    
    heliState.position.set(newX, newY, newZ);
    
    heliState.targetPitch = -heliState.speed * 0.015;
    heliState.pitch += (heliState.targetPitch - heliState.pitch) * Math.min(1, dt * 3);
    
    heliState.targetRoll = -targetYawRate * 0.35;
    heliState.roll += (heliState.targetRoll - heliState.roll) * Math.min(1, dt * 3);
    
    heliModel.position.copy(heliState.position);
    heliModel.rotation.order = "YXZ";
    heliModel.rotation.y = heliState.yaw;
    heliModel.rotation.x = heliState.pitch;
    heliModel.rotation.z = heliState.roll;
  } else {
    heliState.speed *= 0.95;
    heliState.verticalSpeed *= 0.95;
    heliState.pitch *= 0.9;
    heliState.roll *= 0.9;
    
    if(heliState.position.y > heliState.restAltitude){
      heliState.position.y -= 3 * dt;  // ⭐ سریع‌تر پایین بیاد
      if(heliState.position.y < heliState.restAltitude) heliState.position.y = heliState.restAltitude;
    }
    
    heliModel.position.copy(heliState.position);
    heliModel.rotation.order = "YXZ";
    heliModel.rotation.y = heliState.yaw;
    heliModel.rotation.x = heliState.pitch;
    heliModel.rotation.z = heliState.roll;
  }
  
  // HUD
  if(mode === "flying"){
    heliSpeedEl.textContent = Math.abs(heliState.speed * 3.6).toFixed(0);
    heliAltitudeEl.textContent = (heliState.position.y - heliState.restAltitude).toFixed(1);
    heliRPMEl.textContent = (heliState.engineRPM * 100).toFixed(0);
    let st = "OFF";
    if(heliState.engineState === "STARTING") st = "STARTING";
    else if(heliState.engineState === "RUNNING") st = "RUNNING";
    else if(heliState.engineState === "STOPPING") st = "STOPPING";
    heliEngineStateEl.textContent = st;
  }
}

/* Proximity */
function checkEnterProximity(){
  if(mode !== "walking" || !character){
    enterCarBtn.classList.remove("show");
    enterHeliBtn.classList.remove("show");
    return;
  }
  if(carModel){
    const dx = character.position.x - carState.position.x;
    const dz = character.position.z - carState.position.z;
    if(Math.sqrt(dx*dx + dz*dz) < ENTER_DISTANCE) enterCarBtn.classList.add("show");
    else enterCarBtn.classList.remove("show");
  }
  if(heliModel){
    const dx = character.position.x - heliState.position.x;
    const dz = character.position.z - heliState.position.z;
    if(Math.sqrt(dx*dx + dz*dz) < ENTER_HELI_DISTANCE) enterHeliBtn.classList.add("show");
    else enterHeliBtn.classList.remove("show");
  }
}

/* Camera */
const cameraState = {
  smoothTarget: new THREE.Vector3(0, 1, 0),
  transitioning: false,
  transitionProgress: 1
};
const currentCamParams = {
  distance: CAM_WALK.distance,
  height: CAM_WALK.height,
  lookHeight: CAM_WALK.lookHeight
};

function dampAngle(c, t, l, dt){
  let d = t - c;
  while(d > Math.PI) d -= Math.PI * 2;
  while(d < -Math.PI) d += Math.PI * 2;
  return c + d * (1 - Math.exp(-l * dt));
}

const _camDesired = new THREE.Vector3();
const _lookTarget = new THREE.Vector3();

function updateCamera(dt){
  let tp = null, ry = 0, tc = null;
  if(mode === "driving" && carModel){ tp = carState.position; ry = carState.rotation; tc = CAM_DRIVE; }
  else if(mode === "flying" && heliModel){ tp = heliState.position; ry = heliState.yaw; tc = CAM_HELI; }
  else if(character){ tp = character.position; ry = charYaw; tc = CAM_WALK; }
  else return;

  const yl = (mode === "flying") ? 6.0 : ((mode === "driving") ? 8.0 : 5.0);
  cameraBaseYaw = dampAngle(cameraBaseYaw, ry, yl, dt);

  if(cameraState.transitioning){
    cameraState.transitionProgress = Math.min(1, cameraState.transitionProgress + dt * 1.5);
    const t = cameraState.transitionProgress;
    const s = t * t * (3 - 2 * t);
    currentCamParams.distance = THREE.MathUtils.lerp(currentCamParams.distance, tc.distance, s);
    currentCamParams.height = THREE.MathUtils.lerp(currentCamParams.height, tc.height, s);
    currentCamParams.lookHeight = THREE.MathUtils.lerp(currentCamParams.lookHeight, tc.lookHeight, s);
    if(t >= 1) cameraState.transitioning = false;
  } else {
    currentCamParams.distance += (tc.distance - currentCamParams.distance) * Math.min(1, dt * 4);
    currentCamParams.height += (tc.height - currentCamParams.height) * Math.min(1, dt * 4);
    currentCamParams.lookHeight += (tc.lookHeight - currentCamParams.lookHeight) * Math.min(1, dt * 4);
  }

  if(camAutoReturn.active && !camTouch.active){
    cameraUserYaw = dampAngle(cameraUserYaw, 0, CAM_AUTO_RETURN_SPEED, dt);
    cameraUserPitch += (0 - cameraUserPitch) * (1 - Math.exp(-CAM_AUTO_RETURN_SPEED * dt));
  }

  const fy = cameraBaseYaw + cameraUserYaw;
  const p = cameraUserPitch;
  const bX = -Math.sin(fy), bZ = -Math.cos(fy);
  const pC = Math.cos(p), pS = Math.sin(p);

  _camDesired.set(
    tp.x + bX * currentCamParams.distance * pC,
    tp.y + currentCamParams.height + pS * currentCamParams.distance,
    tp.z + bZ * currentCamParams.distance * pC
  );
  if(_camDesired.y < 0.6) _camDesired.y = 0.6;

  const pl = (mode === "flying") ? 6 : ((mode === "driving") ? 10 : 8);
  camera.position.lerp(_camDesired, 1 - Math.exp(-pl * dt));

  _lookTarget.set(tp.x, tp.y + currentCamParams.lookHeight, tp.z);
  cameraState.smoothTarget.lerp(_lookTarget, 1 - Math.exp(-14 * dt));
  camera.lookAt(cameraState.smoothTarget);
}

/* Auto-Save */
let saveTimer = 0;
function doAutoSave(dt){
  saveTimer += dt;
  if(saveTimer > 2){
    saveTimer = 0;
    if(character){
      SaveSystem.data.charPos = { x: character.position.x, y: character.position.y, z: character.position.z };
      SaveSystem.data.charYaw = charYaw;
    }
    if(carModel){
      SaveSystem.data.carPos = { x: carState.position.x, y: carState.position.y, z: carState.position.z };
      SaveSystem.data.carRotation = carState.rotation;
    }
    // ⭐ ذخیره هلیکوپتر هم توی auto-save
    if(heliModel){
      SaveSystem.data.heliPos = { x: heliState.position.x, y: heliState.position.y, z: heliState.position.z };
      SaveSystem.data.heliRotation = heliState.yaw;
    }
    SaveSystem.data.mode = mode;
    SaveSystem.data.savedAt = Date.now();
    SaveSystem.save();
  }
}

/* Main Loop */
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  
  if(mixer) mixer.update(dt);
  if(heliMixer) heliMixer.update(dt);
  
  if(mode === "walking"){
    updateCharacterWalk(dt);
    checkEnterProximity();
  } else if(mode === "driving"){
    updateCarDrive(dt);
  } else if(mode === "flying"){
    updateHelicopter(dt);
  }
  
  if(mode !== "flying" && heliModel){
    updateHelicopter(dt);
  }
  
  updateCamera(dt);
  doAutoSave(dt);
  composer.render();
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloomPass.setSize(innerWidth, innerHeight);
});

window.addEventListener("beforeunload", () => {
  if(character){
    SaveSystem.data.charPos = { x: character.position.x, y: character.position.y, z: character.position.z };
    SaveSystem.data.charYaw = charYaw;
  }
  if(carModel){
    SaveSystem.data.carPos = { x: carState.position.x, y: carState.position.y, z: carState.position.z };
    SaveSystem.data.carRotation = carState.rotation;
  }
  if(heliModel){
    SaveSystem.data.heliPos = { x: heliState.position.x, y: heliState.position.y, z: heliState.position.z };
    SaveSystem.data.heliRotation = heliState.yaw;
  }
  SaveSystem.data.mode = mode;
  SaveSystem.save();
});
