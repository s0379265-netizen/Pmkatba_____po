<title>TPS Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a15;touch-action:none;font-family:Arial,Tahoma,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}

/* ============================================================
   ⭐ LOADING - مینیمال، فقط کادر زرد پایین
============================================================ */
#loading{
  position:fixed;inset:0;z-index:1000;
  background:#0a0a15;
  background-image:url('https://uploadkon.ir/uploads/a6c023_26grok-1790086009059.jpg');
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding-bottom:40px;
  transition:opacity 0.6s ease, visibility 0.6s;
}
#loading.hidden{opacity:0;visibility:hidden;pointer-events:none}

/* ⭐ کادر زرد نازک - تنها چیز روی لودینگ */
#loadingBarWrapper{
  width:75%;
  max-width:500px;
  height:6px;
  background:rgba(0,0,0,0.6);
  border-radius:3px;
  overflow:hidden;
  box-shadow:0 0 20px rgba(0,0,0,0.7);
  backdrop-filter:blur(4px);
}
#loadingBar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ffcc00 0%,#ffe066 50%,#ffcc00 100%);
  border-radius:3px;
  transition:width 0.3s ease-out;
  box-shadow:0 0 15px rgba(255,204,0,0.9), 0 0 6px rgba(255,255,255,0.5) inset;
}

/* ============================================================
   JOYSTICK + CAMERA
============================================================ */
#joyZoneLeft{position:fixed;bottom:0;left:0;width:55%;height:70%;z-index:15;touch-action:none}
#joyZoneLeft.hidden{display:none}
#joyBaseFloat{position:absolute;width:130px;height:130px;border-radius:50%;border:3px solid rgba(255,255,255,0.35);background:radial-gradient(circle, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.02) 70%);transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity 0.2s;box-shadow:0 0 30px rgba(255,255,255,0.15) inset}
#joyBaseFloat.active{opacity:1}
#joyKnobFloat{position:absolute;width:66px;height:66px;border-radius:50%;background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95), rgba(255,51,102,0.85));border:3px solid rgba(255,255,255,0.9);transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity 0.2s;box-shadow:0 6px 30px rgba(255,51,102,0.7)}
#joyKnobFloat.active{opacity:1}

#camZoneRight{position:fixed;top:0;right:0;width:50%;height:100%;z-index:14;touch-action:none}
#camZoneRight.hidden{display:none}

/* ============================================================
   CAR CONTROLS
============================================================ */
#carControls{position:fixed;inset:0;pointer-events:none;z-index:16;display:none}
#carControls.show{display:block}

.steer-svg-btn{
  position:absolute;
  bottom:25px;
  width:75px;
  height:75px;
  pointer-events:auto;
  touch-action:none;
  transition:transform 0.08s ease;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,0.6));
}
.steer-svg-btn:active,
.steer-svg-btn.active{
  transform:scale(0.9);
  filter:drop-shadow(0 0 15px rgba(79,195,247,0.9)) drop-shadow(0 4px 12px rgba(0,0,0,0.6));
}
#steer-left{left:20px}
#steer-right{left:105px}

#gasBtn{
  position:absolute;
  bottom:25px;
  right:20px;
  width:100px;
  height:100px;
  pointer-events:auto;
  touch-action:none;
  transition:transform 0.08s ease;
  filter:drop-shadow(0 6px 18px rgba(0,0,0,0.7));
}
#gasBtn:active,
#gasBtn.active{
  transform:scale(0.92) translateY(4px);
  filter:drop-shadow(0 0 25px rgba(50,220,80,1)) drop-shadow(0 6px 18px rgba(0,0,0,0.7));
}

#brakeSvgBtn{
  position:absolute;
  bottom:140px;
  right:20px;
  width:85px;
  height:85px;
  pointer-events:auto;
  touch-action:none;
  transition:transform 0.08s ease;
  filter:drop-shadow(0 5px 15px rgba(0,0,0,0.7));
}
#brakeSvgBtn:active,
#brakeSvgBtn.active{
  transform:scale(0.92) translateY(3px);
  filter:drop-shadow(0 0 25px rgba(255,68,85,1)) drop-shadow(0 5px 15px rgba(0,0,0,0.7));
}

#reverseBtn{
  position:absolute;
  bottom:245px;
  right:20px;
  width:75px;
  height:75px;
  pointer-events:auto;
  touch-action:none;
  transition:transform 0.08s ease;
  filter:drop-shadow(0 5px 15px rgba(0,0,0,0.7));
}
#reverseBtn:active,
#reverseBtn.active{
  transform:scale(0.92) translateY(3px);
  filter:drop-shadow(0 0 25px rgba(255,170,60,1)) drop-shadow(0 5px 15px rgba(0,0,0,0.7));
}

/* ============================================================
   HUD
============================================================ */
#carHUD{position:absolute;top:15px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg, rgba(15,15,25,0.92), rgba(25,25,40,0.92));backdrop-filter:blur(15px);padding:10px 22px;border-radius:16px;border:1px solid rgba(255,255,255,0.15);display:flex;align-items:center;gap:14px;color:#fff;z-index:15;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,0.4)}
#carSpeed{font-size:30px;font-weight:700;color:#ff6b3d;font-variant-numeric:tabular-nums;min-width:55px;text-align:center;text-shadow:0 0 20px rgba(255,107,61,0.5)}
#carSpeedLabel{font-size:10px;opacity:0.6;letter-spacing:1px}
#gearIndicator{font-size:17px;font-weight:700;color:#4fc3f7;padding:0 12px;border-left:1px solid rgba(255,255,255,0.12);border-right:1px solid rgba(255,255,255,0.12)}
#gearIndicator.reverse{color:#ffab40}
#gearIndicator.neutral{color:#666}
#speedBar{width:100px;height:5px;background:rgba(0,0,0,0.5);border-radius:3px;overflow:hidden}
#speedBarFill{height:100%;width:0%;background:linear-gradient(90deg,#44ff88,#ffcc44,#ff3344);border-radius:3px;transition:width 0.1s linear}

#enterCarBtn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px 36px;background:linear-gradient(135deg, rgba(255,51,102,0.95), rgba(255,107,61,0.95));border:3px solid rgba(255,255,255,0.6);border-radius:18px;color:#fff;font-size:18px;font-weight:700;display:none;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer;box-shadow:0 8px 40px rgba(255,51,102,0.7);z-index:20;animation:pulseEnter 1.8s ease-in-out infinite}
#enterCarBtn.show{display:flex}
@keyframes pulseEnter{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.06)}}

#exitCarBtn{position:absolute;top:15px;left:15px;padding:11px 20px;background:linear-gradient(135deg, rgba(220,40,40,0.9), rgba(160,20,20,0.9));border:2px solid rgba(255,255,255,0.5);border-radius:12px;color:#fff;font-size:14px;font-weight:600;display:none;pointer-events:auto;cursor:pointer;z-index:20;backdrop-filter:blur(10px)}
#exitCarBtn.show{display:block}

#hint{position:absolute;top:15px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.65);color:#fff;padding:7px 16px;border-radius:20px;font-size:11px;z-index:14;pointer-events:none;opacity:0.9;transition:opacity 0.5s}
#hint.hidden{opacity:0}

#soundToggle{position:absolute;top:15px;right:15px;width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,0.75);border:2px solid rgba(255,255,255,0.4);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer;z-index:20;backdrop-filter:blur(8px)}
#soundToggle.muted{background:linear-gradient(135deg, rgba(200,35,35,0.9), rgba(150,20,20,0.9))}
</style>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

/* ============================================================
   URLs
============================================================ */
const BUILDING_URL = "https://raw.githubusercontent.com/bertt/googlemaps3d/main/3dtiles/building.glb";
const SOLDIER_URL  = "https://raw.githubusercontent.com/google/model-viewer/master/packages/shared-assets/models/soldier.glb";
const FERRARI_URL  = "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/models/gltf/ferrari.glb";
const SOUND_URL    = "https://sedatoseda.com/wp-content/uploads/1630988550_1fd32026963b48b.mp3";

/* ============================================================
   SAVE SYSTEM
============================================================ */
const SaveSystem = {
  KEY: "tpspro_save_v2",
  data: {
    charPos: { x: 0, y: 0, z: 0 },
    charYaw: 0,
    carPos: { x: -15, y: 0, z: -15 },
    carRotation: 0,
    mode: "walking",
    savedAt: 0
  },
  enabled: true,
  init(){
    try {
      const t = "__t__" + Date.now();
      localStorage.setItem(t, "1");
      localStorage.removeItem(t);
      this.enabled = true;
    } catch(e){ this.enabled = false; }
    this.load();
  },
  load(){
    if(!this.enabled) return;
    try {
      const s = localStorage.getItem(this.KEY);
      if(s){ Object.assign(this.data, JSON.parse(s)); }
    } catch(e){}
  },
  save(){
    if(!this.enabled) return;
    try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch(e){}
  }
};
SaveSystem.init();

/* ============================================================
   تنظیمات
============================================================ */
const CAR_MODEL_YAW_OFFSET = Math.PI;
const WORLD_LIMIT = 240;
const CAM_DRIVE = { distance: 7.0, height: 2.2, lookHeight: 1.0 };
const CAM_WALK  = { distance: 4.5, height: 1.6, lookHeight: 1.2 };
const CAM_SENSITIVITY_X = 0.0042;
const CAM_SENSITIVITY_Y = 0.0032;
const CAM_PITCH_MIN = -0.55;
const CAM_PITCH_MAX = 0.75;
const CAM_AUTO_RETURN_DELAY = 2500;
const CAM_AUTO_RETURN_SPEED = 3.5;
const CHAR_RADIUS = 0.45;

/* ============================================================
   ⭐⭐ LOADING BAR - ساده، سریع، خودکار
============================================================ */
const loadingBar = document.getElementById("loadingBar");
const loadingDiv = document.getElementById("loading");

let currentProgress = 0;
let targetProgress = 10;
let isReady = false;

function updateBar(){
  if(currentProgress < targetProgress){
    currentProgress += (targetProgress - currentProgress) * 0.15 + 0.3;
    if(currentProgress > targetProgress) currentProgress = targetProgress;
    loadingBar.style.width = currentProgress + "%";
  }
  if(isReady && currentProgress >= 99.5){
    // ⭐ ورود خودکار - بدون TAP
    setTimeout(() => {
      loadingDiv.classList.add("hidden");
      console.log("🎮 وارد بازی شد");
    }, 500);
    isReady = false;
  }
  requestAnimationFrame(updateBar);
}
updateBar();

/* ============================================================
   Audio Engine
============================================================ */
const AudioEngine = {
  ctx: null, source: null, gainNode: null, buffer: null,
  loaded: false, isMuted: false,
  baseRPM: 800, maxRPM: 7000,
  currentRPM: 800, targetRPM: 800,
  baseVolume: 0.35, maxVolume: 0.85,
  isStarting: false,
  async init(){
    if(this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      const r = await fetch(SOUND_URL);
      const ab = await r.arrayBuffer();
      this.buffer = await this.ctx.decodeAudioData(ab);
      this.loaded = true;
      this.gainNode = this.ctx.createGain();
      this.gainNode.gain.value = 0;
      this.gainNode.connect(this.ctx.destination);
    } catch(e){}
  },
  playStartup(){
    if(!this.loaded || this.isMuted) return;
    if(this.ctx.state === "suspended") this.ctx.resume();
    this.stop();
    this.source = this.ctx.createBufferSource();
    this.source.buffer = this.buffer;
    this.source.loop = false;
    this.source.connect(this.gainNode);
    this.gainNode.gain.setValueAtTime(0.6, this.ctx.currentTime);
    this.source.start(0);
    this.isStarting = true;
    this.source.onended = () => { this.isStarting = false; this.startIdleLoop(); };
  },
  startIdleLoop(){
    if(!this.loaded || this.isMuted || !this.ctx) return;
    this.stop();
    this.source = this.ctx.createBufferSource();
    this.source.buffer = this.buffer;
    this.source.loop = true;
    this.source.loopStart = 0;
    this.source.loopEnd = 5.0;
    this.source.connect(this.gainNode);
    this.gainNode.gain.setValueAtTime(this.baseVolume, this.ctx.currentTime);
    this.source.start(0);
    this.isStarting = false;
  },
  stop(){ if(this.source){ try{this.source.stop();}catch(e){} try{this.source.disconnect();}catch(e){} this.source = null; } },
  setMuted(m){ this.isMuted = m; if(m) this.stop(); },
  update(dt, carSpeed, isGas, isReverse, isDriving){
    if(!this.loaded || this.isMuted || !this.ctx || !isDriving) return;
    const sr = Math.min(1, Math.abs(carSpeed) * 3.6 / 80);
    if(isGas) this.targetRPM = this.baseRPM + sr * (this.maxRPM - this.baseRPM) + 1500;
    else if(isReverse) this.targetRPM = this.baseRPM + sr * 2000;
    else this.targetRPM = this.baseRPM + sr * 1500;
    this.currentRPM += (this.targetRPM - this.currentRPM) * Math.min(1, dt * 4);
    if(this.source){
      const rr = (this.currentRPM - this.baseRPM) / (this.maxRPM - this.baseRPM);
      const target = 0.75 + rr * 0.85;
      const cur = this.source.playbackRate.value;
      this.source.playbackRate.setValueAtTime(cur + (target - cur) * Math.min(1, dt * 6), this.ctx.currentTime);
    }
    let tv = this.isStarting ? 0.6 : (isGas ? this.baseVolume + (this.maxVolume - this.baseVolume) * 0.9 : (isReverse ? this.baseVolume + 0.15 : this.baseVolume));
    if(this.gainNode){
      const cg = this.gainNode.gain.value;
      this.gainNode.gain.setValueAtTime(cg + (tv - cg) * Math.min(1, dt * 5), this.ctx.currentTime);
    }
  }
};

/* ============================================================
   Scene
============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8ec5e8);
scene.fog = new THREE.Fog(0x8ec5e8, 200, 600);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 1500);
camera.position.set(12, 6, 18);

const renderer = new THREE.WebGLRenderer({antialias: true, powerPreference: "high-performance"});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
renderer.domElement.style.touchAction = "none";

/* ============================================================
   Lights
============================================================ */
const sun = new THREE.DirectionalLight(0xfff5e6, 2.8);
sun.position.set(80, 120, 60);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 400;
sun.shadow.camera.left = sun.shadow.camera.bottom = -150;
sun.shadow.camera.right = sun.shadow.camera.top = 150;
sun.shadow.bias = -0.0003;
sun.shadow.normalBias = 0.02;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xc8d8e8, 0x4a4f3e, 1.2));
const fillLight = new THREE.DirectionalLight(0x88aaff, 0.5);
fillLight.position.set(-40, 30, -20);
scene.add(fillLight);
const rimLight = new THREE.DirectionalLight(0xffcc88, 0.7);
rimLight.position.set(0, 20, -70);
scene.add(rimLight);

/* ============================================================
   Ground & Road
============================================================ */
function makeGroundTex(){
  const c = document.createElement("canvas");
  c.width = c.height = 512;
  const x = c.getContext("2d");

   Helpers

function prep(obj, hq){
  if(!obj) return;
  obj.traverse(o=>{
    if(o.isMesh){
      o.castShadow = true;
      o.receiveShadow = true;
      if(o.material){
        o.material.needsUpdate = true;
        if("envMapIntensity" in o.material) o.material.envMapIntensity = hq ? 1.6 : 0.8;
      }
    }
  });
}

function placeOnGround(model, targetHeight, targetX, targetZ, rotationY){
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  if(targetHeight && size.y > 0) model.scale.setScalar(targetHeight / size.y);
  if(rotationY) model.rotation.y = rotationY;
  model.updateMatrixWorld(true);
  const box2 = new THREE.Box3().setFromObject(model);
  const center = box2.getCenter(new THREE.Vector3());
  model.position.set(targetX - center.x, -box2.min.y, targetZ - center.z);
}

/* ============================================================
   Collision
============================================================ */
const colliders = [];
function addBoxCollider(box, name){ colliders.push({ box: box.clone(), name }); }

function checkSphereCollision(x, z, r, box){
  const cx = Math.max(box.min.x, Math.min(x, box.max.x));
  const cz = Math.max(box.min.z, Math.min(z, box.max.z));
  const dx = x - cx, dz = z - cz;
  return (dx*dx + dz*dz) < r*r;
}

function resolveCharacterMove(oldX, oldZ, newX, newZ, radius){
  let fx = newX, fz = newZ;
  let collision = false;
  for(const c of colliders){
    if(checkSphereCollision(newX, newZ, radius, c.box)){ collision = true; break; }
  }
  if(collision){
    let xOK = true, zOK = true;
    for(const c of colliders){
      if(checkSphereCollision(newX, oldZ, radius, c.box)) xOK = false;
      if(checkSphereCollision(oldX, newZ, radius, c.box)) zOK = false;
    }
    if(xOK && !zOK){ fx = newX; fz = oldZ; }
    else if(!xOK && zOK){ fx = oldX; fz = newZ; }
    else if(!xOK && !zOK){ fx = oldX; fz = oldZ; }
    else {
      if(Math.abs(newX-oldX) < Math.abs(newZ-oldZ)){ fx = newX; fz = oldZ; }
      else { fx = oldX; fz = newZ; }
    }
  }
  return { x: fx, z: fz, collision };
}

function checkCarCollision(x, z, yaw, hw, hl){
  const cos = Math.cos(yaw), sin = Math.sin(yaw);
  const corners = [{x:hw,z:hl},{x:hw,z:-hl},{x:-hw,z:hl},{x:-hw,z:-hl}];
  for(const c of corners){
    const wx = x + c.x*cos - c.z*sin;
    const wz = z + c.x*sin + c.z*cos;
    for(const col of colliders){
      if(wx > col.box.min.x && wx < col.box.max.x &&
         wz > col.box.min.z && wz < col.box.max.z) return true;
    }
  }
  return false;
}

function pickClip(clips, kws){
  for(const kw of kws){
    const f = clips.find(c => c.name && c.name.toLowerCase().includes(kw));
    if(f) return f;
  }
  return null;
}

loader.load(SOLDIER_URL, (gltf) => {

    prep(character, true);
    character.scale.setScalar(1);
    const box = new THREE.Box3().setFromObject(character);
    const sp = SaveSystem.data.charPos;
    character.position.set(sp.x, -box.min.y, sp.z);
    character.rotation.y = charYaw + MODEL_YAW_OFFSET;
    scene.add(character);
    mixer = new THREE.AnimationMixer(character);
    const clips = gltf.animations || [];
    if(clips.length > 0){
      const idleClip = pickClip(clips, ["idle"]) || clips[0];
      const walkClip = pickClip(clips, ["walk"]) || idleClip;
      const runClip  = pickClip(clips, ["run", "sprint"]) || walkClip;
      actions.idle = mixer.clipAction(idleClip);
      actions.walk = mixer.clipAction(walkClip);
      actions.run  = mixer.clipAction(runClip);
      actions.idle.play();
      currentAction = actions.idle;

   Ferrari
============================================================ */
loader.load(FERRARI_URL, (gltf) => {
  try {
    carModel = gltf.scene;
    prep(carModel, true);

    const wg = { fl: null, fr: null, rl: null, rr: null };
    carModel.traverse((node) => {
      const n = (node.name || "").toLowerCase();
      if(n === "wheel_fl") wg.fl = node;
      else if(n === "wheel_fr") wg.fr = node;
      else if(n === "wheel_rl") wg.rl = node;
      else if(n === "wheel_rr") wg.rr = node;
    });

    if(!wg.fl || !wg.fr || !wg.rl || !wg.rr){
      const cand = [];
      carModel.traverse(n => {
        if(n.isObject3D && n !== carModel){
          const nm = (n.name || "").toLowerCase();
          if(nm.includes("wheel") || nm.includes("tire")) cand.push(n);
        }
      });
      if(cand.length >= 4){
        carModel.updateMatrixWorld(true);
        const cb = new THREE.Box3().setFromObject(carModel);
        const cc = cb.getCenter(new THREE.Vector3());
        const wp = cand.map(w => {
          const b = new THREE.Box3().setFromObject(w);
          const c = b.getCenter(new THREE.Vector3());
          return { node: w, x: c.x - cc.x, z: c.z - cc.z };
        });
        wp.sort((a,b) => b.z - a.z);
        const front = wp.slice(0,2).sort((a,b) => a.x - b.x);
        const rear = wp.slice(2,4).sort((a,b) => a.x - b.x);
        if(!wg.fl) wg.fl = front[0]?.node;
        if(!wg.fr) wg.fr = front[1]?.node;
        if(!wg.rl) wg.rl = rear[0]?.node;
        if(!wg.rr) wg.rr = rear[1]?.node;
      }
    }

    function setupWheel(grp, key, isFront){
      if(!grp || !grp.parent) return;
      const parent = grp.parent;
      const localPos = grp.position.clone();
      const origRot = grp.rotation.clone();
      const w = new THREE.Group();
      w.position.copy(localPos);
      w.rotation.order = "YXZ";
      grp.position.set(0,0,0);
      grp.rotation.order = "YXZ";
      grp.rotation.copy(origRot);
      parent.remove(grp);
      parent.add(w);
      w.add(grp);
      carWheels[key] = { steerGroup: w, spinGroup: grp, isFront };
    }

    if(wg.fl) setupWheel(wg.fl, "fl", true);
    if(wg.fr) setupWheel(wg.fr, "fr", true);
    if(wg.rl) setupWheel(wg.rl, "rl", false);
    if(wg.rr) setupWheel(wg.rr, "rr", false);

    const box = new THREE.Box3().setFromObject(carModel);
    const size = box.getSize(new THREE.Vector3());
    carHalfWidth = size.x * 0.32;
    carHalfLength = size.z * 0.38;
    
    const gy = -box.min.y;
    carModel.position.set(carState.position.x, gy, carState.position.z);
    carState.position.y = gy;
    carModel.rotation.y = carState.rotation + CAR_MODEL_YAW_OFFSET;
    scene.add(carModel);
    console.log("🚗 ferrari loaded");
  } catch(e){ console.warn(e); }
  assetDone();
}, undefined, e => assetFail(e, "ferrari"));

const joyZoneLeft = document.getElementById("joyZoneLeft");
const joyBaseFloat = document.getElementById("joyBaseFloat");
const joyKnobFloat = document.getElementById("joyKnobFloat");
const joy = { active: false, pointerId: null, originX: 0, originY: 0, maxRadius: 55, moveX: 0, moveY: 0 };

joyZoneLeft.addEventListener("pointerdown", (e) => {
  if(mode !== "walking" || joy.active) return;
  e.preventDefault();
  joyZoneLeft.setPointerCapture(e.pointerId);
  joy.active = true; joy.pointerId = e.pointerId;
  joy.originX = e.clientX; joy.originY = e.clientY;
  joy.moveX = 0; joy.moveY = 0;
  const r = joyZoneLeft.getBoundingClientRect();
  const lx = e.clientX - r.left, ly = e.clientY - r.top;
  joyBaseFloat.style.left = lx + "px"; joyBaseFloat.style.top = ly + "px";
  joyKnobFloat.style.left = lx + "px"; joyKnobFloat.style.top = ly + "px";
  joyBaseFloat.classList.add("active");
  joyKnobFloat.classList.add("active");
}, { passive: false });

joyZoneLeft.addEventListener("pointermove", (e) => {
  if(!joy.active || e.pointerId !== joy.pointerId) return;
  e.preventDefault();
  let dx = e.clientX - joy.originX, dy = e.clientY - joy.originY;
  const d = Math.sqrt(dx*dx + dy*dy);
  if(d > joy.maxRadius){ const s = joy.maxRadius/d; dx *= s; dy *= s; }
  joy.moveX = dx / joy.maxRadius;
  joy.moveY = -dy / joy.maxRadius;
  const r = joyZoneLeft.getBoundingClientRect();
  joyKnobFloat.style.left = (joy.originX - r.left + dx) + "px";
  joyKnobFloat.style.top = (joy.originY - r.top + dy) + "px";
}, { passive: false });

function releaseJoy(e){
  if(!joy.active || e.pointerId !== joy.pointerId) return;
  joy.active = false; joy.pointerId = null;
  joy.moveX = 0; joy.moveY = 0;
  joyBaseFloat.classList.remove("active");
  joyKnobFloat.classList.remove("active");
}
joyZoneLeft.addEventListener("pointerup", releaseJoy);
joyZoneLeft.addEventListener("pointercancel", releaseJoy);
joyZoneLeft.addEventListener("lostpointercapture", releaseJoy);

  const dy = e.clientY - camTouch.startY;
  cameraUserYaw = camTouch.startUserYaw - dx * CAM_SENSITIVITY_X;
  cameraUserPitch = camTouch.startUserPitch - dy * CAM_SENSITIVITY_Y;
  cameraUserPitch = Math.max(CAM_PITCH_MIN, Math.min(CAM_PITCH_MAX, cameraUserPitch));
}, { passive: false });

  el.addEventListener("lostpointercapture", () => { carKeys[key] = false; el.classList.remove("active"); });
}

async function enterCar(e){
  if(e){ e.preventDefault(); e.stopPropagation(); }
  if(mode !== "walking" || !carModel || !character) return;
  mode = "driving";
  character.visible = false;
  carHUD.style.display = "flex";
  carControls.classList.add("show");
  joyZoneLeftEl.classList.add("hidden");
  exitCarBtn.classList.add("show");
  enterCarBtn.classList.remove("show");
  hintEl.classList.add("hidden");
  joy.active = false; joy.moveX = 0; joy.moveY = 0;
  joyBaseFloat.classList.remove("active");
  joyKnobFloat.classList.remove("active");
  carState.speed = 0;
  if(!AudioEngine.loaded) await AudioEngine.init();
  AudioEngine.playStartup();
  cameraState.transitioning = true;
  cameraState.transitionProgress = 0;
  cameraUserYaw = 0; cameraUserPitch = 0;
  camAutoReturn.active = true;
  if(camAutoReturn.timer){ clearTimeout(camAutoReturn.timer); camAutoReturn.timer = null; }
  cameraBaseYaw = carState.rotation;
  SaveSystem.data.mode = "driving";
  SaveSystem.save();
}

function exitCar(e){
  if(e){ e.preventDefault(); e.stopPropagation(); }
  if(mode !== "driving" || !carModel || !character) return;
  mode = "walking";
  AudioEngine.stop();
  const rx = Math.cos(carState.rotation);
  const rz = -Math.sin(carState.rotation);
  const off = 2.8;
  let px = carState.position.x + rx * off;
  let pz = carState.position.z + rz * off;
  const res = resolveCharacterMove(px, pz, px, pz, CHAR_RADIUS);
  character.position.set(res.x, character.position.y, res.z);
  character.rotation.y = carState.rotation + MODEL_YAW_OFFSET;
  charYaw = carState.rotation;
  cameraBaseYaw = carState.rotation;
  character.visible = true;
  carHUD.style.display = "none";
  carControls.classList.remove("show");
  joyZoneLeftEl.classList.remove("hidden");
  exitCarBtn.classList.remove("show");
  hintEl.classList.remove("hidden");
  carState.speed = 0;
  gearIndicator.textContent = "N";
  gearIndicator.className = "neutral";
  cameraState.transitioning = true;
  cameraState.transitionProgress = 0;
  cameraUserYaw = 0; cameraUserPitch = 0;
  camAutoReturn.active = true;
  SaveSystem.data.mode = "walking";
  SaveSystem.save();
}

enterCarBtn.addEventListener("pointerdown", enterCar, {passive: false});
enterCarBtn.addEventListener("mousedown", enterCar);
exitCarBtn.addEventListener("pointerdown", exitCar, {passive: false});
exitCarBtn.addEventListener("mousedown", exitCar);

function releaseAllKeys(){
  ["forward","back","left","right"].forEach(k => keys[k] = false);
  ["forward","reverse","brake","left","right"].forEach(k => carKeys[k] = false);
  joy.active = false; joy.moveX = 0; joy.moveY = 0;
  joyBaseFloat.classList.remove("active");
  joyKnobFloat.classList.remove("active");
  document.querySelectorAll(".active").forEach(el => el.classList.remove("active"));
}
window.addEventListener("blur", releaseAllKeys);
document.addEventListener("visibilitychange", () => { 
  if(document.hidden){ 
    releaseAllKeys(); 
    SaveSystem.save();
  }
});

/* ============================================================
   Character walk
============================================================ */
const tmpDir = new THREE.Vector3();
const WALK_SPEED = 3.5, RUN_SPEED = 5.5;

function updateCharacterWalk(dt){
  if(!character || !character.visible) return;
  let inputX = joy.moveX, inputY = joy.moveY;
  if(keys.forward) inputY = 1;
  if(keys.back) inputY = -1;
  if(keys.left) inputX = -1;
  if(keys.right) inputX = 1;
  
  const camYaw = cameraBaseYaw + cameraUserYaw;
  const cFX = Math.sin(camYaw), cFZ = Math.cos(camYaw);
  const cRX = Math.sin(camYaw + Math.PI/2), cRZ = Math.cos(camYaw + Math.PI/2);
  tmpDir.set(cFX*inputY + cRX*inputX, 0, cFZ*inputY + cRZ*inputX);
  
  const mag = Math.min(1, Math.sqrt(inputX*inputX + inputY*inputY));
  const moving = mag > 0.1;
  
  if(moving && tmpDir.lengthSq() > 0.0001){
    tmpDir.normalize();
    const isRun = mag > 0.85;
    const sp = (isRun ? RUN_SPEED : WALK_SPEED) * mag;
    const ox = character.position.x, oz = character.position.z;
    let nx = ox + tmpDir.x * sp * dt;
    let nz = oz + tmpDir.z * sp * dt;
    nx = Math.max(-WORLD_LIMIT, Math.min(WORLD_LIMIT, nx));
    nz = Math.max(-WORLD_LIMIT, Math.min(WORLD_LIMIT, nz));
    const res = resolveCharacterMove(ox, oz, nx, nz, CHAR_RADIUS);
    character.position.x = res.x;
    character.position.z = res.z;
    const aDX = res.x - ox, aDZ = res.z - oz;
    if(aDX*aDX + aDZ*aDZ > 0.0001){
      const ta = Math.atan2(aDX, aDZ);
      let diff = ta - charYaw;
      while(diff > Math.PI) diff -= Math.PI*2;
      while(diff < -Math.PI) diff += Math.PI*2;
      charYaw += diff * Math.min(1, 10 * dt);
      character.rotation.y = charYaw + MODEL_YAW_OFFSET;
    }
    if(actions.run && isRun) setAction("run");
    else if(actions.walk) setAction("walk");
    else if(actions.idle) setAction("idle");
  } else {
    if(actions.idle) setAction("idle");
  }
}

/* ============================================================
   Car drive
============================================================ */
let wasMoving = false;

function updateCarDrive(dt){
  if(!carModel) return;

  let st = 0;
  if(carKeys.left) st = carState.maxSteerAngle;
  if(carKeys.right) st = -carState.maxSteerAngle;
  if(st !== 0) carState.steerAngle += (st - carState.steerAngle) * carState.steerSpeed * dt;
  else carState.steerAngle += (0 - carState.steerAngle) * carState.steerReturn * dt;

  if(carKeys.brake){
    if(carState.speed > 0) carState.speed = Math.max(0, carState.speed - carState.brakingForce * dt);
    else if(carState.speed < 0) carState.speed = Math.min(0, carState.speed + carState.brakingForce * dt);
  } else if(carKeys.forward){
    carState.speed = Math.min(carState.maxForwardSpeed, carState.speed + carState.acceleration * dt);
  } else if(carKeys.reverse){
    if(carState.speed > 0) carState.speed = Math.max(0, carState.speed - carState.brakingForce * dt);
    else carState.speed = Math.max(-carState.maxReverseSpeed, carState.speed - carState.reverseAcceleration * dt);
  } else {
    if(Math.abs(carState.speed) > 0.05){
      const f = carState.friction * dt;
      if(carState.speed > 0) carState.speed = Math.max(0, carState.speed - f);
      else carState.speed = Math.min(0, carState.speed + f);
    } else carState.speed = 0;
  }

  let newRot = carState.rotation;
  if(Math.abs(carState.speed) > 0.1){
    const spN = Math.abs(carState.speed) / carState.maxForwardSpeed;
    const sf = Math.min(1, 0.4 + (1 - spN) * 0.8);
    const dir = carState.speed >= 0 ? 1 : -1;
    newRot += carState.steerAngle * dir * sf * 1.8 * dt;
  }

  const fX = Math.sin(newRot), fZ = Math.cos(newRot);
  let nX = carState.position.x + fX * carState.speed * dt;
  let nZ = carState.position.z + fZ * carState.speed * dt;
  nX = Math.max(-WORLD_LIMIT, Math.min(WORLD_LIMIT, nX));
  nZ = Math.max(-WORLD_LIMIT, Math.min(WORLD_LIMIT, nZ));

  const collide = checkCarCollision(nX, nZ, newRot, carHalfWidth, carHalfLength);
  if(!collide){
    carState.rotation = newRot;
    carState.position.x = nX;
    carState.position.z = nZ;
  } else {
    const xC = checkCarCollision(nX, carState.position.z, newRot, carHalfWidth, carHalfLength);
    const zC = checkCarCollision(carState.position.x, nZ, newRot, carHalfWidth, carHalfLength);
    if(!xC && zC){ carState.rotation = newRot; carState.position.x = nX; carState.speed *= 0.6; }
    else if(xC && !zC){ carState.rotation = newRot; carState.position.z = nZ; carState.speed *= 0.6; }
    else { carState.speed *= 0.2; if(Math.abs(carState.speed) < 0.3) carState.speed = 0; }
  }

  carModel.position.copy(carState.position);
  carModel.rotation.y = carState.rotation + CAR_MODEL_YAW_OFFSET;

  carState.wheelRotation += carState.speed * dt * 2.5;
  const wr = carState.wheelRotation;
  if(carWheels.fl.steerGroup) carWheels.fl.steerGroup.rotation.y = carState.steerAngle;
  if(carWheels.fr.steerGroup) carWheels.fr.steerGroup.rotation.y = carState.steerAngle;
  if(carWheels.fl.spinGroup) carWheels.fl.spinGroup.rotation.x = wr;
  if(carWheels.fr.spinGroup) carWheels.fr.spinGroup.rotation.x = wr;
  if(carWheels.rl.spinGroup) carWheels.rl.spinGroup.rotation.x = wr;
  if(carWheels.rr.spinGroup) carWheels.rr.spinGroup.rotation.x = wr;

  const isMove = Math.abs(carState.speed) > 0.5;
  AudioEngine.update(dt, carState.speed, carKeys.forward, carKeys.reverse, mode === "driving");
  if(isMove && !wasMoving) onCarMoving();
  else if(!isMove && wasMoving) onCarStopped();
  wasMoving = isMove;

  const kmh = Math.abs(carState.speed * 3.6);
  carSpeedEl.textContent = kmh.toFixed(0);
  speedBarFill.style.width = Math.min(100, (kmh / (carState.maxForwardSpeed * 3.6)) * 100) + "%";
  if(carState.speed > 0.3){ gearIndicator.textContent = "D"; gearIndicator.className = ""; }
  else if(carState.speed < -0.3){ gearIndicator.textContent = "R"; gearIndicator.className = "reverse"; }
  else { gearIndicator.textContent = "N"; gearIndicator.className = "neutral"; }
}

function onCarMoving(){ if(AudioEngine.gainNode && AudioEngine.source === null) AudioEngine.startIdleLoop(); }
function onCarStopped(){ if(AudioEngine.gainNode && AudioEngine.source === null) AudioEngine.startIdleLoop(); }

/* ============================================================
   Proximity
============================================================ */
function checkEnterCarProximity(){
  if(mode !== "walking" || !character || !carModel){
    enterCarBtn.classList.remove("show");
    return;
  }
  const dx = character.position.x - carState.position.x;
  const dz = character.position.z - carState.position.z;
  if(Math.sqrt(dx*dx + dz*dz) < ENTER_DISTANCE) enterCarBtn.classList.add("show");
  else enterCarBtn.classList.remove("show");
}

/* ============================================================
   Camera
============================================================ */
const cameraState = {
  smoothTarget: new THREE.Vector3(0, 1, 0),
  transitioning: false,
  transitionProgress: 1
};
const currentCamParams = {
  distance: CAM_WALK.distance,
  height: CAM_WALK.height,
  lookHeight: CAM_WALK.lookHeight
};

function dampAngle(c, t, l, dt){
  let d = t - c;
  while(d > Math.PI) d -= Math.PI * 2;
  while(d < -Math.PI) d += Math.PI * 2;
  return c + d * (1 - Math.exp(-l * dt));
}

const _camDesired = new THREE.Vector3();
const _lookTarget = new THREE.Vector3();

function updateCamera(dt){
  let tp = null, ry = 0, tc = null;
  if(mode === "driving" && carModel){
    tp = carState.position; ry = carState.rotation; tc = CAM_DRIVE;
  } else if(character){
    tp = character.position; ry = charYaw; tc = CAM_WALK;
  } else return;

  const yl = (mode === "driving") ? 8.0 : 5.0;
  cameraBaseYaw = dampAngle(cameraBaseYaw, ry, yl, dt);

  if(cameraState.transitioning){
    cameraState.transitionProgress = Math.min(1, cameraState.transitionProgress + dt * 1.5);
    const t = cameraState.transitionProgress;
    const s = t * t * (3 - 2 * t);
    currentCamParams.distance = THREE.MathUtils.lerp(currentCamParams.distance, tc.distance, s);
    currentCamParams.height = THREE.MathUtils.lerp(currentCamParams.height, tc.height, s);
    currentCamParams.lookHeight = THREE.MathUtils.lerp(currentCamParams.lookHeight, tc.lookHeight, s);
    if(t >= 1) cameraState.transitioning = false;
  } else {
    currentCamParams.distance += (tc.distance - currentCamParams.distance) * Math.min(1, dt * 4);
    currentCamParams.height += (tc.height - currentCamParams.height) * Math.min(1, dt * 4);
    currentCamParams.lookHeight += (tc.lookHeight - currentCamParams.lookHeight) * Math.min(1, dt * 4);
  }

  if(camAutoReturn.active && !camTouch.active){
    cameraUserYaw = dampAngle(cameraUserYaw, 0, CAM_AUTO_RETURN_SPEED, dt);
    cameraUserPitch += (0 - cameraUserPitch) * (1 - Math.exp(-CAM_AUTO_RETURN_SPEED * dt));
  }

  const fy = cameraBaseYaw + cameraUserYaw;
  const p = cameraUserPitch;
  const bX = -Math.sin(fy), bZ = -Math.cos(fy);
  const pC = Math.cos(p), pS = Math.sin(p);

  _camDesired.set(
    tp.x + bX * currentCamParams.distance * pC,
    tp.y + currentCamParams.height + pS * currentCamParams.distance,
    tp.z + bZ * currentCamParams.distance * pC
  );
  if(_camDesired.y < 0.6) _camDesired.y = 0.6;

  const pl = (mode === "driving") ? 10 : 8;
  camera.position.lerp(_camDesired, 1 - Math.exp(-pl * dt));

  _lookTarget.set(tp.x, tp.y + currentCamParams.lookHeight, tp.z);
  cameraState.smoothTarget.lerp(_lookTarget, 1 - Math.exp(-14 * dt));
  camera.lookAt(cameraState.smoothTarget);
}

/* ============================================================
   Auto-Save
============================================================ */
let saveTimer = 0;
function doAutoSave(dt){
  saveTimer += dt;
  if(saveTimer > 2){
    saveTimer = 0;
    if(character){
      SaveSystem.data.charPos = { 
        x: character.position.x, 
        y: character.position.y, 
        z: character.position.z 
      };
      SaveSystem.data.charYaw = charYaw;
    }
    if(carModel){
      SaveSystem.data.carPos = { 
        x: carState.position.x, 
        y: carState.position.y, 
        z: carState.position.z 
      };
      SaveSystem.data.carRotation = carState.rotation;
    }
    SaveSystem.data.mode = mode;
    SaveSystem.data.savedAt = Date.now();
    SaveSystem.save();
  }
}

/* ============================================================
   Main loop
============================================================ */
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if(mixer) mixer.update(dt);
  if(mode === "walking"){
    updateCharacterWalk(dt);
    checkEnterCarProximity();
  } else if(mode === "driving"){
    updateCarDrive(dt);
  }
  updateCamera(dt);
  doAutoSave(dt);
  composer.render();
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloomPass.setSize(innerWidth, innerHeight);
});

window.addEventListener("beforeunload", () => {
  if(character){
    SaveSystem.data.charPos = { 
      x: character.position.x, 
      y: character.position.y, 
      z: character.position.z 
    };
    SaveSystem.data.charYaw = charYaw;
  }
  if(carModel){
    SaveSystem.data.carPos = { 
      x: carState.position.x, 
      y: carState.position.y, 
      z: carState.position.z 
    };
    SaveSystem.data.carRotation = carState.rotation;
  }
  SaveSystem.data.mode = mode;
  SaveSystem.save();
});
</script>
